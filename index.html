  }
}

function htmlToDocxElements(bodyHtml){
  const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, HeadingLevel, ImageRun, TableLayoutType, AlignmentType, BorderStyle, Tab, TabStopType } = docx;
  const parsed = new DOMParser().parseFromString(`<div>${bodyHtml}</div>`, 'text/html');
  const root = parsed.body.firstElementChild;
  const elements = [];
  const PAGE_WIDTH_DXA = 9026; // usable width for an A4 page with 1440-twip margins (must match the Document's page setup below)

  // Recursively pulls text out of a cell, inserting a separator wherever the
  // source HTML has a line break (e.g. "<td>123 Main St<br>John Smith</td>")
  // or a boundary between child elements/text nodes, so values don't get
  // smashed together the way plain textContent would.
  const textOf = (node) => {
    const parts = [];
    node.childNodes.forEach(child=>{
      if(child.nodeType === 3){
        const t = child.textContent;
        if(t && t.trim()) parts.push(t.trim());
      } else if(child.nodeType === 1){
        if(child.tagName === 'BR'){ parts.push('·'); return; }
        const t = textOf(child);
        if(t) parts.push(t);
      }
    });
    return parts.join(' ').replace(/\s+/g,' ').trim();
  };

  const cellBorder = { style: BorderStyle.SINGLE, size: 4, color: 'D5DBDF' };
  const tableBorders = {
    top: cellBorder, bottom: cellBorder, left: cellBorder, right: cellBorder,
    insideHorizontal: cellBorder, insideVertical: cellBorder
  };
  const cellMargins = { top: 60, bottom: 60, left: 100, right: 100 };

  Array.from(root.children).forEach(node=>{
    const tag = node.tagName;
    const imgs = node.querySelectorAll ? node.querySelectorAll('img') : [];
    if(tag === 'TABLE'){
      const trs = Array.from(node.querySelectorAll('tr'));

      // Some reports (e.g. the round cleaning dates list) ask for tab-separated text in the
      // Word export instead of a real table object, so the rows are plain, easily-editable
      // lines rather than table cells. A literal tab character inside run text isn't enough —
      // Word only treats it as a real tab stop when it's an explicit Tab() between runs.
      if(node.classList.contains('rpt-table-as-tabs')){
        trs.forEach(tr=>{
          const cellNodes = Array.from(tr.children);
          if(!cellNodes.length) return;
          const isHeaderRow = cellNodes.some(td => td.tagName === 'TH');
          const runChildren = [];
          cellNodes.forEach((td, i)=>{
            if(i > 0) runChildren.push(new Tab());
            runChildren.push(textOf(td));
          });
          elements.push(new Paragraph({
            tabStops: [{ type: TabStopType.LEFT, position: 2600 }, { type: TabStopType.LEFT, position: 5200 }],
            children: [ new TextRun({ children: runChildren, bold: isHeaderRow }) ]
          }));
        });
        elements.push(new Paragraph({ text: '' }));
        return;
      }

      let numCols = 0;
      trs.forEach(tr => {
        let span = 0;
        Array.from(tr.children).forEach(td => { span += Math.max(1, parseInt(td.getAttribute('colspan')||'1',10)); });
        numCols = Math.max(numCols, span);
      });

      if(numCols > 0){
        const baseWidth = Math.floor(PAGE_WIDTH_DXA / numCols);
        const columnWidths = Array(numCols).fill(baseWidth);
        columnWidths[numCols-1] += PAGE_WIDTH_DXA - (baseWidth * numCols); // give rounding remainder to the last column
        const rows = [];
        trs.forEach(tr=>{
          const cellNodes = Array.from(tr.children);
          if(!cellNodes.length) return;
          const isHeaderRow = cellNodes.some(td => td.tagName === 'TH');
          let colIndex = 0;
          const cells = cellNodes.map(td=>{
            const span = Math.max(1, parseInt(td.getAttribute('colspan')||'1',10));
            const widthDxa = columnWidths.slice(colIndex, colIndex+span).reduce((a,b)=>a+b,0);
            colIndex += span;
            const styleAttr = td.getAttribute('style') || '';
            const alignRight = /text-align\s*:\s*right/i.test(styleAttr);
            const isBold = td.tagName==='TH' || /font-weight\s*:\s*(bold|[7-9]00)/i.test(styleAttr);
            const cellConfig = {
              children: [new Paragraph({
                alignment: alignRight ? AlignmentType.RIGHT : undefined,
                children: [new TextRun({ text: textOf(td), bold: isBold })]
              })],
              width: { size: widthDxa, type: WidthType.DXA },
              margins: cellMargins
            };
            if(span > 1) cellConfig.columnSpan = span;
            if(isHeaderRow) cellConfig.shading = { fill: 'EFF3F5' };
            return new TableCell(cellConfig);
          });
          rows.push(new TableRow({ children: cells, cantSplit: true }));
        });
        if(rows.length){
          const tableConfig = {
            rows,
            columnWidths,
            width: { size: PAGE_WIDTH_DXA, type: WidthType.DXA },
            borders: tableBorders
          };
          if(TableLayoutType && TableLayoutType.FIXED){ tableConfig.layout = TableLayoutType.FIXED; }
          elements.push(new Table(tableConfig));
          elements.push(new Paragraph({ text: '' }));
        }
      }
    } else if(imgs.length){
      imgs.forEach(img=>{
        const src = img.getAttribute('src') || '';
        if(!src.startsWith('data:image')) return;
        try{
          const base64 = src.split(',')[1];
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
          let w = 160, h = 160;
          if(img.classList.contains('inv-logo') && src.startsWith('data:image/png')){
            // Logos are PNGs from compressLogo() — read the natural size straight out of the
            // PNG IHDR chunk (big-endian uint32 width/height at fixed byte offsets) so the
            // logo keeps its own aspect ratio in the Word export instead of being forced square.
            const nw = ((bytes[16]<<24) | (bytes[17]<<16) | (bytes[18]<<8) | bytes[19]) >>> 0;
            const nh = ((bytes[20]<<24) | (bytes[21]<<16) | (bytes[22]<<8) | bytes[23]) >>> 0;
            if(nw > 0 && nh > 0){
              const maxW = 200, maxH = 90;
              const scale = Math.min(maxW/nw, maxH/nh, 1);
              w = Math.round(nw*scale); h = Math.round(nh*scale);
            }
          }
          elements.push(new Paragraph({ children: [ new ImageRun({ data: bytes, transformation: { width: w, height: h } }) ] }));
        }catch(e){ /* skip a photo that fails to embed rather than aborting the whole export */ }
      });
    } else if(tag === 'DIV' && node.classList.contains('rpt-round-title')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ text: t, heading: HeadingLevel.HEADING_2, spacing:{ before:200, after:100 } }));
    } else if(tag === 'DIV' && node.classList.contains('rpt-total')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t, bold:true })], spacing:{ before:100, after:200 } }));
    } else if(tag === 'DIV' && node.classList.contains('rpt-empty-note')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t, italics:true })] }));
    } else {
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t })], spacing:{ after:120 } }));
    }
  });
  return elements;
}

async function exportPendingReportDocx(){
  if(typeof docx === 'undefined'){
    toast('Still loading — try again in a moment, or once you have signal');
    return;
  }
  try{
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
    const plainTitle = pendingReportTitle.replace(/<[^>]+>/g,'');
    const company = pendingReportHideCompany ? '' : (data.settings.companyName || '');

    const headerChildren = [ new Paragraph({ text: plainTitle, heading: HeadingLevel.HEADING_1 }) ];
    if(company) headerChildren.push(new Paragraph({ children:[new TextRun({ text: company, italics:true })] }));
    headerChildren.push(new Paragraph({ children:[new TextRun({ text: reportDate(), color:'666666' })], spacing:{ after:300 } }));

    const bodyChildren = htmlToDocxElements(pendingReportBody);

    const wordDoc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 }, // A4, in twips (DXA)
            margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 }
          }
        },
        children: [...headerChildren, ...bodyChildren]
      }]
    });

    const blob = await Packer.toBlob(wordDoc);
    const filename = `${plainTitle.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${todayISO()}.docx`;

    if(navigator.canShare){
      try{
        const file = new File([blob], filename, { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        if(navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title: plainTitle });
          closeSheet();
          toast('Word document shared');
          return;
        }
      }catch(e){
        if(e && e.name === 'AbortError'){ closeSheet(); return; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    closeSheet();
    toast('Word document saved');
  }catch(e){
    toast('Could not create the Word document — try Print instead');
  }
}

function printRoundsLastCleaned(){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  if(!roundNames.length){
    runPrint('Round Cleaning Dates', '<div class="rpt-empty-note">No rounds yet.</div>');
    return;
  }
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 35);
  const cutoffISO = cutoff.toISOString().slice(0,10);

  const rows = roundNames.map(rn=>{
    const custs = rounds[rn];
    const dateSet = new Set();
    let latestOverall = null;
    custs.forEach(c=>{
      (c.cleanHistory||[]).forEach(e=>{
        if(!e.date) return;
        if(e.date >= cutoffISO) dateSet.add(e.date);
        if(!latestOverall || e.date > latestOverall) latestOverall = e.date;
      });
    });
    const sortedDates = Array.from(dateSet).sort().reverse();
    const datesCell = sortedDates.length
      ? sortedDates.map(d=>fmtDate(d)).join(', ')
      : `<span style="color:#66798A;">None in the last 5 weeks${latestOverall ? ' · last cleaned ' + fmtDate(latestOverall) : ' · never cleaned'}</span>`;
    return `<tr>
      <td>${escapeHtml(rn)}</td>
      <td>${datesCell}</td>
    </tr>`;
  }).join('');
  const body = `<table class="rpt-table rpt-table-as-tabs"><thead><tr><th>Round</th><th>Dates cleaned (last 5 weeks)</th></tr></thead><tbody>${rows}</tbody></table>`;
  runPrint('Round Cleaning Dates', body);
}

function printRoundsLastCleanedCalendar(){
  if(!data.customers.length){
    runPrint('Round Cleaning Dates — Calendar', '<div class="rpt-empty-note">No rounds yet.</div>');
    return;
  }
  const today = new Date();
  today.setHours(0,0,0,0);
  const rangeStart = new Date(today);
  rangeStart.setDate(rangeStart.getDate() - 34); // 35-day (5-week) window including today

  const rsDow = rangeStart.getDay();
  const rsDiffToMonday = (rsDow === 0) ? 6 : rsDow - 1;
  const gridStart = new Date(rangeStart);
  gridStart.setDate(gridStart.getDate() - rsDiffToMonday);

  const cleanedByDate = {};
  data.customers.forEach(c=>{
    (c.cleanHistory||[]).forEach(e=>{
      if(!e.date) return;
      if(!cleanedByDate[e.date]) cleanedByDate[e.date] = new Set();
      cleanedByDate[e.date].add(c.round || 'Unassigned');
    });
  });

  const totalWeeks = Math.ceil((Math.round((today - gridStart) / 86400000) + 1) / 7);
  let bodyRows = '';
  for(let w=0; w<totalWeeks; w++){
    bodyRows += '<tr>';
    for(let d=0; d<7; d++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w*7 + d);
      const iso = cellDate.toISOString().slice(0,10);
      const outside = cellDate < rangeStart || cellDate > today;
      const roundsCleaned = cleanedByDate[iso] ? Array.from(cleanedByDate[iso]).sort((a,b)=>a.localeCompare(b)) : [];
      const dayNum = cellDate.getDate();
      const monthLabel = (dayNum === 1) ? cellDate.toLocaleDateString('en-GB',{month:'short'}) + ' ' : '';
      bodyRows += `<td class="${outside?'outside':''}">
        <div class="daynum">${monthLabel}${dayNum}</div>
        ${roundsCleaned.map(rn=>`<span class="round-chip" style="background:#E2F5EA; color:#1F7A46;">${escapeHtml(rn)}</span>`).join('')}
      </td>`;
    }
    bodyRows += '</tr>';
  }

  const body = `
    <table class="rpt-calendar">
      <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Shows any round with a customer cleaned on that day. Greyed-out days fall outside the last 5 weeks.</p>
  `;
  runPrint('Round Cleaning Dates — Calendar', body);
}

function printWindowsDue(){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  let body = '';
  let anyRoundShown = false;
  roundNames.forEach((rn)=>{
    const custs = rounds[rn].filter(c=>{
      const s = custStatus(c);
      return !c.paused && s.cleanBadge && (s.cleanBadge.type==='due' || s.cleanBadge.type==='overdue');
    }).sort((a,b)=>{
      const sa=custStatus(a), sb=custStatus(b);
      const rank = x => x.cleanBadge.type==='overdue' ? 0 : 1;
      return rank(sa)-rank(sb);
    });
    if(!custs.length) return;
    body += `<div class="rpt-round-title${anyRoundShown?' rpt-page-break':''}">${escapeHtml(rn)}</div>`;
    anyRoundShown = true;
    const rows = custs.map(c=>{
      const s = custStatus(c);
      const flagClass = s.cleanBadge.type;
      const flagText = s.cleanBadge.type==='overdue' ? 'Overdue' : 'Due';
      return `<tr>
        <td>${escapeHtml(c.address||'')}${c.name?`<br><span style="color:#66798A">${escapeHtml(c.name)}</span>`:''}</td>
        <td>${fmtDate(s.lastClean)}</td>
        <td>${fmtDate(nextDueISO(c))}</td>
        <td class="rpt-flag ${flagClass}">${flagText}</td>
      </tr>`;
    }).join('');
    body += `<table class="rpt-table"><thead><tr><th>Customer</th><th>Last cleaned</th><th>Next due</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  });
  if(!anyRoundShown) body = '<div class="rpt-empty-note">Nobody\'s due or overdue a clean right now.</div>';
  runPrint('Windows Due, by Round', body);
}

function printMoneyOwed(){
  const owedCusts = data.customers.filter(c=>custStatus(c).owed);
  const rounds = groupByRound(owedCusts);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  let total = 0;
  let rows = '';
  roundNames.forEach(rn=>{
    const custs = rounds[rn].slice().sort((a,b)=>custStatus(b).balance-custStatus(a).balance);
    custs.forEach(c=>{
      const s = custStatus(c);
      total += s.balance;
      rows += `<tr>
        <td style="font-weight:700;">${escapeHtml(rn)}</td>
        <td>${escapeHtml(c.address||'')}${(c.name||c.phone)?`<br><span style="color:#66798A">${[escapeHtml(c.name||''), c.phone?escapeHtml(c.phone):''].filter(Boolean).join(' · ')}</span>`:''}</td>
        <td>${fmtDate(s.lastPaid)}</td>
        <td class="rpt-flag overdue" style="text-align:right;">${money(s.balance)}</td>
      </tr>`;

}

function printFullRounds(){
  const rounds = groupByRound(data.customers);

  let grandCount = 0;

        <td>Every ${c.frequencyWeeks||4}wk</td>

function getLastPriceIncreaseDate(c){
  const hist = (c.priceHistory||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!hist.length) return null;
  let lastIncrease = hist[0].date;
  for(let i=1; i<hist.length; i++){
    if(hist[i].price > hist[i-1].price) lastIncrease = hist[i].date;
  }
  return lastIncrease;
}

function printPriceReview(){
  const flagged = [];
  data.customers.forEach(c=>{
    const lastIncrease = getLastPriceIncreaseDate(c);
    if(!lastIncrease) return;
    const target = nextDueISO(c) || todayISO();
    const days = daysBetween(lastIncrease, target);
    if(days >= 365){
      flagged.push({ c, lastIncrease, target, days });
    }
  });
  flagged.sort((a,b)=> b.days - a.days);

  if(!flagged.length){
    runPrint('Price Review Due', '<div class="rpt-empty-note">Nobody is due a price review right now.</div>');
    return;
  }

  const rows = flagged.map(({c, lastIncrease, target})=>`<tr>
    <td>${escapeHtml(c.address||'')}${c.name?`<br><span style="color:#66798A">${escapeHtml(c.name)}</span>`:''}</td>
    <td>${escapeHtml(c.round||'Unassigned')}</td>
    <td style="text-align:right;">${money(c.price)}</td>
    <td>${fmtDate(lastIncrease)}</td>
    <td>${fmtDate(target)}</td>
  </tr>`).join('');
  const body = `
    <table class="rpt-table"><thead><tr><th>Customer</th><th>Round</th><th style="text-align:right;">Current price</th><th>Last increase</th><th>Next clean</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Shows customers where it will have been 12 months or more since their last price increase by their next scheduled clean. Customers with no price history are not included.</p>
  `;
  runPrint('Price Review Due', body);
}

function printEarnings(){
  const payments = [];
  data.customers.forEach(c=>{
    (c.paymentHistory||[]).forEach(p=>{
      payments.push({date: p.date, amount: Number(p.amount||0)});
    });
  });
  (data.oneOffJobs||[]).forEach(j=>{
    if(j.paid){
      payments.push({date: j.paidDate || j.date, amount: Number(j.price||0)});
    }
  });

  if(!payments.length){
    runPrint('Earnings Report', '<div class="rpt-empty-note">No payments recorded yet.</div>');
    return;
  }

  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
  const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth()-1);
  const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear()-1);
  const sumSince = (from) => payments.filter(p=>new Date(p.date+'T00:00:00') >= from).reduce((s,p)=>s+p.amount,0);
  const allTime = payments.reduce((s,p)=>s+p.amount,0);

  const byMonth = {};
  payments.forEach(p=>{
    const key = (p.date||'').slice(0,7);
    if(!key) return;
    byMonth[key] = (byMonth[key]||0) + p.amount;
  });
  const monthKeys = Object.keys(byMonth).sort().reverse().slice(0,12);

  const body = `
    <table class="rpt-table" style="margin-bottom:20px;">
      <tbody>
        <tr><td>Last 7 days</td><td style="text-align:right; font-weight:800;">${money(sumSince(weekAgo))}</td></tr>
        <tr><td>Last 30 days</td><td style="text-align:right; font-weight:800;">${money(sumSince(monthAgo))}</td></tr>
        <tr><td>Last 12 months</td><td style="text-align:right; font-weight:800;">${money(sumSince(yearAgo))}</td></tr>
        <tr><td>All time</td><td style="text-align:right; font-weight:800;">${money(allTime)}</td></tr>
      </tbody>
    </table>
    <div class="rpt-round-title" style="margin-top:0;">By month</div>
    <table class="rpt-table">
      <thead><tr><th>Month</th><th style="text-align:right;">Total</th></tr></thead>
      <tbody>
        ${monthKeys.map(k=>{
          const d = new Date(k+'-01T00:00:00');
          const label = d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
          return `<tr><td>${label}</td><td style="text-align:right;">${money(byMonth[k])}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  runPrint('Earnings Report', body);
}

function printDailyWork(){
  const dailyTotals = {};
  function addToDay(dateISO, amount){
    if(!dateISO) return;
    if(!dailyTotals[dateISO]) dailyTotals[dateISO] = { total: 0, count: 0 };
    dailyTotals[dateISO].total += Number(amount || 0);
    dailyTotals[dateISO].count += 1;
  }

  data.customers.forEach(c=>{
    (c.cleanHistory||[]).forEach(e=> addToDay(e.date, e.amount));
  });
  (data.oneOffJobs||[]).forEach(j=>{
    if(j.done) addToDay(j.date, j.price);
  });

  const today = new Date();
  const rows = [];
  let grandTotal = 0;
  let grandCount = 0;
  for(let i=29; i>=0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0,10);
    const info = dailyTotals[iso] || { total: 0, count: 0 };
    grandTotal += info.total;
    grandCount += info.count;
    rows.push(`<tr>
      <td>${fmtDate(iso)}</td>
      <td>${info.count || ''}</td>
      <td style="text-align:right; ${info.total ? 'font-weight:700;' : 'color:#66798A;'}">${info.total ? money(info.total) : '—'}</td>
    </tr>`);
  }

  const body = `
    <table class="rpt-table">
      <thead><tr><th>Date</th><th>Cleans / jobs</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div class="rpt-total" style="border-top:2px solid #10344C; padding-top:10px; margin-top:16px; font-size:16px;">
      30-day total: ${money(grandTotal)} across ${grandCount} clean${grandCount===1?'':'s'}/job${grandCount===1?'':'s'}
    </div>
  `;
  runPrint('Daily Work Done — Last 30 Days', body);
}

function printSchedule(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const rangeEnd = new Date(today);
  rangeEnd.setDate(rangeEnd.getDate() + 30);

  // Find the Monday on/before today so the calendar always shows full weeks
  const dow = today.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow === 0) ? 6 : dow - 1;
  const gridStart = new Date(today);
  gridStart.setDate(gridStart.getDate() - diffToMonday);

  // Rounds that actually span more than one visit day get a "(Day N)" suffix on their chip,
  // so a round split across several days shows up correctly on each of those days rather
  // than as one ambiguous chip. Single-day rounds are shown exactly as before.
  const roundsAll = groupByRound(data.customers);
  const multiDayRounds = new Set(Object.keys(roundsAll).filter(rn => roundDaysUsed(roundsAll[rn]).length > 1));

  // Which rounds have a customer next due on each date, within the next 30 days
  const dueByDate = {};
  data.customers.forEach(c=>{
    if(c.paused) return;
    const next = nextDueISO(c);
    if(!next) return;
    if(!dueByDate[next]) dueByDate[next] = new Set();
    const rn = c.round || 'Unassigned';
    dueByDate[next].add(multiDayRounds.has(rn) ? `${rn} (Day ${c.visitDay||1})` : rn);
  });

  // One-off jobs scheduled on each date, within the next 30 days
  const jobsByDate = {};
  (data.oneOffJobs||[]).forEach(j=>{
    if(j.done || !j.date) return;
    if(!jobsByDate[j.date]) jobsByDate[j.date] = [];
    jobsByDate[j.date].push(j);
  });

  let bodyRows = '';
  for(let w=0; w<5; w++){
    bodyRows += '<tr>';
    for(let d=0; d<7; d++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w*7 + d);
      const iso = cellDate.toISOString().slice(0,10);
      const outside = cellDate < today || cellDate > rangeEnd;
      const roundsDue = dueByDate[iso] ? Array.from(dueByDate[iso]).sort((a,b)=>a.localeCompare(b)) : [];
      const jobsDue = jobsByDate[iso] || [];
      const dayNum = cellDate.getDate();
      const monthLabel = (dayNum === 1) ? cellDate.toLocaleDateString('en-GB',{month:'short'}) + ' ' : '';
      bodyRows += `<td class="${outside?'outside':''}">
        <div class="daynum">${monthLabel}${dayNum}</div>
        ${roundsDue.map(rn=>`<span class="round-chip">${escapeHtml(rn)}</span>`).join('')}
        ${jobsDue.map(j=>`<span class="round-chip job-chip">🔧 ${escapeHtml(j.address||j.name||'Job')}</span>`).join('')}
      </td>`;
    }
    bodyRows += '</tr>';
  }

  const body = `
    <table class="rpt-calendar">
      <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Blue chips show any round with a customer due for cleaning that day, based on their last clean date and frequency — rounds split across several visit days show which day is due. Amber chips (🔧) show one-off jobs scheduled that day. Greyed-out days fall outside the next 30 days. Customers not yet cleaned at all aren't included, since there's no date to schedule from.</p>
  `;
  runPrint('Monthly Schedule', body);
}

// Rough byte size of the whole saved dataset, plus a breakdown for photos (usually
// the biggest share by far, since they're stored as base64 text alongside everything
// else). Used to give a plain-English "storage used" figure in Backup & restore.
function computeStorageStats(){
  const jsonStr = JSON.stringify(data);
  const totalBytes = new Blob([jsonStr]).size;
  let photoBytes = 0, photoCount = 0;
  (data.customers||[]).forEach(c=>{
    (c.photos||[]).forEach(p=>{
      if(p.dataUrl){ photoBytes += new Blob([p.dataUrl]).size; photoCount++; }
    });
  });
  (data.oneOffJobs||[]).forEach(j=>{
    (j.photos||[]).forEach(p=>{
      if(p.dataUrl){ photoBytes += new Blob([p.dataUrl]).size; photoCount++; }
    });
  });
  const logoBytes = (data.settings && data.settings.logo) ? new Blob([data.settings.logo]).size : 0;
  return { totalBytes, photoBytes, photoCount, logoBytes };
}
function formatBytes(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

  const stats = computeStorageStats();
  // 5MB is the tightest common browser quota (iOS Safari) — a conservative baseline
  // so the bar turns amber/red before anyone actually hits a "storage full" error.
  const assumedLimitBytes = 5 * 1024 * 1024;
  const pctUsed = Math.min(100, Math.round((stats.totalBytes / assumedLimitBytes) * 100));

      </div>
      <div style="height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:10px;">

async function exportData(){
  const jsonStr = JSON.stringify(data, null, 2);
  const filename = `round-book-backup-${todayISO()}.json`;

  const markBackedUp = ()=>{
    localStorage.setItem('roundBookLastBackup', todayISO());
    bannerDismissed = false;
    renderBackupBanner();
  };

  if(navigator.canShare){
    try{
      const file = new File([jsonStr], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Round Book Backup'});
        markBackedUp();
        toast('Backup shared');
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      // fall through to classic download on any other failure
    }
  }

  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  markBackedUp();
  toast('Backup saved');
}
document.getElementById('importFile').addEventListener('change', function(e){

/* ---------- import customers from spreadsheet ---------- */
const IMPORT_COLUMN_SYNONYMS = {
  address:   ['address','addr','street','street address','property','location'],
  name:      ['name','customer','customer name','client','clientname','contact name'],
  phone:     ['phone','mobile','tel','telephone','contact','contact number','phone number'],
  email:     ['email','email address','e-mail'],
  round:     ['round','route','area','zone','round name'],
  price:     ['price','amount','cost','fee','value','rate','clean price'],
  frequency: ['frequency','freq','weeks','cycle','interval','frequency (weeks)']
};
function normalizeHeader(h){
  return String(h||'').toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
}
function guessColumnMap(headers){
  const norm = headers.map(normalizeHeader);
  const map = {};
  Object.keys(IMPORT_COLUMN_SYNONYMS).forEach(field=>{
    const synonyms = IMPORT_COLUMN_SYNONYMS[field];
    let found = null;
    // exact match first, then "contains"
    for(const syn of synonyms){
      const idx = norm.indexOf(syn);
      if(idx !== -1){ found = headers[idx]; break; }
    }
    if(!found){
      for(let i=0;i<norm.length;i++){
        if(synonyms.some(syn => norm[i].includes(syn))){ found = headers[i]; break; }
      }
    }
    map[field] = found;
  });
  return map;
}
document.getElementById('importSpreadsheetFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    toast('Still loading — try again in a moment, or once you have signal');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      const firstSheetName = wb.SheetNames[0];
      const ws = wb.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ alert('That spreadsheet looks empty — no rows found on the first sheet.'); e.target.value=''; return; }
      const headers = Object.keys(rows[0]);
      const map = guessColumnMap(headers);
      if(!map.address && !map.name){
        alert("Couldn't find an address or name column in that spreadsheet. Make sure the first row has column headers like \"Address\" and \"Name\".");
        e.target.value = '';
        return;
      }

      const existingAddresses = new Set(data.customers.map(c => (c.address||'').trim().toLowerCase()).filter(Boolean));
      let imported = 0, skipped = 0;
      const roundCusts = data.customers.filter(x=>(x.round||'Unassigned')===IMPORT_HOLDING_ROUND);
      let nextOrder = roundCusts.reduce((m,x)=>Math.max(m, x.order!=null?x.order:-1), -1) + 1;

      rows.forEach(row=>{
        const address = map.address ? String(row[map.address]||'').trim() : '';
        const name = map.name ? String(row[map.name]||'').trim() : '';
        if(!address && !name) return; // blank row

        const normalized = address.toLowerCase();
        if(address && existingAddresses.has(normalized)){ skipped++; return; }

        const suggestedRound = map.round ? String(row[map.round]||'').trim() : '';
        const priceRaw = map.price ? parseFloat(String(row[map.price]).replace(/[^0-9.]/g,'')) : NaN;
        const freqRaw = map.frequency ? parseInt(String(row[map.frequency]).replace(/[^0-9]/g,''),10) : NaN;

        const notesParts = [];
        if(suggestedRound) notesParts.push(`Imported — suggested round: ${suggestedRound}`);
        else notesParts.push('Imported from spreadsheet');

        data.customers.push({
          id: uid(),
          name, address,
          phone: map.phone ? String(row[map.phone]||'').trim() : '',
          email: map.email ? String(row[map.email]||'').trim() : '',
          round: IMPORT_HOLDING_ROUND,
          order: nextOrder++,
          price: Number.isFinite(priceRaw) ? priceRaw : 0,
          frequencyWeeks: Number.isFinite(freqRaw) && freqRaw>0 ? freqRaw : 4,
          notes: notesParts.join(' · '),
          cleanHistory: [], paymentHistory: [], priceHistory: []
        });
        if(address) existingAddresses.add(normalized);
        imported++;
      });

      saveData();
      closeSheet();
      render();

      const summary = skipped
        ? `Imported ${imported} customer${imported===1?'':'s'} — ${skipped} skipped as likely duplicates`
        : `Imported ${imported} customer${imported===1?'':'s'}`;
      if(imported){
        openSheet(`
          <div class="sheet-head">
            <h2>Import complete</h2>
            <button class="sheet-close" onclick="closeSheet()">✕</button>
          </div>
          <p style="color:var(--ink); font-size:0.875rem; line-height:1.6; margin:0 2px 10px;">${escapeHtml(summary)}.</p>
          <p style="color:var(--ink-muted); font-size:0.8125rem; line-height:1.6; margin:0 2px 18px;">They've been placed in a <b>"${escapeHtml(IMPORT_HOLDING_ROUND)}"</b> round rather than their real round, since columns were matched automatically and might not be perfect. Open each one to check the details and assign it to the right round.</p>
          <button class="btn-primary" style="width:100%;" onclick="closeSheet(); setTab('rounds'); openRound(IMPORT_HOLDING_ROUND);">Review imported customers</button>
        `);
      } else {
        toast(skipped ? `All ${skipped} rows already exist — nothing imported` : 'Nothing to import');
      }
    }catch(err){
      alert('That file could not be read. Make sure it\'s a .csv or .xlsx spreadsheet with a header row.');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

async function exportExcel(){
  if(typeof XLSX === 'undefined'){
    toast('Still loading — try again in a moment, or once you have signal');
    return;
  }
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  if(!roundNames.length){ toast('No customers to export yet'); return; }

  const wb = XLSX.utils.book_new();
  const usedNames = {};
  function safeSheetName(name){
    let base = (name||'Round').replace(/[\\\/:\*\?\[\]]/g,'').trim().slice(0,31) || 'Round';
    let final = base, i = 2;
    while(usedNames[final]){
      const suffix = ` (${i})`;
      final = base.slice(0, 31-suffix.length) + suffix;
      i++;
    }
    usedNames[final] = true;
    return final;
  }

  const summaryRows = roundNames.map(rn=>{
    const custs = rounds[rn].filter(c=>!c.paused);
    const total = custs.reduce((sum,c)=>sum+Number(c.price||0),0);
    const avg = custs.length ? total/custs.length : 0;
    return {
      'Round': rn,
      'Customers': custs.length,
      'Round Value': total,
      'Average / Customer': Math.round(avg * 100) / 100
    };
  });
  const activeOverall = data.customers.filter(c=>!c.paused);
  const overallCustomers = activeOverall.length;
  const overallValue = activeOverall.reduce((sum,c)=>sum+Number(c.price||0),0);
  summaryRows.push({
    'Round': 'TOTAL (all rounds)',
    'Customers': overallCustomers,
    'Round Value': overallValue,
    'Average / Customer': overallCustomers ? Math.round((overallValue/overallCustomers)*100)/100 : 0
  });
  const summaryWs = XLSX.utils.json_to_sheet(summaryRows);
  summaryWs['!cols'] = [{wch:22},{wch:12},{wch:14},{wch:18}];
  XLSX.utils.book_append_sheet(wb, summaryWs, safeSheetName('Summary'));

  roundNames.forEach(rn=>{
    const custs = sortByRoute(rounds[rn]);
    const rows = custs.map(c=>{
      const s = custStatus(c);
      return {
        'Address': c.address || '',
        'Name': c.name || '',
        'Phone': c.phone || '',
        'Email': c.email || '',
        'Price': Number(c.price || 0),
        'Frequency (weeks)': c.frequencyWeeks || 4,
        'Last Cleaned': s.lastClean ? fmtDate(s.lastClean) : '',
        'Next Due': (()=>{ const d=nextDueISO(c); return d ? fmtDate(d) : ''; })(),
        'Last Paid': s.lastPaid ? fmtDate(s.lastPaid) : '',
        'Amount Owed': s.owed ? s.balance : 0,
        'Notes': c.notes || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:18},{wch:14},{wch:22},{wch:8},{wch:14},{wch:12},{wch:12},{wch:12},{wch:12},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(rn));
  });

  if((data.oneOffJobs||[]).length){
    const jobRows = data.oneOffJobs.map(j=>({
      'Date': j.date ? fmtDate(j.date) : '',
      'Address': j.address || '',
      'Name': j.name || '',
      'Phone': j.phone || '',
      'Price': Number(j.price || 0),
      'Done': j.done ? 'Yes' : 'No',
      'Paid': j.paid ? 'Yes' : 'No',
      'Notes': j.notes || ''
    }));
    const jobsWs = XLSX.utils.json_to_sheet(jobRows);
    jobsWs['!cols'] = [{wch:12},{wch:26},{wch:18},{wch:14},{wch:8},{wch:8},{wch:8},{wch:24}];
    XLSX.utils.book_append_sheet(wb, jobsWs, safeSheetName('One-off Jobs'));
  }

  const filename = `round-book-${todayISO()}.xlsx`;

  if(navigator.canShare){
    try{
      const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      const file = new File([wbout], filename, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Round Book Export'});
        toast('Excel file shared');
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      // fall through to classic download on any other failure
    }
  }

  XLSX.writeFile(wb, filename);
  toast('Excel file saved');
}

/* ---------- util ---------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- swipe actions ---------- */
let swipeState = null;
function initSwipeHandlers(){
  const main = document.getElementById('main');
  main.addEventListener('touchstart', onSwipeStart, {passive:true});
  main.addEventListener('touchmove', onSwipeMove, {passive:false});
  main.addEventListener('touchend', onSwipeEnd, {passive:true});
  main.addEventListener('touchcancel', onSwipeCancel, {passive:true});
}
function onSwipeStart(e){
  const card = e.target.closest('.cust-card[data-id]');
  if(!card) return;
  const touch = e.touches[0];
  swipeState = { card, startX: touch.clientX, startY: touch.clientY, currentX: 0, decided:false, horizontal:false };
}
function onSwipeMove(e){
  if(!swipeState) return;
  const touch = e.touches[0];
  const dx = touch.clientX - swipeState.startX;
  const dy = touch.clientY - swipeState.startY;
  if(!swipeState.decided){
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
      swipeState.decided = true;
      swipeState.horizontal = Math.abs(dx) > Math.abs(dy);
      if(!swipeState.horizontal){ swipeState = null; return; }
    } else {
      return;
    }
  }
  if(!swipeState) return;
  e.preventDefault();
  const maxDrag = 96;
  const clamped = Math.max(-maxDrag, Math.min(maxDrag, dx));
  swipeState.currentX = clamped;
  swipeState.card.style.transition = 'none';
  swipeState.card.style.transform = `translateX(${clamped}px)`;
}
function onSwipeEnd(){
  if(!swipeState) return;
  const { card, currentX, decided, horizontal } = swipeState;
  card.style.transition = 'transform 0.2s ease';
  card.style.transform = 'translateX(0)';
  const threshold = 64;
  if(decided && horizontal && Math.abs(currentX) >= threshold){
    const id = card.dataset.id;
    const kind = card.dataset.kind || 'customer';
    if(currentX > 0){
      if(kind === 'job') toggleJobDone(id);
      else if(kind === 'quote') markQuoteAccepted(id);
      else quickClean(id);
    } else {
      if(kind === 'job') toggleJobPaid(id);
      else if(kind === 'quote') markQuoteDeclined(id);
      else quickPaid(id);
    }
  }
  swipeState = null;
}
function onSwipeCancel(){
  if(!swipeState) return;
  swipeState.card.style.transition = 'transform 0.2s ease';
  swipeState.card.style.transform = 'translateX(0)';
  swipeState = null;
}

document.getElementById('dateNow').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});

/* ---------- weather ---------- */
const WEATHER_CODES = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌦️', 56:'🌦️', 57:'🌦️',
  61:'🌧️', 63:'🌧️', 65:'🌧️', 66:'🌧️', 67:'🌧️',
  71:'🌨️', 73:'🌨️', 75:'🌨️', 77:'🌨️',
  80:'🌦️', 81:'🌧️', 82:'🌧️',
  85:'🌨️', 86:'🌨️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};
function loadWeather(){
  const el = document.getElementById('weatherPill');
  if(!el) return;
  const cacheRaw = localStorage.getItem('roundBookWeatherCache');
  let cache = null;
  try{ cache = cacheRaw ? JSON.parse(cacheRaw) : null; }catch(e){}
  if(cache && cache.text){ el.textContent = cache.text; }

  const cacheAgeMs = cache ? (Date.now() - cache.time) : Infinity;
  if(cacheAgeMs < 30*60*1000) return; // refresh at most every 30 minutes
  if(!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=precipitation_probability&forecast_days=1&timezone=auto`);
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      const cw = json && json.current_weather;
      if(!cw) throw new Error('no weather');
      const icon = WEATHER_CODES[cw.weathercode] || '🌡️';
      const temp = Math.round(cw.temperature);
      let rainChance = null;
      if(json.hourly && json.hourly.time && json.hourly.precipitation_probability){
        // Match the hourly slot to the current time, rather than using the day's peak —
        // that's the figure that actually matches what the weather app shows right now.
        const nowISO = cw.time; // e.g. "2026-08-17T14:00"
        let idx = json.hourly.time.indexOf(nowISO);
        if(idx === -1){
          // fall back to the closest hour if the exact timestamp isn't listed
          const nowMs = new Date(nowISO).getTime();
          let bestDiff = Infinity;
          json.hourly.time.forEach((t, i)=>{
            const diff = Math.abs(new Date(t).getTime() - nowMs);
            if(diff < bestDiff){ bestDiff = diff; idx = i; }
          });
        }
        if(idx !== -1) rainChance = json.hourly.precipitation_probability[idx];
      }
      const rainPart = (rainChance != null) ? ` · 🌧️ ${rainChance}%` : '';
      const text = `${icon} ${temp}°C${rainPart}`;
      const el2 = document.getElementById('weatherPill');
      if(el2) el2.textContent = text;
      localStorage.setItem('roundBookWeatherCache', JSON.stringify({ text, time: Date.now() }));
    }catch(e){ /* offline or blocked — leave any cached reading showing */ }
  }, ()=>{ /* permission denied — fail silently, no clutter */ }, { enableHighAccuracy:false, timeout:10000, maximumAge:600000 });
}
loadWeather();
