<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Book">
<meta name="theme-color" content="#10344C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/index.umd.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<title>Round Book</title>
<style>
  :root{
    --navy:#10344C;
    --navy-dark:#0B2438;
    --blue:#2F9BDE;
    --blue-dim:#DCEFFA;
    --green:#2E9E5B;
    --green-dim:#E2F5EA;
    --amber:#C98A1D;
    --amber-dim:#FBF0DC;
    --red:#C4453F;
    --red-dim:#FAE4E2;
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#1C2B36;
    --ink-muted:#66798A;
    --line:#E3E9EC;
    --radius:14px;
    --emphasis:var(--navy);
  }
  body.dark{
    --bg:#0E1620;
    --surface:#16212C;
    --ink:#EAF1F6;
    --ink-muted:#8CA0B3;
    --line:#28394A;
    --blue-dim:#173347;
    --green-dim:#123321;
    --amber-dim:#3A2C10;
    --red-dim:#3A1616;
    --emphasis:#EAF1F6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  html{font-size:18px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none;
    user-select:none;
  }
  input, textarea{-webkit-user-select:text; user-select:text;}
  h1,h2,h3{margin:0; font-family:-apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:-0.01em;}

  header{
    background:var(--navy);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    position:sticky; top:0; z-index:20;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(160deg, var(--blue), var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .brand-mark svg{width:26px;height:26px;}
  .brand-text{min-width:0;}
  .brand h1{font-size:1.1875rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand .sub{font-size:0.6875rem; color:#A9C4D8; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #weatherPill{text-transform:none;}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;border:none; flex-shrink:0;
    background:rgba(255,255,255,0.12); color:#fff; display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{background:rgba(255,255,255,0.22);}

  .tabs{display:flex; gap:6px; margin-top:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; text-align:center; padding:9px 14px; border-radius:10px; font-size:0.8125rem; font-weight:700;
    color:#B9D2E2; background:transparent; border:none; white-space:nowrap;
  }
  .tab.active{background:rgba(255,255,255,0.14); color:#fff;}

  main{padding:14px 14px 100px;}

  .section-label{
    font-size:0.6875rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin:18px 2px 8px;
  }
  .section-label:first-child{margin-top:0;}

  .day-divider{
    font-size:0.75rem; font-weight:800; color:var(--blue-deep); background:var(--blue-dim);
    padding:7px 12px; border-radius:8px; margin:16px 0 8px;
  }
  .day-divider:first-child{margin-top:0;}

  .round-card{
    background:linear-gradient(to bottom, var(--surface), var(--blue-dim));
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:relative; overflow:hidden;
  }
  .round-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .round-group-header{position:relative; padding-left:12px;}
  .round-group-header::before{
    content:""; position:absolute; left:0; top:1px; bottom:1px; width:4px; background:var(--blue); border-radius:2px;
  }
  .round-card .rname{font-size:1rem; font-weight:800;}
  .round-card .rcount{font-size:0.7812rem; color:var(--ink-muted); margin-top:2px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{
    font-size:0.7188rem; font-weight:800; padding:4px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge.due{background:var(--amber-dim); color:var(--amber);}
  .badge.overdue{background:var(--red-dim); color:var(--red);}
  .badge.owed{background:var(--red-dim); color:var(--red);}
  .badge.ok{background:var(--green-dim); color:var(--green);}
  .badge.paused{background:var(--line); color:var(--ink-muted);}
  .badge.anniversary{background:var(--blue-dim); color:var(--blue-deep);}
  .chev{opacity:0.35;}

  .swipe-wrap{position:relative; border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .swipe-bg{position:absolute; inset:0; display:flex; align-items:center; font-weight:800; font-size:0.875rem; color:#fff; padding:0 22px;}
  .swipe-bg-left{background:var(--green); justify-content:flex-start;}
  .swipe-bg-right{background:var(--blue); justify-content:flex-end;}
  .cust-card{
    background:linear-gradient(to bottom, var(--surface), var(--blue-dim));
    border-radius:var(--radius); padding:14px 16px;
    border:1px solid var(--line); position:relative; z-index:1; touch-action:pan-y; overflow:hidden;
  }
  .cust-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .cust-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .cust-name{font-size:1rem; font-weight:800;}
  .cust-addr{font-size:0.8125rem; color:var(--ink-muted); margin-top:2px;}
  .cust-price{font-size:0.875rem; font-weight:800; color:var(--emphasis); white-space:nowrap;}
  .cust-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .cust-actions{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; padding:10px 8px; border-radius:10px; border:none; font-size:0.8438rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:15px;height:15px;}
  .btn-clean{background:var(--blue-dim); color:var(--blue-deep);}
  .btn-clean:active{background:#c8e6f8;}
  .btn-paid{background:var(--green-dim); color:var(--green);}
  .btn-paid:active{background:#cdefdc;}
  .btn-open{background:var(--bg); color:var(--ink); flex:0 0 auto; width:42px;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-muted);
  }
  .empty svg{width:44px;height:44px; opacity:0.3; margin-bottom:10px;}
  .empty b{display:block; color:var(--ink); font-size:0.9375rem; margin-bottom:4px;}
  .empty p{font-size:0.8125rem; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:30;
    width:56px; height:56px; border-radius:50%; border:none; background:var(--blue); color:#fff;
    box-shadow:0 6px 18px rgba(47,155,222,0.45); display:flex; align-items:center; justify-content:center;
  }
  .fab svg{width:24px;height:24px;}
  .fab:active{background:#2585c2;}

  /* Overlay / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,56,0.4); z-index:40; display:none;
    align-items:flex-end;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden;
    border-radius:20px 20px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation:slideup .22s ease-out; box-sizing:border-box;
  }
  @keyframes slideup{from{transform:translateY(20px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 6px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .sheet-head h2{font-size:1.125rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-close{width:32px;height:32px;border-radius:50%; border:none; background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;}

  label{display:block; font-size:0.7812rem; font-weight:700; color:var(--ink-muted); margin:14px 2px 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; max-width:100%; min-width:0; padding:12px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.9688rem; color:var(--ink); font-family:inherit; box-sizing:border-box;
  }
  input[type=date]{
    display:block; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .form-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{background:var(--blue); color:#fff; padding:13px; border-radius:12px; border:none; font-weight:800; font-size:0.9375rem; flex:1;}
  .btn-primary:active{background:#2585c2;}
  .btn-danger-text{background:none; border:none; color:var(--red); font-weight:700; font-size:0.8438rem; padding:14px 2px 2px; width:100%; text-align:center;}

  .hist-list{list-style:none; margin:0; padding:0;}
  .hist-list li{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.875rem;
    flex-wrap:wrap; gap:4px 0;
  }
  .hist-list li:last-child{border-bottom:none;}
  .hist-del{background:none; border:none; color:var(--ink-muted); font-size:0.75rem; padding:4px 6px; white-space:nowrap;}

  .stat-row{display:flex; gap:8px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:1.1875rem; font-weight:800;}
  .stat .lbl{font-size:0.6562rem; color:var(--ink-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .backup-btn{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-bottom:10px; text-align:left; width:100%;
  }
  .backup-btn svg{width:20px;height:20px; color:var(--blue); flex-shrink:0;}
  .backup-btn .t1{font-size:0.9062rem; font-weight:700;}
  .backup-btn .t2{font-size:0.75rem; color:var(--ink-muted); margin-top:1px;}
  #importFile, #importSpreadsheetFile{display:none;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy-dark); color:#fff;
    padding:11px 18px; border-radius:24px; font-size:0.8438rem; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast-undo-btn{margin-left:10px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-weight:800; padding:5px 12px; border-radius:14px; font-size:0.7812rem; vertical-align:middle;}

  .seg-row{display:flex; gap:8px; margin-bottom:14px;}
  .seg-btn{
    flex:1; padding:10px 6px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.8438rem; font-weight:800; color:var(--ink-muted); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg-btn.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .seg-btn .count{
    font-size:0.6875rem; padding:1px 6px; border-radius:20px; background:rgba(0,0,0,0.06); color:inherit;
  }
  .seg-btn.active .count{background:rgba(255,255,255,0.22);}

  .summary-overall{display:flex; gap:8px; margin-bottom:18px;}
  .summary-overall .stat{flex:1;}

  .print-area{display:none;}
  .rpt-round-title{font-size:16px; font-weight:800; margin:20px 0 8px; border-bottom:2px solid #10344C; padding-bottom:4px;}
  .rpt-round-title:first-child{margin-top:0;}
  .rpt-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  .rpt-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#66798A; padding:6px 8px; border-bottom:1px solid #ccc;}
  .rpt-table td{font-size:13px; padding:7px 8px; border-bottom:1px solid #eee; vertical-align:top;}
  .rpt-flag{font-weight:700;}
  .rpt-flag.overdue{color:#C4453F;}
  .rpt-flag.due{color:#C98A1D;}
  .rpt-total{text-align:right; font-weight:800; font-size:14px; margin-top:6px;}
  .rpt-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .rpt-header h1{font-size:20px;}
  .rpt-header .rpt-date{font-size:12px; color:#66798A;}
  .rpt-empty-note{font-size:12px; color:#66798A; padding:8px 0;}
  .rpt-footer{margin-top:24px; padding-top:10px; border-top:1px solid #ccc; font-size:11px; color:#66798A; text-align:center;}
  .rpt-page-break{page-break-before:always; break-before:page;}
  .rpt-calendar{width:100%; border-collapse:collapse; table-layout:fixed;}
  .rpt-calendar th{background:#10344C; color:#fff; font-size:11px; padding:6px; text-align:center; font-weight:700;}
  .rpt-calendar td{border:1px solid #E3E9EC; vertical-align:top; padding:5px; height:88px; font-size:10px; overflow:hidden;}
  .rpt-calendar td.outside{background:#F7F9FA; color:#B7C2CA;}
  .rpt-calendar .daynum{font-weight:800; font-size:11.5px; margin-bottom:3px; color:#1C2B36;}
  .rpt-calendar td.outside .daynum{color:#B7C2CA;}
  .rpt-calendar .round-chip{display:block; background:#DCEFFA; color:#1c6fa3; border-radius:5px; padding:1px 4px; margin-bottom:2px; font-weight:700; font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rpt-calendar .round-chip.job-chip{background:#FBEBD2; color:#8A5A15;}

  .inv-meta-table td{padding:4px 8px;}
  .inv-billto{background:#F5F7F8; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:13px; line-height:1.7; color:#1C2B36;}
  .inv-billto .inv-label{color:#66798A; text-transform:uppercase; font-size:10px; letter-spacing:.04em; font-weight:700; display:block; margin-bottom:3px;}
  .inv-total-box{background:#10344C !important; color:#fff !important; border-radius:8px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:16px !important;}
  .inv-total-box .inv-total-amount{font-size:22px; font-weight:800;}
  .inv-stamp{display:inline-block; font-size:12px; font-weight:800; letter-spacing:.06em; padding:4px 12px; border-radius:6px; border:2px solid; text-transform:uppercase; margin-bottom:16px;}
  .inv-stamp.paid{color:#1F7A46; border-color:#1F7A46;}
  .inv-stamp.due{color:#C4453F; border-color:#C4453F;}

  @media print{
    body, body.dark{
      --bg:#ffffff !important;
      --surface:#ffffff;
      --ink:#1C2B36;
      --ink-muted:#66798A;
      --line:#E3E9EC;
    }
    header, #backupBanner, #jobReminderBanner, #quoteFollowUpBanner, #jobAnniversaryBanner, #importReviewBanner, main, .fab, .overlay, #importFile, #importSpreadsheetFile, .toast{
      display:none !important;
    }
    .print-area{
      display:block !important;
      position:static;
      width:100%;
      padding:0;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20v13H2z"/><path d="M2 9.5h20M12 3v13"/><path d="M15.5 20l4-4M20.5 20l2-2"/></svg>
      </div>
      <div class="brand-text">
        <h1>Round Book</h1>
        <div class="sub" id="dateNow"></div>
        <div class="sub" id="weatherPill"></div>
      </div>
    </div>
    <div style="display:flex; gap:5px;">
      <button class="icon-btn" onclick="openReports()" aria-label="Reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      </button>
      <button class="icon-btn" onclick="openInfo()" aria-label="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
      <button class="icon-btn" onclick="openBackup()" aria-label="Backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="rounds" onclick="setTab('rounds')">Rounds</button>
    <button class="tab" data-tab="jobs" onclick="setTab('jobs')">One-off jobs</button>
    <button class="tab" data-tab="quotes" onclick="setTab('quotes')">Quotes</button>
  </div>
</header>

<div id="backupBanner"></div>
<div id="jobReminderBanner"></div>
<div id="quoteFollowUpBanner"></div>
<div id="jobAnniversaryBanner"></div>
<div id="importReviewBanner"></div>
<main id="main"></main>

<button class="fab" onclick="handleFabClick()" aria-label="Add">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<input type="file" id="importFile" accept="application/json">
<input type="file" id="importSpreadsheetFile" accept=".csv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<div class="toast" id="toast"></div>
<div class="print-area" id="printArea"></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'roundBookData_v1';
const APP_VERSION = 21;
function formatVersion(v){ return '1.' + v; }
const DEFAULT_CLEAN_TEMPLATE = "Hi {name}, just a reminder I'll be round to clean your windows soon. Let me know if that's not convenient.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_PAY_TEMPLATE = "Hi {name}, a friendly reminder that your window cleaning payment of {amount} is outstanding.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_RECEIPT_TEMPLATE = "Hi {name}, thank you for your payment of {amount} received {date}.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_QUOTE_TEMPLATE = "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_REPEAT_QUOTE_TEMPLATE = "Hi {name}, hope you're well! I cleaned your windows for you before and wondered if you'd like the same job done again? I'd quote {amount}, same as last time — just let me know and I'll get you booked back in.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_MARKETING_TEMPLATE = "Hi {name}, just letting you know we also offer gutter clearing and fascia cleaning alongside your window clean — let me know if you'd like a quote.\n\nThanks,\n{yourname}\n{company}";
function migrateData(parsed){
  parsed.customers = parsed.customers || [];
  parsed.oneOffJobs = parsed.oneOffJobs || [];
  parsed.oneOffJobs.forEach(j=>{
    if(!j.photos) j.photos = [];
    if(j.remind24h == null) j.remind24h = false;
    if(j.customerId === undefined) j.customerId = null;
  });
  parsed.quotes = parsed.quotes || [];
  parsed.quotes.forEach(q=>{
    if(!q.status) q.status = 'pending';
    if(q.date === undefined) q.date = todayISO();
    if(q.followUpDays == null) q.followUpDays = 7;
  });
  parsed.settings = parsed.settings || {};
  // Auto-upgrade template wording that still matches an earlier built-in default (i.e. the user
  // never customised it) so improvements to the default wording reach existing installs too.
  // Anything that doesn't match a known-old default is a real customisation and is left alone.
  const OLD_CLEAN_TEMPLATES = ["Hi {name}, just a reminder I'll be round to clean your windows soon. Let me know if that's not convenient. Thanks!"];
  const OLD_PAY_TEMPLATES = ["Hi {name}, a friendly reminder that your window cleaning payment of {amount} is outstanding. Thanks!"];
  const OLD_RECEIPT_TEMPLATES = ["Hi {name}, thank you for your payment of {amount} received {date}. {company}"];
  const OLD_QUOTE_TEMPLATES = [
    "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead. {company}",
    "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead. Thanks, {yourname}"
  ];
  const OLD_REPEAT_QUOTE_TEMPLATES = ["Hi {name}, great to clean for you again. For regular cleans I'd quote {amount} — let me know if you'd like to set up a round. Thanks, {yourname}"];
  if(!parsed.settings.cleanTemplate || OLD_CLEAN_TEMPLATES.includes(parsed.settings.cleanTemplate)) parsed.settings.cleanTemplate = DEFAULT_CLEAN_TEMPLATE;
  if(!parsed.settings.payTemplate || OLD_PAY_TEMPLATES.includes(parsed.settings.payTemplate)) parsed.settings.payTemplate = DEFAULT_PAY_TEMPLATE;
  if(!parsed.settings.receiptTemplate || OLD_RECEIPT_TEMPLATES.includes(parsed.settings.receiptTemplate)) parsed.settings.receiptTemplate = DEFAULT_RECEIPT_TEMPLATE;
  if(!parsed.settings.quoteTemplate || OLD_QUOTE_TEMPLATES.includes(parsed.settings.quoteTemplate)) parsed.settings.quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
  if(!parsed.settings.repeatQuoteTemplate || OLD_REPEAT_QUOTE_TEMPLATES.includes(parsed.settings.repeatQuoteTemplate)) parsed.settings.repeatQuoteTemplate = DEFAULT_REPEAT_QUOTE_TEMPLATE;
  if(!parsed.settings.marketingTemplate) parsed.settings.marketingTemplate = DEFAULT_MARKETING_TEMPLATE;
  if(parsed.settings.messagingApp !== 'whatsapp') parsed.settings.messagingApp = 'sms';
  if(parsed.settings.companyName == null) parsed.settings.companyName = '';
  if(parsed.settings.companyAddress == null) parsed.settings.companyAddress = '';
  if(parsed.settings.companyPhone == null) parsed.settings.companyPhone = '';
  if(parsed.settings.logo == null) parsed.settings.logo = '';
  parsed.customers.forEach(c=>{
    if(c.pauseReason == null) c.pauseReason = '';
    if(c.pauseDate == null) c.pauseDate = '';
    if(c.frequencyWeeks == null){
      c.frequencyWeeks = c.frequencyDays ? Math.max(1, Math.round(c.frequencyDays/7)) : 4;
    }
    if(c.visitDay == null || c.visitDay < 1 || c.visitDay > 5){
      c.visitDay = 1;
    }
    if(!c.priceHistory){
      c.priceHistory = c.price != null ? [{date: todayISO(), price: c.price}] : [];
    }
    if(!c.photos){
      c.photos = [];
    }
    if(!c.cleanHistory){
      c.cleanHistory = [];
    } else if(c.cleanHistory.length && typeof c.cleanHistory[0] === 'string'){
      c.cleanHistory = c.cleanHistory.map(d => ({date: d, amount: c.price || 0}));
    }
    if(!c.paymentHistory) c.paymentHistory = [];
    if(c.paymentReminderSent == null) c.paymentReminderSent = false;
    if(c.paymentReminderSentDate === undefined) c.paymentReminderSentDate = null;
  });
  return parsed;
}

/* ---------- helpers ---------- */
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}/${mm}/${yy}`;
}
function daysBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function lastOf(arr){ if(!arr||!arr.length) return null; return [...arr].sort().slice(-1)[0]; }
function lastDateOf(arr){ if(!arr||!arr.length) return null; return [...arr.map(e=>e.date)].sort().slice(-1)[0]; }
function money(n){ const v=Number(n||0); return '£'+v.toFixed(v%1?2:0); }
let pendingToastAction = null;
function toast(msg, actionLabel, actionFn){
  const t=document.getElementById('toast');
  clearTimeout(toast._t);
  pendingToastAction = actionFn || null;
  if(actionLabel && actionFn){
    t.innerHTML = `${escapeHtml(msg)}<button class="toast-undo-btn" onclick="runToastAction()">${escapeHtml(actionLabel)}</button>`;
    t.classList.add('show');
    toast._t = setTimeout(()=>{ t.classList.remove('show'); pendingToastAction=null; }, 5000);
  } else {
    t.textContent = msg;
    t.classList.add('show');
    toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
  }
}
function runToastAction(){
  const fn = pendingToastAction;
  pendingToastAction = null;
  const t = document.getElementById('toast');
  clearTimeout(toast._t);
  t.classList.remove('show');
  if(fn) fn();
}

function freqDays(c){ return (c.frequencyWeeks || 4) * 7; }
function nextDueISO(c){
  const lastClean = lastDateOf(c.cleanHistory);
  if(!lastClean) return null;
  const d = new Date(lastClean+'T00:00:00');
  d.setDate(d.getDate() + freqDays(c));
  return d.toISOString().slice(0,10);
}
function custStatus(c){
  const lastClean = lastDateOf(c.cleanHistory);
  const lastPaid = lastOf((c.paymentHistory||[]).map(p=>p.date));
  const freq = freqDays(c);
  let cleanBadge = null;
  if(c.paused){
    cleanBadge = {type:'paused', text: c.pauseReason ? `Paused — ${c.pauseReason}` : 'Paused'};
  } else if(lastClean){
    const due = daysBetween(lastClean, todayISO());
    if(due >= freq) cleanBadge = {type: due >= freq+7 ? 'overdue' : 'due', text: due >= freq+7 ? `${due}d overdue` : `Due (${due}d)`};
  } else {
    cleanBadge = {type:'due', text:'Never cleaned'};
  }
  const totalCharged = (c.cleanHistory||[]).reduce((s,e)=>s+Number(e.amount||0), 0);
  const totalPaid = (c.paymentHistory||[]).reduce((s,p)=>s+Number(p.amount||0), 0);
  const balance = Math.round((totalCharged - totalPaid) * 100) / 100;
  const owed = balance > 0.005;
  const credit = balance < -0.005;
  return {cleanBadge, owed, credit, balance, lastClean, lastPaid};
}

  return daysBetween(q.date, today) >= followUpDays;

function sortByRoute(custs){
  return custs.slice().sort((a,b)=>{
    const oa = a.order!=null ? a.order : 9999;
    const ob = b.order!=null ? b.order : 9999;
    return oa-ob || (a.address||'').localeCompare(b.address||'');
  });
}
function roundDaysUsed(custs){
  return Array.from(new Set(custs.map(c=>c.visitDay||1))).sort((a,b)=>a-b);
}
function cycleVisitDay(id){
  const c = data.customers.find(x=>x.id===id);
  if(!c) return;
  const cur = c.visitDay || 1;
  c.visitDay = cur >= 5 ? 1 : cur + 1;
  saveData();
  render();
}
function setRoundDayFilter(day){ roundDayFilter = day; render(); }

function setTab(tab){
  currentTab = tab; currentRound = null; reorderMode = false; roundFilterMode = 'all'; roundDayFilter = 'all';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  render();
  window.scrollTo(0, 0);
}
function setRoundsView(v){ roundsViewMode = v; render(); }
function toggleReorder(){ reorderMode = !reorderMode; render(); }
function moveInRound(id, direction){
  const rn = currentRound;
  const custs = sortByRoute(data.customers.filter(c=>(c.round||'Unassigned')===rn));
  const idx = custs.findIndex(c=>c.id===id);
  const swapIdx = direction==='up' ? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=custs.length) return;
  const tmp = custs[idx]; custs[idx] = custs[swapIdx]; custs[swapIdx] = tmp;
  custs.forEach((c,i)=>{ c.order = i; });
  saveData(); render();
}

function renderRoundsList(main){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));

  let html = '';
  if(data.customers.length){
    const activeCustomers = data.customers.filter(c=>!c.paused);
    const totalCustomers = activeCustomers.length;
    const totalValue = activeCustomers.reduce((sum,c)=>sum+Number(c.price||0),0);
    const overallAvg = totalCustomers ? totalValue/totalCustomers : 0;
    html += `<div class="summary-overall">
      <div class="stat"><div class="num">${totalCustomers}</div><div class="lbl">Customers</div></div>
      <div class="stat"><div class="num">${money(totalValue)}</div><div class="lbl">Round value</div></div>
      <div class="stat"><div class="num">${money(overallAvg)}</div><div class="lbl">Avg / customer</div></div>
    </div>`;
  }
  html += `<div class="seg-row">
    <button class="seg-btn ${roundsViewMode==='overview'?'active':''}" onclick="setRoundsView('overview')">Rounds</button>
    <button class="seg-btn ${roundsViewMode==='due'?'active':''}" onclick="setRoundsView('due')">Due</button>
    <button class="seg-btn ${roundsViewMode==='owed'?'active':''}" onclick="setRoundsView('owed')">Owed</button>
  </div>`;

  if(!roundNames.length){
    main.innerHTML = html + emptyState('rounds');
    return;
  }

  if(roundsViewMode === 'overview'){
    html += `<div class="section-label">Your rounds</div>`;
    let grandCustomers = 0, grandValue = 0;
    roundNames.forEach(rn=>{
      const all = rounds[rn];
      const activeAll = all.filter(c=>!c.paused);
      grandCustomers += activeAll.length;
      grandValue += activeAll.reduce((sum,c)=>sum+Number(c.price||0),0);
      const daysUsed = roundDaysUsed(all);
      let overdue=0, due=0, owed=0, paused=0;
      all.forEach(c=>{
        const s = custStatus(c);
        if(c.paused) paused++;
        else if(s.cleanBadge && s.cleanBadge.type==='overdue') overdue++;
        else if(s.cleanBadge && s.cleanBadge.type==='due') due++;
        if(s.owed) owed++;
      });
      html += `<div class="round-card" onclick="openRound('${escapeAttr(rn)}')">
        <div>
          <div class="rname">${escapeHtml(rn)}</div>
          <div class="rcount">${all.length} customer${all.length===1?'':'s'}${daysUsed.length>1?` · ${daysUsed.length} days`:''}</div>
        </div>
        <div class="badges">
          ${overdue?`<span class="badge overdue">${overdue} overdue</span>`:''}
          ${due?`<span class="badge due">${due} due</span>`:''}
          ${owed?`<span class="badge owed">${owed} owe</span>`:''}
          ${paused?`<span class="badge paused">${paused} paused</span>`:''}
          ${(!overdue&&!due&&!owed)?`<span class="badge ok">All clear</span>`:''}
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>`;
    });
    html += listTotalHtml(`${roundNames.length} round${roundNames.length===1?'':'s'} · ${grandCustomers} customer${grandCustomers===1?'':'s'} · ${money(grandValue)}`);
  } else if(roundsViewMode === 'due'){
    let anyDue = false;
    let dueGrandCount = 0, dueGrandValue = 0;
    roundNames.forEach(rn=>{
      const dueCusts = rounds[rn].filter(c=>{
        const s = custStatus(c);
        return !c.paused && s.cleanBadge && (s.cleanBadge.type==='due' || s.cleanBadge.type==='overdue');
      }).sort((a,b)=>{
        const sa=custStatus(a), sb=custStatus(b);
        const rank = x => x.cleanBadge.type==='overdue' ? 0 : 1;
        return rank(sa)-rank(sb);
      });
      if(!dueCusts.length) return;
      anyDue = true;
      dueGrandCount += dueCusts.length;
      dueGrandValue += dueCusts.reduce((s,c)=>s+Number(c.price||0),0);
      const anyPhone = dueCusts.some(c=>c.phone);
      html += `<div class="round-group-header" style="display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px;">
        <div class="section-label" style="margin:0;">${escapeHtml(rn)} <span style="font-weight:600; color:var(--ink-muted); text-transform:none; letter-spacing:0;">(${dueCusts.length})</span></div>
        ${anyPhone ? `<button onclick="openBulkReminders('due','${escapeAttr(rn)}')" style="background:none; border:none; color:var(--blue); font-size:0.75rem; font-weight:800;">✉️ Remind all</button>` : ''}
      </div>`;
      html += dueCusts.map(custCardHtml).join('');
    });
    if(!anyDue){
      html += `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg>
        <b>Nobody's due</b>
        <p>Everyone's cleaned on schedule.</p>
      </div>`;
    } else {
      html += listTotalHtml(`${dueGrandCount} due · ${money(dueGrandValue)}`);
    }
  } else if(roundsViewMode === 'owed'){
    let anyOwed = false;
    let grandTotal = 0;
    let owedGrandCount = 0;
    roundNames.forEach(rn=>{
      const owedCusts = rounds[rn].filter(c=>custStatus(c).owed)
        .sort((a,b)=>custStatus(b).balance-custStatus(a).balance);
      if(!owedCusts.length) return;
      anyOwed = true;
      owedGrandCount += owedCusts.length;
      const roundTotal = owedCusts.reduce((s,c)=>s+custStatus(c).balance,0);
      grandTotal += roundTotal;
      const anyPhone = owedCusts.some(c=>c.phone);
      html += `<div class="round-group-header" style="display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px;">
        <div class="section-label" style="margin:0;">${escapeHtml(rn)} <span style="font-weight:600; color:var(--ink-muted); text-transform:none; letter-spacing:0;">(owing ${money(roundTotal)})</span></div>
        ${anyPhone ? `<button onclick="openBulkReminders('owed','${escapeAttr(rn)}')" style="background:none; border:none; color:var(--blue); font-size:0.75rem; font-weight:800;">✉️ Remind all</button>` : ''}
      </div>`;
      html += owedCusts.map(custCardHtml).join('');
    });
    if(!anyOwed){
      html += `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg>
        <b>Nobody owes anything</b>
        <p>Everyone's paid up.</p>
      </div>`;
    } else {
      html += listTotalHtml(`${owedGrandCount} owing · Total owed: ${money(grandTotal)}`);
    }
  }

  main.innerHTML = html;
}

function openRound(rn){ currentRound = rn; reorderMode = false; roundFilterMode = 'all'; roundDayFilter = 'all'; render(); window.scrollTo(0, 0); }
function backToRounds(){ currentRound = null; reorderMode = false; roundFilterMode = 'all'; roundDayFilter = 'all'; render(); window.scrollTo(0, 0); }
function setRoundFilterMode(v){ roundFilterMode = v; render(); }

function renderRoundDetail(main, rn){
  const allInRound = sortByRoute(data.customers.filter(c=>(c.round||'Unassigned')===rn));
  const daysUsed = roundDaysUsed(allInRound);
  const spansMultipleDays = daysUsed.length > 1;

  let shellHtml = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;">
      <button class="btn-open" style="width:auto; padding:8px 14px; display:inline-flex; gap:6px; align-items:center;" onclick="backToRounds()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg> All rounds
      </button>
      <button class="btn-open" style="width:auto; padding:8px 14px; font-size:0.7812rem; font-weight:800;" onclick="toggleReorder()">${reorderMode?'Done':'↕ Reorder route'}</button>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;">
      <h2 style="font-size:1.25rem;">${escapeHtml(rn)}</h2>
      <div style="display:flex; gap:8px; flex-shrink:0;">
        <button class="btn-open" style="width:38px; height:38px; padding:0;" onclick="openFocusedHelp('rounds')" aria-label="Help for rounds">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button class="btn-open" style="width:38px; height:38px; padding:0;" onclick="openMarketingBlast('${escapeAttr(rn)}')" aria-label="Send group marketing text">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 13z"/><path d="M11.6 16.8a3 3 0 0 1-5.8-1.6"/></svg>
        </button>
        <button class="btn-open" style="width:38px; height:38px; padding:0;" onclick="printSingleRound('${escapeAttr(rn)}')" aria-label="Print this round">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        </button>
      </div>
    </div>
  `;

  if(reorderMode){
    shellHtml += `<p style="color:var(--ink-muted); font-size:0.8125rem; margin:0 2px 6px;">Use the arrows to set the order you actually visit these customers in.</p>`;
    shellHtml += `<p style="color:var(--ink-muted); font-size:0.8125rem; margin:0 2px 14px;">If this round takes more than one day, tap the day badge to say which day each customer is visited on (up to 5).</p>`;
    if(!allInRound.length){ main.innerHTML = shellHtml + emptyState('customers'); return; }
    shellHtml += allInRound.map((c,i)=>`
      <div class="cust-card" style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; min-width:0;">
          <div class="cust-addr" style="font-size:0.9375rem; font-weight:800;">${i+1}. ${escapeHtml(c.address||'No address')}</div>
          ${c.name?`<div class="cust-name" style="font-size:0.8125rem; color:var(--ink-muted); margin-top:2px;">${escapeHtml(c.name)}</div>`:''}
        </div>
        <button class="btn-open" style="width:auto; padding:6px 10px; font-size:0.75rem; font-weight:800; background:var(--blue-dim); color:var(--blue-deep); flex-shrink:0;" onclick="cycleVisitDay('${c.id}')">Day ${c.visitDay||1}</button>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="btn-open" style="width:38px; height:32px; padding:0; opacity:${i===0?'0.3':'1'};" onclick="moveInRound('${c.id}','up')">▲</button>
          <button class="btn-open" style="width:38px; height:32px; padding:0; opacity:${i===allInRound.length-1?'0.3':'1'};" onclick="moveInRound('${c.id}','down')">▼</button>
        </div>
      </div>
    `).join('');
    main.innerHTML = shellHtml;
    return;
  }

  if(allInRound.length){
    const activeInRound = allInRound.filter(c=>!c.paused);
    const roundTotal = activeInRound.reduce((sum,c)=>sum+Number(c.price||0),0);
    const roundAvg = activeInRound.length ? roundTotal / activeInRound.length : 0;
    shellHtml += `<div class="summary-overall">
      <div class="stat"><div class="num">${activeInRound.length}</div><div class="lbl">Customers</div></div>
      <div class="stat"><div class="num">${money(roundTotal)}</div><div class="lbl">Round value</div></div>
      <div class="stat"><div class="num">${money(roundAvg)}</div><div class="lbl">Avg / customer</div></div>
    </div>`;
  }

  if(spansMultipleDays){
    shellHtml += `<div class="seg-row">
      <button class="seg-btn ${roundDayFilter==='all'?'active':''}" onclick="setRoundDayFilter('all')">All days</button>
      ${daysUsed.map(d=>`<button class="seg-btn ${roundDayFilter===d?'active':''}" onclick="setRoundDayFilter(${d})">Day ${d}</button>`).join('')}
    </div>`;
  }

  shellHtml += `<div class="seg-row">
    <button class="seg-btn ${roundFilterMode==='all'?'active':''}" onclick="setRoundFilterMode('all')">All</button>
    <button class="seg-btn ${roundFilterMode==='due'?'active':''}" onclick="setRoundFilterMode('due')">📅 Due only</button>
    <button class="seg-btn ${roundFilterMode==='owed'?'active':''}" onclick="setRoundFilterMode('owed')">💷 Owed only</button>
  </div>`;

  let baseList = allInRound;
  if(spansMultipleDays && roundDayFilter !== 'all'){
    baseList = baseList.filter(c=>(c.visitDay||1) === roundDayFilter);
  }
  if(roundFilterMode === 'due'){
    baseList = baseList.filter(c=>{
      const s = custStatus(c);
      return !c.paused && s.cleanBadge && (s.cleanBadge.type==='due' || s.cleanBadge.type==='overdue');
    });
  } else if(roundFilterMode === 'owed'){
    baseList = baseList.filter(c=>custStatus(c).owed);
  }
  const custs = baseList;
  if(!custs.length){
    main.innerHTML = shellHtml + emptyState((roundFilterMode!=='all' || roundDayFilter!=='all') ? 'filter' : 'customers');
    return;
  }
  if(spansMultipleDays && roundDayFilter === 'all'){
    // Insert a divider wherever the visit day changes, so it's clear where one day's
    // work ends and the next begins when viewing the whole round in route order.
    let lastDay = null;
    custs.forEach(c=>{
      const d = c.visitDay || 1;
      if(d !== lastDay){
        shellHtml += `<div class="day-divider">Day ${d}</div>`;
        lastDay = d;
      }
      shellHtml += custCardHtml(c);
    });
  } else {
    shellHtml += custs.map(custCardHtml).join('');
  }
  if(roundFilterMode === 'owed'){
    const owedTotal = custs.reduce((sum,c)=>sum+custStatus(c).balance,0);
    shellHtml += listTotalHtml(`${custs.length} owing · Total owed: ${money(owedTotal)}`);
  } else {
    const activeCusts = custs.filter(c=>!c.paused);
    const listTotal = activeCusts.reduce((sum,c)=>sum+Number(c.price||0),0);
    shellHtml += listTotalHtml(`${activeCusts.length} customer${activeCusts.length===1?'':'s'} · ${money(listTotal)}`);
  }
  main.innerHTML = shellHtml;
}

function needsPriceReview(c){
  const lastIncrease = getLastPriceIncreaseDate(c);
  if(!lastIncrease) return false;
  const target = nextDueISO(c) || todayISO();
  return daysBetween(lastIncrease, target) >= 365;
}

function useCurrentLocation(){
  if(!navigator.geolocation){ toast('Location not available on this device'); return; }
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    const field = document.getElementById('f_address');
    if(!field) return;
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${latitude}&lon=${longitude}`);
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      const a = (json && json.address) || {};
      const road = [a.house_number, (a.road || a.pedestrian || a.footway || '')].filter(Boolean).join(' ');
      const town = a.town || a.city || a.village || a.suburb || a.hamlet || '';
      const postcode = a.postcode || '';
      const shortAddress = [road, town, postcode].filter(Boolean).join(', ');
      if(shortAddress){
        field.value = shortAddress;
        toast('Address filled from your location');
      } else if(json && json.display_name){
        field.value = json.display_name;
        toast('Address filled from your location');
      } else {
        throw new Error('no address found');
      }
    }catch(e){
      field.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      toast('Got your coordinates — no signal to look up the address');
    }
  }, ()=>{
    toast('Could not get your location — check location permission');
  }, {enableHighAccuracy:true, timeout:12000});
}

let sheetOnClose = null;
// onClose lets a sheet redirect back to another screen (e.g. a customer's history
// list returning to that customer's detail screen) no matter how it's dismissed —
// the ✕ button, tapping outside the sheet, or any other close path all funnel
// through closeSheet(), so this only needs to be handled in one place.
function openSheet(html, onClose){
  sheetOnClose = onClose || null;
  document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  if(sheetOnClose){
    const cb = sheetOnClose;
    sheetOnClose = null;
    cb();
  }
}

function saveCustomerForm(id){
  const name = document.getElementById('f_name').value.trim();
  const address = document.getElementById('f_address').value.trim();
  if(!name && !address){ toast('Please enter at least a name or an address'); return; }
  if(address){
    const normalized = address.toLowerCase();
    const dupe = data.customers.find(x=> x.id!==id && (x.address||'').trim().toLowerCase()===normalized);
    if(dupe){
      const proceed = confirm(`This address is already saved for ${dupe.name || 'another customer'} (${dupe.round||'Unassigned'} round). Add it again anyway?`);
      if(!proceed) return;
    }
  }
  const payload = {
    name,
    address,
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    round: document.getElementById('f_round').value.trim() || 'Unassigned',
    price: parseFloat(document.getElementById('f_price').value) || 0,
    frequencyWeeks: parseInt(document.getElementById('f_freq').value) || 4,
    notes: document.getElementById('f_notes').value.trim()
  };
  if(id){
    const c = data.customers.find(x=>x.id===id);
    const oldPrice = c.price;
    const oldRound = c.round || 'Unassigned';
    Object.assign(c, payload);
    if(oldPrice !== payload.price){
      c.priceHistory = c.priceHistory || [];
      c.priceHistory.push({date: todayISO(), price: payload.price});
    }
    if(oldRound !== (payload.round || 'Unassigned')){
      const roundCusts = data.customers.filter(x=>x.id!==id && (x.round||'Unassigned')===(payload.round||'Unassigned'));
      const maxOrder = roundCusts.reduce((m,x)=>Math.max(m, x.order!=null?x.order:-1), -1);
      c.order = maxOrder + 1;
    }
    toast('Customer updated');
  } else {
    const roundCusts = data.customers.filter(x=>(x.round||'Unassigned')===(payload.round||'Unassigned'));
    const maxOrder = roundCusts.reduce((m,x)=>Math.max(m, x.order!=null?x.order:-1), -1);
    data.customers.push(Object.assign({
      id: uid(), cleanHistory: [], paymentHistory: [],
      priceHistory: [{date: todayISO(), price: payload.price}],
      order: maxOrder + 1
    }, payload));
    toast('Customer added');
  }
  saveData(); closeSheet(); render();
}

function deleteCustomer(id){
  const idx = data.customers.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = data.customers[idx];
  data.customers.splice(idx,1);
  saveData(); closeSheet(); render();
  toast(`Deleted ${removed.address||removed.name||'customer'}`, 'Undo', ()=>{
    data.customers.splice(idx,0,removed);
    saveData(); render();
    toast('Customer restored');
  });
}

// Opens a standalone list for one of a customer's history types (clean, pay, jobs).
// Closing it — via the ✕ or the browser/gesture back action — returns to the
// customer detail screen rather than dropping back to a blank sheet, since these
// lists only make sense in the context of the customer they belong to.
function openCustomerHistoryList(id, kind){
  const c = data.customers.find(x=>x.id===id);
  if(!c) return;
  let title, rowsHtml;
  if(kind === 'clean'){
    title = 'Clean history';
    rowsHtml = (c.cleanHistory||[]).slice().sort((a,b)=>a.date<b.date?1:-1)
      .map(e=>`<li>${fmtDate(e.date)} — ${money(e.amount)}<span style="display:flex; gap:4px;"><button class="hist-del" onclick="editHistAmount('${id}','clean','${e.date}')">Edit</button><button class="hist-del" onclick="removeHist('${id}','clean','${e.date}')">Remove</button></span></li>`).join('') || '<li style="color:var(--ink-muted)">No cleans logged yet</li>';
  } else if(kind === 'pay'){
    title = 'Payment history';
    rowsHtml = (c.paymentHistory||[]).slice().sort((a,b)=>a.date<b.date?1:-1)
      .map(p=>`<li>${fmtDate(p.date)} — ${money(p.amount)}<span style="display:flex; gap:4px;"><button class="hist-del" title="Send receipt" onclick="openReceiptOptions('${id}','${p.date}',${p.amount})">🧾 Receipt</button><button class="hist-del" onclick="editHistAmount('${id}','pay','${p.date}')">Edit</button><button class="hist-del" onclick="removeHist('${id}','pay','${p.date}')">Remove</button></span></li>`).join('') || '<li style="color:var(--ink-muted)">No payments logged yet</li>';
  } else {
    title = 'One-off jobs';
    const linkedJobs = (data.oneOffJobs||[]).filter(j=>j.customerId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    rowsHtml = linkedJobs
      .map(j=>`<li style="cursor:pointer;" onclick="openJobForm(data.oneOffJobs.find(x=>x.id==='${j.id}'))">${fmtDate(j.date)} — ${money(j.price)} <span style="color:var(--ink-muted); font-weight:500;">(${j.done?'done':'not done'}, ${j.paid?'paid':'unpaid'})</span></li>`).join('') || '<li style="color:var(--ink-muted)">No one-off jobs for this customer</li>';
  }
  openSheet(`
    <div class="sheet-head">
      <h2 style="flex:1; min-width:0;">${title}</h2>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <ul class="hist-list">${rowsHtml}</ul>
  `, () => openCustomerDetail(id));
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Logos are usually small graphics with a transparent background, unlike photos — so this
// keeps PNG output (lossless, preserves transparency) rather than compressImage's JPEG.
function compressLogo(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function sharePhoto(id, photoId){
  const c = data.customers.find(x=>x.id===id);
  const p = (c.photos||[]).find(x=>x.id===photoId);
  if(!p) return;
  try{
    const res = await fetch(p.dataUrl);
    const blob = await res.blob();
    const safeName = (c.address || c.name || 'photo').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const file = new File([blob], `${safeName}-${p.date}.jpg`, { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Round Book photo', text: c.address || c.name || '' });
    } else {
      toast('Sharing not supported here — press and hold the photo instead');
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast('Could not share that photo — press and hold it instead');
  }
}

function deletePhoto(id, photoId){
  const c = data.customers.find(x=>x.id===id);
  c.photos = (c.photos||[]).filter(p=>p.id!==photoId);
  saveData();
  openCustomerDetail(id);
  render();
}

  const list = kind==='clean' ? c.cleanHistory : c.paymentHistory;

  if(!entry) return;
  const val = prompt(`${kind==='clean'?'Amount charged':'Amount paid'} for ${fmtDate(dateKey)}`, entry.amount);
  if(val===null) return;
  const num = parseFloat(val);
  if(isNaN(num) || num<0){ toast('Enter a valid amount'); return; }
  entry.amount = num;
  saveData(); openCustomerHistoryList(id, kind); render();

function savePriceHistoryEdit(id, oldDateKey){
  const c = data.customers.find(x=>x.id===id);
  const entry = (c.priceHistory||[]).find(p=>p.date===oldDateKey);
  if(!entry) return;
  const newDate = document.getElementById('ph_date').value;
  const newPrice = parseFloat(document.getElementById('ph_price').value);
  if(!newDate){ toast('Please choose a date'); return; }
  if(isNaN(newPrice) || newPrice<0){ toast('Enter a valid price'); return; }

  entry.date = newDate;
  entry.price = newPrice;

  const sortedAfter = c.priceHistory.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(sortedAfter[0] === entry){
    c.price = newPrice;
  }

  saveData(); openCustomerDetail(id); render();
  toast('Price entry updated');
}

function removePriceHistoryEntry(id, dateKey){
  const c = data.customers.find(x=>x.id===id);

function openPauseReasonSheet(id){
  const c = data.customers.find(x=>x.id===id);
  if(!c) return;
  openSheet(`
    <div class="sheet-head">
      <h2 style="flex:1; min-width:0;">Pause this customer</h2>

    </div>
  `);
  const sel = document.getElementById('pause_reason');
  const otherWrap = document.getElementById('pause_other_wrap');
  const syncOther = () => { otherWrap.style.display = sel.value === 'Other' ? 'block' : 'none'; };

function confirmPause(id){
  const c = data.customers.find(x=>x.id===id);
  if(!c) return;
  const sel = document.getElementById('pause_reason');
  let reason = sel ? sel.value : '';
  if(reason === 'Other'){
    const other = document.getElementById('pause_other');
    reason = (other && other.value.trim()) ? other.value.trim() : 'Other';
  }
  c.paused = true;
  c.pauseReason = reason;
  c.pauseDate = todayISO();
  saveData();
  closeSheet();
  openCustomerDetail(id);
  render();
  toast('Customer paused — hidden from due reminders');
}

function resumeCustomer(id){
  const c = data.customers.find(x=>x.id===id);
  if(!c) return;
  c.paused = false;
  c.pauseReason = '';
  c.pauseDate = '';
  saveData(); openCustomerDetail(id); render();

function applyTemplate(tpl, tokens){
  return (tpl||'')
    .replace(/\{name\}/g, tokens.name || 'there')
    .replace(/\{amount\}/g, tokens.amount != null ? money(tokens.amount) : '')
    .replace(/\{company\}/g, tokens.company || '')
    .replace(/\{date\}/g, tokens.date || '')
    .replace(/\{yourname\}/g, tokens.yourname || '');
}

// Normalizes a UK-style phone number into the digits-only, country-code-prefixed
// format WhatsApp's click-to-chat links require (e.g. "07123 456789" -> "447123456789").
function normalizePhoneForWhatsApp(phone){
  let digits = (phone||'').replace(/[^\d+]/g,'');
  if(digits.startsWith('+')) return digits.slice(1);
  if(digits.startsWith('00')) return digits.slice(2);
  if(digits.startsWith('0')) return '44' + digits.slice(1);
  return digits;
}

// Single point of truth for "send this text to this phone number" — respects the
// person's chosen messaging app (SMS or WhatsApp) from Settings, so every reminder,
// receipt, quote, and marketing text goes out the same way without repeating this logic.
function sendPhoneMessage(phone, msg){
  const clean = (phone||'').replace(/\s+/g,'');
  if(!clean) return;
  if(data.settings.messagingApp === 'whatsapp'){
    window.open(`https://wa.me/${normalizePhoneForWhatsApp(clean)}?text=${encodeURIComponent(msg)}`, '_blank');
  } else {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const separator = isIOS ? '&' : '?';
    window.location.href = `sms:${clean}${separator}body=${encodeURIComponent(msg)}`;
  }
}

function setMessagingApp(mode){
  data.settings.messagingApp = mode === 'whatsapp' ? 'whatsapp' : 'sms';
  saveData();
  openSettings();
}

function sendReceipt(id, dateISO, amount){
  const c = data.customers.find(x=>x.id===id);

function printReceipt(customerId, dateISO, amount){
  const c = data.customers.find(x=>x.id===customerId);
  if(!c) return;
  const receiptNumber = 'RCT-' + (dateISO||todayISO()).replace(/-/g,'') + '-' + c.id.slice(-4).toUpperCase();
  const company = data.settings.companyName || '';
  const companyAddress = data.settings.companyAddress || '';
  const companyPhone = data.settings.companyPhone || '';
  const yourName = data.settings.yourName || '';
  const hasLogo = !!data.settings.logo;
  const fromLine = [yourName, company].filter(Boolean).join(' · ');

  const metaRows = [
    ['Receipt number', receiptNumber],
    ['Receipt date', fmtDate(todayISO())],
    ['Payment date', fmtDate(dateISO)],
    ['Status', 'Paid']
  ].map(([label,val])=>`<tr><td style="font-weight:700; width:140px; color:#66798A;">${label}</td><td>${escapeHtml(String(val))}</td></tr>`).join('');

  const billToLines = [
    c.name ? escapeHtml(c.name) : '',
    c.address ? escapeHtml(c.address) : '',
    c.phone ? escapeHtml(c.phone) : ''
  ].filter(Boolean).map(l=>`<div>${l}</div>`).join('');

  const description = `Window cleaning — ${escapeHtml(c.round||'Round')}`;

  // See printJobInvoice for why the logo/name/address/phone blocks are kept as
  // separate top-level siblings rather than nested in one div.
  const logoBlock = hasLogo
    ? `<div style="text-align:left; margin-bottom:4px;"><img class="inv-logo" src="${data.settings.logo}" style="display:block; max-height:60px; max-width:200px; object-fit:contain;"></div>`
    : '';
  const nameBlock = (!hasLogo && company)
    ? `<div style="text-align:left; font-size:15px; font-weight:800; color:#10344C; margin-bottom:2px;">${escapeHtml(company)}</div>`
    : '';
  const addressBlock = companyAddress
    ? `<div style="text-align:left; font-size:11px; color:#66798A; line-height:1.5;">${escapeHtml(companyAddress).replace(/\n/g,'<br>')}</div>`
    : '';
  const phoneBlock = companyPhone
    ? `<div style="text-align:left; font-size:11px; color:#66798A; line-height:1.5;">${escapeHtml(companyPhone)}</div>`
    : '';
  const letterheadSpacer = (logoBlock || nameBlock || addressBlock || phoneBlock)
    ? `<div style="margin-bottom:16px;"></div>` : '';

  const body = `
    ${logoBlock}${nameBlock}${addressBlock}${phoneBlock}${letterheadSpacer}
    <div class="rpt-round-title" style="margin-top:0;">Receipt</div>
    <table class="rpt-table inv-meta-table" style="margin-bottom:20px;"><tbody>${metaRows}</tbody></table>

    <div class="rpt-round-title">Received from</div>
    <div class="inv-billto">
      <span class="inv-label">Customer</span>
      ${billToLines || '<div style="color:#66798A;">No customer details on file</div>'}
    </div>

    <div class="rpt-round-title">Details</div>
    <table class="rpt-table" style="margin-bottom:4px;">
      <thead><tr><th>Description</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody><tr><td>${description}</td><td style="text-align:right;">${money(amount)}</td></tr></tbody>
    </table>
    <div class="rpt-total inv-total-box"><span>Total paid</span><span class="inv-total-amount">${money(amount)}</span></div>
    <div style="margin-top:14px;"><span class="inv-stamp paid">✓ Paid</span></div>

    <div class="rpt-footer" style="text-align:left; border-top:none; margin-top:28px; padding-top:0;">
      Thank you for your payment.${fromLine ? '<br>' + escapeHtml(fromLine) : ''}
    </div>
  `;
  runPrint(`Receipt — ${c.address || c.name || receiptNumber}`, body, true, true);
}

function sendTemplate(id, kind){
  const c = data.customers.find(x=>x.id===id);
  if(!c.phone){ toast('No phone number saved for this customer'); return; }
  const firstName = c.name ? c.name.trim().split(' ')[0] : '';
  const company = data.settings.companyName || '';
  const yourname = data.settings.yourName || '';
  let msg;
  if(kind === 'clean'){
    msg = applyTemplate(data.settings.cleanTemplate, {name: firstName, company, yourname});
  } else {
    const s = custStatus(c);
    const amt = s.owed ? s.balance : c.price;
    msg = applyTemplate(data.settings.payTemplate, {name: firstName, amount: amt, company, yourname});
    c.paymentReminderSent = true;
    c.paymentReminderSentDate = todayISO();
    saveData();
    render();
  }
  sendPhoneMessage(c.phone, msg);
}

function renderJobs(main){
  let html = '';
  const today = todayISO();
  const jobs = (data.oneOffJobs || [])
    .slice()
    .sort((a,b)=>{
      if(!!a.done !== !!b.done) return a.done ? 1 : -1;
      if(!a.done) return (a.date||'').localeCompare(b.date||'');
      return (b.date||'').localeCompare(a.date||'');
    });
  if(!jobs.length){
    html += `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <b>No one-off jobs yet</b>
      <p>Tap the blue + button to add a gutter clean, one-time job, or anything outside your regular rounds — you can schedule it for any future date.</p>
    </div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="section-label">${jobs.length} one-off job${jobs.length===1?'':'s'}</div>`;
  html += jobs.map(j=>jobCardHtml(j, today)).join('');
  const jobsTotal = jobs.reduce((sum,j)=>sum+Number(j.price||0),0);
  html += listTotalHtml(`${jobs.length} job${jobs.length===1?'':'s'} · ${money(jobsTotal)}`);
  main.innerHTML = html;
}

function jobCardHtml(j, today){
  today = today || todayISO();
  const isFuture = !j.done && j.date && j.date > today;
  const statusBadge = j.done
    ? `<span class="badge ok">Done</span>`
    : isFuture
      ? `<span class="badge due">Scheduled</span>`
      : `<span class="badge overdue">Not done</span>`;
  const anniv = jobAnniversaryInfo(j, today);
  return `<div class="swipe-wrap">
    <div class="swipe-bg swipe-bg-left">✓ Done</div>
    <div class="swipe-bg swipe-bg-right">💷 Paid</div>
    <div class="cust-card" data-id="${j.id}" data-kind="job">
      <div class="cust-top" onclick="openJobForm(data.oneOffJobs.find(x=>x.id==='${j.id}'))">
        <div>
          <div class="cust-addr" style="font-size:1rem; font-weight:800; color:var(--ink);">${escapeHtml(j.address||'No address')}</div>
          ${(j.name||j.phone) ? `<div class="cust-name" style="font-size:0.8125rem; font-weight:600; color:var(--ink-muted); margin-top:2px;">${[escapeHtml(j.name||''), j.phone?escapeHtml(j.phone):''].filter(Boolean).join(' · ')}</div>` : ''}
          <div style="font-size:0.75rem; color:var(--ink-muted); margin-top:2px;">${fmtDate(j.date)}${j.remind24h?' · 🔔 Reminder set':''}</div>
        </div>
        <div class="cust-price">${money(j.price)}</div>
      </div>
      <div class="cust-meta">
        ${statusBadge}
        <span class="badge ${j.paid?'ok':'owed'}">${j.paid?'Paid':'Unpaid'}</span>
        ${(j.photos && j.photos.length) ? `<span class="badge paused">📷 ${j.photos.length}</span>` : ''}
        ${anniv ? `<span class="badge anniversary">🎉 ${anniv}-year anniversary</span>` : ''}
      </div>
    </div>
  </div>`;
}
function jobAnniversaryInfo(j, today){
  today = today || todayISO();
  if(!j.done || !j.date) return null;
  if(j.anniversaryReminder === false) return null;
  const daysSince = daysBetween(j.date, today);
  if(daysSince < 365) return null;
  // Calculate which year anniversary this is (1st = 365+, 2nd = 730+, 3rd = 1095+, etc.)
  const anniversaryYear = Math.floor(daysSince / 365);
  return anniversaryYear;
}

async function handleJobPhotoSelected(id, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  toast('Adding photo…');
  try{
    const dataUrl = await compressImage(file, 900, 0.7);
    const j = data.oneOffJobs.find(x=>x.id===id);
    j.photos = j.photos || [];
    j.photos.push({id: uid(), dataUrl, date: todayISO()});
    if(saveData()){
      openJobForm(j);
      toast('Photo added');
    }
  }catch(e){
    toast('Could not add that photo — try again');
  }
  inputEl.value = '';
}

async function shareJobPhoto(id, photoId){
  const j = data.oneOffJobs.find(x=>x.id===id);
  const p = (j.photos||[]).find(x=>x.id===photoId);
  if(!p) return;
  try{
    const res = await fetch(p.dataUrl);
    const blob = await res.blob();
    const safeName = (j.address || j.name || 'photo').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const file = new File([blob], `${safeName}-${p.date}.jpg`, { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Round Book photo', text: j.address || j.name || '' });
    } else {
      toast('Sharing not supported here — press and hold the photo instead');
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast('Could not share that photo — press and hold it instead');
  }
}

function deleteJobPhoto(id, photoId){
  const j = data.oneOffJobs.find(x=>x.id===id);
  j.photos = (j.photos||[]).filter(p=>p.id!==photoId);

  openJobForm(j);
}

function saveJobForm(id){
  const address = document.getElementById('j_address').value.trim();
  const name = document.getElementById('j_name').value.trim();
  if(!address && !name){ toast('Please enter at least an address or a name'); return; }
  const customerIdField = document.getElementById('j_customerId');
  const fromQuoteField = document.getElementById('j_fromQuoteId');
  const payload = {
    address, name,
    phone: document.getElementById('j_phone').value.trim(),
    date: document.getElementById('j_date').value || todayISO(),
    price: parseFloat(document.getElementById('j_price').value) || 0,
    notes: document.getElementById('j_notes').value.trim(),
    remind24h: document.getElementById('j_remind').checked,
    anniversaryReminder: document.getElementById('j_anniversary').checked,
    customerId: (customerIdField && customerIdField.value) ? customerIdField.value : null
  };
  if(id){
    const j = data.oneOffJobs.find(x=>x.id===id);
    Object.assign(j, payload);
    toast('Job updated');
  } else {
    const newJob = Object.assign({id: uid(), done:false, paid:false}, payload);

      if(q){ q.status = 'converted'; q.convertedToJobId = newJob.id; }

function deleteJob(id){
  const idx = data.oneOffJobs.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = data.oneOffJobs[idx];
  data.oneOffJobs.splice(idx,1);

  toast(`Deleted job at ${removed.address||removed.name||'job'}`, 'Undo', ()=>{

/* ---------- quotes ---------- */
function renderQuotes(main){
  let html = '';
  const todayForSort = todayISO();
  const quotes = (data.quotes || [])
    .slice()
    .sort((a,b)=>{
      const rank = q => q.status!=='pending' ? 2 : (quoteNeedsFollowUp(q, todayForSort) ? 0 : 1);
      const ra = rank(a), rb = rank(b);
      if(ra !== rb) return ra - rb;
      if(ra <= 1) return (a.date||'').localeCompare(b.date||'');
      return (b.date||'').localeCompare(a.date||'');
    });
  if(!quotes.length){
    html += `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <b>No quotes yet</b>
      <p>Tap the blue + button to note down a quote — you can turn it into a customer or a one-off job later.</p>
    </div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="section-label">${quotes.length} quote${quotes.length===1?'':'s'}</div>`;
  html += quotes.map(quoteCardHtml).join('');
  const quotesTotal = quotes.reduce((sum,q)=>sum+Number(q.price||0),0);
  html += listTotalHtml(`${quotes.length} quote${quotes.length===1?'':'s'} · ${money(quotesTotal)}`);
  main.innerHTML = html;
}

function quoteStatusBadge(q){
  if(q.status === 'accepted') return `<span class="badge ok">Accepted</span>`;
  if(q.status === 'declined') return `<span class="badge overdue">Declined</span>`;
  if(q.status === 'converted') return `<span class="badge ok">✅ Converted</span>`;
  return `<span class="badge due">Pending</span>`;
}

  const today = todayISO();

    <div class="cust-card" data-id="${q.id}" data-kind="quote">

/* ---------- settings / dark mode / colour scheme ---------- */
const THEMES = {
  ocean:  {name:'Ocean',  navy:'#164559', blue:'#3FA9D6'},
  slate:  {name:'Slate',  navy:'#3A424C', blue:'#A6B4C2'},
  rust:   {name:'Rust',   navy:'#5A2A1C', blue:'#E0723A'},
  plum:   {name:'Plum',   navy:'#4A1F52', blue:'#C15FC0'},
  forest: {name:'Forest', navy:'#1E4A2E', blue:'#4FAE64'},
  crimson:{name:'Crimson', navy:'#5C1A22', blue:'#E13A4B'}
};
let themeName = localStorage.getItem('roundBookTheme') || 'ocean';

// Small colour-mixing helpers so every tinted surface in the app (not just
// the header) can be derived from the two colours a scheme actually defines.
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function mixHex(hexA, hexB, weight){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const mixed = a.map((v,i)=> v + (b[i]-v)*weight);
  return '#' + mixed.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}

function applyDarkMode(){
  document.body.classList.toggle('dark', darkMode);
  applyTheme();
}
function setDarkMode(v){
  darkMode = v;
  localStorage.setItem('roundBookDark', v?'1':'0');
  applyDarkMode();
  openSettings();
}
function applyTextSize(){
  document.documentElement.style.fontSize = textSize + 'px';
}
function previewTextSize(v){
  const n = Math.max(15, Math.min(24, parseInt(v,10) || 18));
  document.documentElement.style.fontSize = n + 'px';
  const label = document.getElementById('textSizeLabel');
  if(label) label.textContent = n + 'px';
}
function setTextSize(v){
  const n = Math.max(15, Math.min(24, parseInt(v,10) || 18));
  textSize = n;
  localStorage.setItem('roundBookTextSize', String(n));
  applyTextSize();
  openSettings();
}
function applyTheme(){
  const t = THEMES[themeName] || THEMES.ocean;
  // Set on the body element itself (not html/:root) so these inline values take
  // precedence over the static light/dark-mode CSS blocks, which declare --blue-dim,
  // --bg etc. directly on body/body.dark and would otherwise win over anything
  // inherited from an ancestor regardless of dark mode state.
  const root = document.body.style;
  root.setProperty('--navy', t.navy);
  root.setProperty('--blue', t.blue);
  // A darker shade of the scheme's navy, used for toasts and other high-emphasis chrome.
  root.setProperty('--navy-dark', mixHex(t.navy, '#000000', 0.28));
  // A deepened version of the accent colour, used as readable text on the pale "dim" chips/buttons below.
  root.setProperty('--blue-deep', mixHex(t.blue, '#000000', 0.32));
  // The pale tinted background used for chips, quick-action buttons, and banners — mixed
  // toward white in light mode and toward the dark surface colour in dark mode, so every
  // scheme gets its own badge colour instead of everything defaulting to ocean-blue.
  root.setProperty('--blue-dim', darkMode ? mixHex(t.blue, '#0E1620', 0.82) : mixHex(t.blue, '#FFFFFF', 0.86));
  // A soft tint of the main screen background, so the page itself carries a hint of the
  // chosen scheme rather than staying neutral grey — card surfaces (--surface) stay
  // untinted so content still stands out clearly on top.
  root.setProperty('--bg', darkMode ? mixHex(t.blue, '#0E1620', 0.90) : mixHex(t.blue, '#F5F7F8', 0.92));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.navy);
}
function setTheme(name){
  if(!THEMES[name]) return;
  themeName = name;
  localStorage.setItem('roundBookTheme', name);
  applyTheme();
  openSettings();
}
function openSettings(){

// Strips HTML and punctuation down to a safe, short filename stem.
function sanitizeFilename(str){
  const plain = (str||'Document').replace(/<[^>]*>/g,'');
  const clean = plain.replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'');
  return (clean || 'Document').slice(0,60);
}

// Renders the pending report's title + body into an offscreen copy of the print
// layout (same markup printPendingReport uses), rasterizes it, and packs it into
// an A4 PDF — paginating automatically if the content runs longer than one page.
async function generatePendingReportPdfBlob(){
  const company = pendingReportHideCompany ? '' : (data.settings.companyName || '');
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; left:-9999px; top:0; width:794px; background:#ffffff; padding:32px; color:#1C2B36;';
  container.innerHTML = `
    <div class="rpt-header">
      <div>
        <h1>${pendingReportTitle}</h1>
        ${company ? `<div style="font-size:13px; color:#66798A; font-weight:700; margin-top:2px;">${escapeHtml(company)}</div>` : ''}
      </div>
      <div class="rpt-date">${reportDate()}</div>
    </div>
    ${pendingReportBody}
  `;
  document.body.appendChild(container);
  try{
    const imgs = [...container.querySelectorAll('img')];
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res=>{ img.onload = img.onerror = res; })));
    const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const imgWidth = pageWidth - margin*2;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgHeight;
    let position = margin;
    pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - margin*2);
    while(heightLeft > 0){
      position = margin - (imgHeight - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin*2);
    }
    return pdf.output('blob');
  } finally {
    document.body.removeChild(container);
  }
}

// Shares a PDF Blob via the native share sheet (WhatsApp is one of the apps offered
// there on both Android and iOS) when the browser supports sharing files. Where it
// doesn't — mainly desktop browsers — the PDF is downloaded instead and WhatsApp Web
// opens so it can be attached by hand.
async function sharePdfBlob(blob, filename){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return false; // user cancelled the share sheet
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  toast('PDF downloaded — attach it in WhatsApp');
  window.open('https://wa.me/', '_blank');
  return true;
}

async function sendPendingReportPdf(){
