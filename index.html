<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Book">
<meta name="theme-color" content="#10344C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Round Book</title>
<script>
/* Installed Home Screen app = "standalone". Anything else is an ordinary browser tab, where the browser's own
   toolbar takes space at the bottom of the screen; the layout below adapts (see html.in-browser). */
(function(){
  var standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if(!standalone) document.documentElement.classList.add('in-browser');
})();
</script>
<style>
  :root{
    --navy:#10344C;
    --navy-dark:#0B2438;
    --blue:#2F9BDE;
    --blue-dim:#DCEFFA;
    --green:#2E9E5B;
    --green-dim:#E2F5EA;
    --amber:#C98A1D;
    --amber-dim:#FBF0DC;
    --red:#C4453F;
    --red-dim:#FAE4E2;
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#1C2B36;
    --ink-muted:#66798A;
    --line:#E3E9EC;
    --radius:14px;
    --emphasis:var(--navy);
    --card-tint:#EEF6FB;
    --card-surface:#FFFFFF;
    --card-border:#DCF0F8;
    --card-shadow:0 1px 3px rgba(0,0,0,0.06);
    /* Fixed colours for the directions/call buttons — deliberately NOT theme
       variables, so they stay the same blue/green whichever colour scheme is
       chosen, rather than following --blue/--green like most of the app does. */
    --fixed-blue:#2F9BDE;
    --fixed-blue-deep:#1F7BB8;
    --fixed-green:#2E9E5B;
  }
  body.dark{
    --bg:#0E1620;
    --surface:#16212C;
    --ink:#EAF1F6;
    --ink-muted:#8CA0B3;
    --line:#28394A;
    --blue-dim:#173347;
    --green-dim:#123321;
    --amber-dim:#3A2C10;
    --red-dim:#3A1616;
    --emphasis:#EAF1F6;
    --card-tint:#182530;
    --card-surface:#1C3444;
    --card-border:transparent;
    --card-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 8px rgba(9,28,36,0.45), 0 1px 2px rgba(9,28,36,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  /* The page itself scrolls and the header and tab bar are fixed. The page is deliberately always a couple of
     pixels taller than the screen: iPhones and iPads shrink the app's window by the status-bar height whenever
     a page can't scroll, which left a gap beneath the tab bar on short screens (Today, Quotes, Marketing)
     but not on long ones (Rounds, Jobs). */
  html,body{height:auto; overflow:visible;}
  html{font-size:18px;}
  /* Weights go through these so the larger-screen block below can lighten them (see "Larger screens: type"). */
  :root{--fw-black:800; --fw-bold:700;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top:var(--header-h, 100px); /* room for the fixed header; real height is measured in 09-boot.js */
    padding-bottom:calc(var(--tabbar-h, 64px) + 8px); /* room for the fixed tab bar */
    min-height:calc(100vh + 2px);
    -webkit-user-select:none;
    user-select:none;
  }
  input, textarea{-webkit-user-select:text; user-select:text;}
  h1,h2,h3{margin:0; font-family:-apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:-0.01em;}
  /* Every button in this app supplies its own border/background via its class
     (.btn, .btn-open, .seg-btn, .backup-btn, etc), so the native button chrome
     iOS/Android draw by default — including a border — needs switching off
     once here, globally, rather than fighting it class by class. Individual
     classes below can still opt back into a border if they ever need one. */
  button{border:none; background:none; font:inherit; color:inherit; -webkit-appearance:none; appearance:none;}

  header{
    background:var(--navy);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 5px) 14px 8px;
    position:fixed; top:0; left:0; right:0; z-index:20;
  }
  /* Row 1: logo, title and the three buttons (pinned to the top). Row 2: the date and sync note, which run
     across the full width, underneath the buttons. */
  .header-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; column-gap:10px; row-gap:0; align-items:center;}
  .sub-line{grid-column:2 / -1; grid-row:2; display:flex; align-items:baseline; gap:8px; min-width:0; margin-top:-3px;}
  .sub-line #dateNow{flex:0 0 auto;}
  .sub-line #liveSyncChip{flex:0 1 auto; min-width:0; cursor:pointer;}
  .hdr-btns{grid-column:3; grid-row:1; align-self:start; display:flex; gap:5px;}
  .header-row h1{grid-column:2; grid-row:1;}
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(160deg, var(--blue), var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .brand-mark svg{width:26px;height:26px;}
  .brand-mark{grid-column:1; grid-row:1 / span 2; align-self:center;}
  .header-row h1{font-size:1.1875rem; font-weight:var(--fw-black); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sub-line .sub{font-size:0.6875rem; color:#A9C4D8; font-weight:600; letter-spacing:.04em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;border:none; flex-shrink:0;
    background:rgba(255,255,255,0.12); color:#fff; display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{background:rgba(255,255,255,0.22);}

  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; gap:6px; margin:0; padding:10px max(22px, env(safe-area-inset-right)) max(14px, calc(env(safe-area-inset-bottom) - 6px)) max(22px, env(safe-area-inset-left)); background:var(--navy); /* taller, and inset from the sides so the outer tabs clear the curved screen corners */}
  .tab{
    flex:0 0 auto; text-align:center; padding:9px 14px; border-radius:10px; font-size:0.8125rem; font-weight:var(--fw-bold);
    color:#B9D2E2; background:transparent; border:none; white-space:nowrap;
  }
  .tab.active{background:rgba(255,255,255,0.14); color:#fff;}
  .tab{position:relative;}
  .tab-badge{
    position:absolute; top:1px; right:2px; min-width:16px; height:16px; padding:0 4px; box-sizing:border-box;
    border-radius:8px; background:#FFD60A; color:#1a1a1a; font-size:0.625rem; font-weight:var(--fw-black); line-height:16px; text-align:center;
  }
  .tab-badge[hidden]{display:none;}
  #liveSyncChip[hidden]{display:none;}

  /* The page never scrolls: the header and the bottom tab bar stay put on every screen, and only this
     area between them scrolls. Their heights are measured in 09-boot.js. */
  #appScroll{position:static;}
  @media (hover:hover) and (pointer:fine){ body{min-height:100vh;} } /* desktop: no need for the extra pixels */
  main{padding:14px 14px 100px;}

  .section-label{
    font-size:0.6875rem; font-weight:var(--fw-black); text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin:18px 2px 8px;
  }
  .section-label:first-child{margin-top:0;}

  .day-divider{
    font-size:0.75rem; font-weight:var(--fw-black); color:var(--blue-deep); background:var(--blue-dim);
    padding:7px 12px; border-radius:8px; margin:16px 0 8px;
  }
  .day-divider:first-child{margin-top:0;}

  .round-card{
    background:linear-gradient(to bottom, var(--card-surface), var(--card-tint));
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--card-border); box-shadow:var(--card-shadow); display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:relative; overflow:hidden;
  }
  .round-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .round-group-header{position:relative; padding-left:12px;}
  .round-group-header::before{
    content:""; position:absolute; left:0; top:1px; bottom:1px; width:4px; background:var(--blue); border-radius:2px;
  }
  .round-card .rname{font-size:1rem; font-weight:var(--fw-black);}
  .round-card .rcount{font-size:0.7812rem; color:var(--ink-muted); margin-top:2px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{
    font-size:0.7188rem; font-weight:var(--fw-black); padding:4px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge.due{background:var(--amber-dim); color:var(--amber);}
  .badge.overdue{background:var(--red-dim); color:var(--red);}
  .badge.owed{background:var(--red-dim); color:var(--red);}
  .badge.escalate{background:var(--red); color:#fff;}
  .badge.ok{background:var(--green-dim); color:var(--green);}
  .badge.paused{background:var(--line); color:var(--ink-muted);}
  .badge.deferred, .badge.scheduled{background:var(--blue-dim); color:var(--blue-deep);}
  .badge.anniversary{background:var(--blue-dim); color:var(--blue-deep);}
  .chev{opacity:0.35;}

  .swipe-wrap{position:relative; border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .swipe-bg{position:absolute; inset:0; display:flex; align-items:center; font-weight:var(--fw-black); font-size:0.875rem; color:#fff; padding:0 22px; opacity:0;}
  .swipe-bg-left{background:var(--green); justify-content:flex-start;}
  .swipe-bg-right{background:var(--blue); justify-content:flex-end; color:var(--on-accent, #fff);}
  .cust-card{
    background:linear-gradient(to bottom, var(--card-surface), var(--card-tint));
    border-radius:var(--radius); padding:14px 16px;
    border:1px solid var(--card-border); box-shadow:var(--card-shadow); position:relative; z-index:1; touch-action:pan-y; overflow:hidden;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .cust-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .cust-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .cust-name{font-size:1rem; font-weight:var(--fw-black);}
  .cust-addr{font-size:0.8125rem; color:var(--ink-muted); margin-top:2px;}
  .cust-price{font-size:0.875rem; font-weight:var(--fw-black); color:var(--emphasis); white-space:nowrap;}
  .cust-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .cust-btn-row{display:flex; gap:6px;}
  .dir-btn, .call-btn{
    width:26px; height:26px; border-radius:50%; border:none; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto;
  }
  .dir-btn{background:var(--fixed-blue);}
  .call-btn{background:var(--fixed-green);}
  .dir-btn svg, .call-btn svg{width:14px;height:14px;}
  .dir-btn:active{background:var(--fixed-blue-deep);}
  .call-btn:active{filter:brightness(0.88);}
  .cust-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .cust-actions{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; padding:10px 8px; border-radius:10px; font-size:0.8438rem; font-weight:var(--fw-black);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:15px;height:15px;}
  .btn-clean{background:var(--blue-dim); color:var(--blue-deep);}
  .btn-clean:active{background:#c8e6f8;}
  .btn-paid{background:var(--green-dim); color:var(--green);}
  .btn-paid:active{background:#cdefdc;}
  .btn-open{background:var(--bg); color:var(--ink); flex:0 0 auto; width:42px;}
  /* Utility icons (Show map, Reorder, the round-actions kebab, every menu-row
     icon in Settings/Reports/Backup) inherit currentColor from --ink, which in
     dark mode is a near-white text colour — fine for text, but as a thin SVG
     stroke it reads as a harsh white outline. Softening just the icon (not the
     button's own text) to --ink-muted keeps it recognisable without the glare. */
  .btn-open svg, .backup-btn svg{color:var(--ink-muted);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-muted);
  }
  .empty svg{width:44px;height:44px; opacity:0.3; margin-bottom:10px;}
  .empty b{display:block; color:var(--ink); font-size:0.9375rem; margin-bottom:4px;}
  .empty p{font-size:0.8125rem; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(var(--tabbar-h, 64px) + 18px); z-index:30;
    width:56px; height:56px; border-radius:50%; border:none; background:var(--blue); color:var(--on-accent, #fff);
    box-shadow:0 6px 18px rgba(47,155,222,0.45); display:flex; align-items:center; justify-content:center;
  }
  .fab svg{width:24px;height:24px;}
  .fab:active{background:#2585c2;}

  /* Today home tab */
  .today-hero{
    background:var(--navy); color:#fff; border-radius:16px; padding:18px 18px 16px;
    margin-bottom:12px; cursor:pointer;
  }
  .today-hero:active{background:#0a2c45;}
  .today-hero .num{font-size:2.25rem; font-weight:var(--fw-black); line-height:1;}
  .today-hero .lbl{font-size:0.8125rem; font-weight:var(--fw-bold); color:#B9D2E2; margin-top:4px;}
  .today-hero .value{font-size:0.9375rem; font-weight:var(--fw-bold); margin-top:10px; color:#fff;}
  .today-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:8px;}
  .today-tile{
    background:var(--card-surface); border-radius:14px;
    padding:14px; text-align:left; cursor:pointer; display:block;
  }
  .today-tile:active{background:var(--line);}
  .today-tile .num{font-size:1.625rem; font-weight:var(--fw-black); color:var(--ink); line-height:1;}
  .today-tile .lbl{font-size:0.75rem; font-weight:var(--fw-bold); color:var(--ink-muted); margin-top:5px;}

  /* Overlay / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,56,0.4); z-index:40; display:none;
    align-items:flex-end;
  }
  .overlay.show{display:flex;}
  /* Any pop-up with somewhere to type (see openSheet) opens at the TOP so the on-screen keyboard can
     never cover it. While the keyboard is up the overlay is sized to the visible area only (see
     fitTopSheetToViewport), so the sheet scrolls inside the space above the keyboard. Phones/portrait
     only; the landscape split view below keeps its right-hand pane. */
  .overlay.top-sheet{align-items:flex-start;}
  .overlay.top-sheet .sheet{
    margin:calc(env(safe-area-inset-top, 0px) + 8px) auto 8px;
    max-height:calc(100% - env(safe-area-inset-top, 0px) - 16px);
    animation:slidedown .22s ease-out;
  }
  .overlay.top-sheet .sheet-handle{display:none;}
  @keyframes slidedown{from{transform:translateY(-20px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden;
    border-radius:20px 20px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation:slideup .22s ease-out; box-sizing:border-box;
  }
  @keyframes slideup{from{transform:translateY(20px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 6px;}
  /* The photo viewer's buttons stay pinned to the bottom of the sheet while the photo scrolls underneath them. The
     sheet's own bottom padding moves into the bar so it reaches the very bottom edge; the frosted backing lets
     the photo show faintly through as it passes. */
  .sheet:has(.pv-actions){padding-bottom:0;}
  .pv-actions{
    position:sticky; bottom:0; z-index:3; margin:0 -16px; padding:10px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background:var(--bg); border-top:1px solid var(--line);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)){
    .pv-actions{ background:color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .sheet-head h2{font-size:1.125rem; font-weight:var(--fw-black); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-close{width:32px;height:32px;border-radius:50%; border:none; background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;}

  label{display:block; font-size:0.7812rem; font-weight:var(--fw-bold); color:var(--ink-muted); margin:14px 2px 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%; max-width:100%; min-width:0; padding:12px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.9688rem; color:var(--ink); font-family:inherit; box-sizing:border-box;
  }
  input[type=date], input[type=time]{
    display:block; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .form-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{background:var(--blue); color:var(--on-accent, #fff); padding:13px; border-radius:12px; font-weight:var(--fw-black); font-size:0.9375rem; flex:1;}
  .btn-primary:active{background:#2585c2;}
  .btn-danger-text{background:none; border:none; color:var(--red); font-weight:var(--fw-bold); font-size:0.8438rem; padding:14px 2px 2px; width:100%; text-align:center;}

  .hist-list{list-style:none; margin:0; padding:0;}
  .hist-list li{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.875rem;
    flex-wrap:wrap; gap:4px 0;
  }
  .hist-list li:last-child{border-bottom:none;}

  .stat-row{display:flex; gap:8px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card-surface); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:1.1875rem; font-weight:var(--fw-black);}
  .stat .lbl{font-size:0.6562rem; color:var(--ink-muted); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .backup-btn{
    display:flex; align-items:center; gap:12px; background:var(--card-surface); border:1px solid var(--card-border); box-shadow:var(--card-shadow);
    border-radius:12px; padding:14px; margin-bottom:10px; text-align:left; width:100%;
  }
  .backup-btn svg{width:20px;height:20px; color:var(--blue); flex-shrink:0;}
  .backup-btn .t1{font-size:0.9062rem; font-weight:var(--fw-bold);}
  .backup-btn .t2{font-size:0.75rem; color:var(--ink-muted); margin-top:1px;}

  .cust-section{border:1px solid var(--card-border); box-shadow:var(--card-shadow); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--card-surface);}
  .cust-section summary{
    list-style:none; cursor:pointer; padding:13px 14px; font-weight:var(--fw-black); font-size:0.875rem; color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .cust-section summary::-webkit-details-marker{display:none;}
  .cust-section summary .chev{width:16px; height:16px; color:var(--ink-muted); flex-shrink:0; transition:transform .2s;}
  .cust-section[open] summary .chev{transform:rotate(180deg);}
  .cust-section .cust-section-body{padding:2px 14px 14px;}
  .cust-section .cust-section-body > *:first-child{margin-top:0;}

  #importFile, #importSpreadsheetFile, #syncFile{display:none;}
  .toast{
    position:fixed; bottom:calc(var(--tabbar-h, 64px) + 16px); left:50%; transform:translateX(-50%); background:var(--navy-dark); color:#fff;
    padding:11px 18px; border-radius:24px; font-size:0.8438rem; font-weight:var(--fw-bold); z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast-undo-btn{margin-left:10px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-weight:var(--fw-black); padding:5px 12px; border-radius:14px; font-size:0.7812rem; vertical-align:middle;}

  .seg-row{display:flex; gap:8px; margin-bottom:14px;}
  .seg-btn{
    flex:1; padding:10px 6px; border-radius:11px; background:var(--card-surface);
    font-size:0.8438rem; font-weight:var(--fw-black); color:var(--ink-muted); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg-btn.active{background:var(--navy); color:#fff;}
  .seg-btn .count{
    font-size:0.6875rem; padding:1px 6px; border-radius:20px; background:rgba(0,0,0,0.06); color:inherit;
  }
  .seg-btn.active .count{background:rgba(255,255,255,0.22);}
  .seg-btn-sm{padding:6px 6px; font-size:0.75rem;}

  .summary-overall{display:flex; gap:6px; margin-bottom:12px;}
  .summary-overall .stat{flex:1; padding:7px;}
  .summary-overall .stat .num{font-size:1rem;}
  .summary-overall .stat .lbl{font-size:0.5625rem;}

  .print-area{display:none;}

  /* Schedule editor: a full-screen calendar whose chips can be moved, then committed or rejected */

  /* =====================================================================
     Liquid Glass — translucent, blurred, light-catching surfaces in the
     style of Apple's iOS 26 design language. Sits after the base styles so
     it restyles them without touching any markup. Real backdrop blur is

  :root{

    --glass-edge-soft:rgba(255,255,255,0.50);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 0 0 0 1px rgba(255,255,255,0.40);
    --glass-shadow:0 10px 30px rgba(16,52,76,0.14), 0 2px 6px rgba(16,52,76,0.08);
    --field-fill:rgba(255,255,255,0.62);
    --field-edge:rgba(102,121,138,0.28);
    --btn-hi:rgba(255,255,255,0.60);
    --sheet-fill:rgba(245,247,248,0.74);
    --glass-blur:blur(22px) saturate(180%);
    --orb-a:34%; --orb-b:22%; --orb-c:16%;
  }
  body.dark{
    --glass-fill:rgba(44,60,78,0.44);
    --glass-fill-strong:rgba(30,42,56,0.72);
    --glass-edge:rgba(255,255,255,0.22);
    --glass-edge-soft:rgba(255,255,255,0.12);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,0.24), inset 0 -1px 0 rgba(255,255,255,0.04), inset 0 0 0 1px rgba(255,255,255,0.08);
    --glass-shadow:0 12px 32px rgba(0,0,0,0.42), 0 2px 6px rgba(0,0,0,0.30);
    --field-fill:rgba(255,255,255,0.07);
    --field-edge:rgba(255,255,255,0.14);
    --btn-hi:rgba(255,255,255,0.16);
    --sheet-fill:rgba(20,30,42,0.72);
    --orb-a:30%; --orb-b:20%; --orb-c:14%;
  }

  /* The glass colours are built from per-scheme RGB triplets (set in applyTheme), so each colour scheme's
     panels pick up its own warm or cool surface colour. Declared on body so they can see those inline values. */
  body{
    --glass-base:255,255,255; --glass-strong-base:255,255,255; --sheet-base:245,247,248;
    --glass-fill:rgba(var(--glass-base),0.58);
    --glass-fill-strong:rgba(var(--glass-strong-base),0.80);
    --field-fill:rgba(var(--glass-base),0.62);
    --sheet-fill:rgba(var(--sheet-base),0.74);
  }
  body.dark{
    --glass-base:44,60,78; --glass-strong-base:30,42,56; --sheet-base:20,30,42;
    --glass-fill:rgba(var(--glass-base),0.44);
    --glass-fill-strong:rgba(var(--glass-strong-base),0.72);
    --field-fill:rgba(255,255,255,0.07);
    --sheet-fill:rgba(var(--sheet-base),0.72);
  }

  /* Something colourful behind the glass for it to refract. */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60% 42% at 12% 2%, color-mix(in srgb, var(--blue) var(--orb-a), transparent), transparent 72%),
      radial-gradient(55% 40% at 100% 34%, color-mix(in srgb, var(--blue) var(--orb-b), transparent), transparent 72%),
      radial-gradient(70% 50% at 22% 100%, color-mix(in srgb, var(--orb-glow, var(--green)) var(--orb-c), transparent), transparent 72%);
  }

  /* Header: a floating pane of tinted glass with rounded lower corners */
  header{
    background:var(--navy);
    border-radius:0 0 28px 28px;
    box-shadow:inset 0 -1px 0 rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 30px rgba(0,0,0,0.20);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  }
  @supports (background:color-mix(in srgb, red, blue)){
    header{
      background:linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02)), color-mix(in srgb, var(--navy) 78%, transparent);
    }
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.40), inset 0 0 0 1px rgba(255,255,255,0.14);
    /* No backdrop-filter here: the header behind it already blurs, and a blur
       nested inside another blur made iPad Safari paint the circle but drop the
       icon. */
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn svg{display:block; flex:none; pointer-events:none;}
  /* The same fix for the round icon buttons inside sheets (print, help): without it iPad Safari
     can paint the circle but drop the icon. */
  .sheet-close svg, .btn-open svg{display:block; flex:none; pointer-events:none; overflow:visible;}
  .icon-btn:active{background:rgba(255,255,255,0.30); transform:scale(0.92);}
  .brand-mark{border-radius:12px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), inset 0 0 0 1px rgba(255,255,255,0.22);}

  /* Tabs: a glass bar anchored to the bottom of the screen (the top, on iPad / desktop — see the tablet block below), with a lifted glass pill for the active tab */
  .tabs{gap:4px; border-radius:24px 24px 0 0; background:var(--navy);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 -10px 30px rgba(0,0,0,0.20);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);}
  @supports (background:color-mix(in srgb, red, blue)){
    .tabs{background:linear-gradient(0deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02)), color-mix(in srgb, var(--navy) 78%, transparent);}
  }
  .tab{flex:1 1 0; min-width:0; border-radius:999px; padding:14px 4px; font-size:0.875rem; transition:background .2s ease, color .2s ease;}
  .tab.active{
    background:rgba(255,255,255,0.24); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.50), inset 0 0 0 1px rgba(255,255,255,0.18), 0 2px 8px rgba(0,0,0,0.18);
  }

  /* Cards: translucent fill, specular edge, no per-card blur (long lists) */
  .round-card, .cust-card{border-radius:var(--radius);}
  .round-card::before, .cust-card::before{left:7px; top:14px; bottom:14px; width:4px; border-radius:4px;}
  .round-card{padding-left:22px;}
  .cust-card{padding-left:22px;}
  .day-divider{border-radius:999px; padding:7px 14px; box-shadow:var(--glass-hi);}

  /* Buttons: capsules with a light-catching top edge */
  .btn{
    border-radius:999px; padding:11px 10px;
    box-shadow:inset 0 1px 0 var(--btn-hi), inset 0 0 0 1px rgba(255,255,255,0.20);
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-open{background:var(--glass-fill);}
  .btn-clean:active, .btn-paid:active{filter:brightness(0.95);}
  .btn-primary{
    border-radius:999px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--blue) 90%, white), var(--blue));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.55), inset 0 0 0 1px rgba(255,255,255,0.18), 0 6px 16px color-mix(in srgb, var(--blue) 40%, transparent);
    transition:transform .15s ease;
  }
  .btn-primary:active{background:var(--blue); transform:scale(0.97);}
  .dir-btn, .call-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 6px rgba(0,0,0,0.18);}

  /* Floating action button: a glass blue bubble */
  .fab{
    background:linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.02)), color-mix(in srgb, var(--blue) 86%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.60), inset 0 -10px 18px rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.22), 0 10px 26px color-mix(in srgb, var(--blue) 45%, transparent);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    transition:transform .15s ease;
  }
  .fab:active{background:color-mix(in srgb, var(--blue) 92%, transparent); transform:scale(0.92);}

  /* Today tab */
  .today-hero{
    --hero-bg:linear-gradient(155deg, rgba(255,255,255,0.20), rgba(255,255,255,0) 45%), color-mix(in srgb, var(--navy) 90%, transparent);
    background:var(--hero-bg); border-radius:28px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.40), inset 0 0 0 1px rgba(255,255,255,0.10), 0 14px 34px color-mix(in srgb, var(--navy) 38%, transparent);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    transition:transform .15s ease;
  }
  .today-hero:active{background:var(--hero-bg); transform:scale(0.99);}
  .today-tile, .stat{
    background:var(--glass-fill); border-radius:22px;
    box-shadow:var(--glass-hi), var(--glass-shadow);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    transition:transform .15s ease, background .15s ease;
  }
  .stat{border-radius:18px;}
  .today-tile:active{background:var(--glass-fill-strong); transform:scale(0.98);}

  /* Segmented controls and list buttons */
  .seg-btn{
    background:var(--glass-fill); border-radius:999px;
    box-shadow:var(--glass-hi);
    transition:background .2s ease, color .2s ease, transform .15s ease;
  }
  .seg-btn:active{transform:scale(0.97);}
  .seg-btn.active{
    background:color-mix(in srgb, var(--navy) 88%, transparent); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35), inset 0 0 0 1px rgba(255,255,255,0.12), 0 4px 12px color-mix(in srgb, var(--navy) 30%, transparent);
  }
  .backup-btn, .cust-section{border-radius:22px;}
  .backup-btn:active{background:var(--glass-fill-strong);}

  /* Sheets: a floating glass panel with the app visible, blurred, behind it */
  .overlay{
    background:rgba(10,25,40,0.28);
  }
  .sheet{
    background:var(--bg);
    width:calc(100% - 16px); max-width:560px;
    /* Always leave room above for the status bar / notch / Dynamic Island so the
       close button can never slide underneath it (92vh ignored the safe areas,
       and on iPad the sheet's top edge ended up under the system bar). */
    max-height:calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 28px);
    margin:0 auto calc(env(safe-area-inset-bottom) + 8px);
    padding:8px 16px 20px;
    border-radius:32px;
    border:1px solid var(--glass-edge-soft);
    box-shadow:var(--glass-hi), 0 24px 60px rgba(0,0,0,0.30);
    -webkit-backdrop-filter:blur(34px) saturate(190%); backdrop-filter:blur(34px) saturate(190%);
  }
  @supports (background:color-mix(in srgb, red, blue)){
    .sheet{background:var(--sheet-fill);}
  }
  .sheet-handle{background:rgba(120,135,150,0.45); width:40px;}
  .sheet-close{background:var(--glass-fill); box-shadow:var(--glass-hi); width:34px; height:34px;}

  /* Form fields: recessed glass */
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea{
    background:var(--field-fill); border:1px solid var(--field-edge); border-radius:16px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.06);
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=date]:focus, input[type=time]:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--blue);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 30%, transparent);
  }

  /* Toast */
  .toast{
    background:var(--navy-dark); border-radius:999px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 28px rgba(0,0,0,0.30);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  }
  @supports (background:color-mix(in srgb, red, blue)){
    .toast{background:color-mix(in srgb, var(--navy-dark) 80%, transparent);}
  }

  /* In-app confirm / backup / unsaved-changes / update pop-ups are built in JS
     with inline styles, so they're restyled here (!important beats inline). */
  #appConfirmPrompt > div:first-child, #backupPopup > div:first-child, #unsavedChangesPrompt > div:first-child{
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #appConfirmPrompt > div:last-child, #backupPopup > div:last-child, #unsavedChangesPrompt > div:last-child{
    width:calc(100% - 16px) !important; max-width:480px !important;
    margin-bottom:calc(env(safe-area-inset-bottom) + 8px);
    border-radius:32px !important;
    border:1px solid var(--glass-edge-soft);
    box-shadow:var(--glass-hi), 0 24px 60px rgba(0,0,0,0.30) !important;
    -webkit-backdrop-filter:blur(34px) saturate(190%); backdrop-filter:blur(34px) saturate(190%);
  }
  @supports (background:color-mix(in srgb, red, blue)){
    #appConfirmPrompt > div:last-child, #backupPopup > div:last-child, #unsavedChangesPrompt > div:last-child{
      background:var(--sheet-fill) !important;
    }
  }
  #updatePopup > div{
    border-radius:999px !important; padding:10px 12px 10px 16px !important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), 0 10px 28px rgba(0,0,0,0.30) !important;
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  }
  @supports (background:color-mix(in srgb, red, blue)){
    #updatePopup > div{background:color-mix(in srgb, var(--navy) 82%, transparent) !important;}
  }
  #updatePopup button{border-radius:999px !important;}

  /* Fallbacks: browsers without backdrop blur, or people who've asked iOS to
     reduce transparency, get solid, fully legible surfaces instead. */
  @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    body{--glass-fill:rgba(var(--glass-base),0.92); --sheet-fill:rgb(var(--sheet-base));}
    body.dark{--glass-fill:rgba(var(--glass-strong-base),0.94); --sheet-fill:rgb(var(--sheet-base));}
  }
  @media (prefers-reduced-transparency: reduce){
    body{--glass-fill:rgba(var(--glass-base),0.96); --sheet-fill:rgb(var(--sheet-base));}
    body.dark{--glass-fill:rgba(var(--glass-strong-base),0.96); --sheet-fill:rgb(var(--sheet-base));}
    .today-tile, .stat, .sheet, header, .fab, .toast{-webkit-backdrop-filter:none; backdrop-filter:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .btn, .fab, .icon-btn, .today-tile, .today-hero, .seg-btn{transition:none;}
    .btn:active, .fab:active, .icon-btn:active, .today-tile:active, .today-hero:active, .seg-btn:active{transform:none;}
  }

  /* iPad / desktop (any window at least this big each way, so a phone — even on its side — never matches):
     - the four tabs move from the bottom of the screen to sit directly under the header, the two together
       forming one bar with rounded lower corners. 09-boot.js measures it, so --header-h becomes the height of
       both and --tabbar-h becomes 0, and everything positioned from those (page, + button, pop-up messages,
       side pane, schedule editor) follows without changing.
     - when it isn't the landscape split view, the content is kept a readable column in the middle rather than
       stretched edge to edge (the split view below resets this). */
  @media screen and (min-width: 700px) and (min-height: 600px){
    /* Larger screens: type. The same heavy weights that read well on a phone look overly bold on an iPad or a computer
       monitor, so everything steps one weight lighter here (800 -> 700, 700 -> 600), the text is drawn with grayscale
       smoothing (the default on a Mac thickens it), the small grey labels get a bit more contrast and the base size goes
       up a touch. A phone, even on its side, is under 600px tall and never gets any of this. Reports are left alone so
       what prints looks the same wherever it was made. */
    :root{ --fw-black:700; --fw-bold:600; --ink-muted:#566B7C; }
    body.dark{ --ink-muted:#8CA0B3; }
    html{ font-size:19px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
    :is(header, .tabs, .subtabs, main, .overlay, .sched-editor, .ctx-menu, #toast, .se-modal, .pane-dash) :is([style*="font-weight:800"], [style*="font-weight: 800"]){ font-weight:700 !important; }
    :is(header, .tabs, .subtabs, main, .overlay, .sched-editor, .ctx-menu, #toast, .se-modal, .pane-dash) :is([style*="font-weight:700"], [style*="font-weight: 700"]){ font-weight:600 !important; }
    header{ border-radius:0; box-shadow:inset 0 1px 0 rgba(255,255,255,0.10); }
    .tabs{
      top:var(--header-only-h, 64px); bottom:auto; justify-content:center; gap:8px;
      padding:8px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));
      border-radius:0 0 26px 26px;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.20);
    }
    .tab{ flex:0 1 190px; padding:10px 4px; }
    body{ padding-bottom:calc(var(--tabbar-h, 0px) + 8px + env(safe-area-inset-bottom, 0px)); }
    main{ max-width:720px; margin-left:auto; margin-right:auto; }
    .fab{ right:max(18px, calc((100% - 720px) / 2 + 18px)); }
  }

  /* =====================================================================
     Landscape split view (iPad / large screens held sideways).
     Full-width header and tabs across the top; below it, on the left, the current list (rounds, jobs, quotes,
     campaigns...). Whatever you tap — a customer, quote, job, campaign, a
     settings screen — opens in a pane on the right instead of sliding up as
     a sheet. It's the same sheet underneath (so every existing screen, back
     step and close button keeps working); only where it's drawn changes.
     Phones and portrait stay exactly as they were: this only applies when
     the screen is wide AND tall enough, so a phone on its side is excluded.
     The Today tab, when nothing is open, uses the whole width as a dashboard
     (see below) and drops back into the split as soon as something opens.
     ===================================================================== */
  .pane-divider{ display:none; } /* shown only by the wide split-view block below */
  @media screen and (orientation: landscape) and (min-width: 960px) and (min-height: 600px){
    :root{ --list-w: clamp(400px, 40vw, 520px); }

    /* The header (and the tabs under it) always span the whole screen, so they never jump between
       full width and column width as you change tab or open something; the right-hand pane starts
       just below them instead of running up behind. */
    /* The list is its own scrolling column, so its scrollbar sits at the column's edge beside the divider — not at the far
       side of the window, beside the right-hand pane, where the window's scrollbar used to be. The window itself no longer scrolls. */
    html, body{ height:100%; overflow:hidden !important; }
    body{ padding:0; min-height:0; }
    #appScroll{ position:fixed; top:var(--header-h, 170px); bottom:var(--tabbar-h, 64px); left:0; width:var(--list-w); overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
    main{ padding-top:14px; }
    body .kb-selected, body .ctx-target{ scroll-margin-top:12px; } /* the column starts below the header, so no header allowance */
    body .today-top.running{ top:0; }
    main{ box-sizing:border-box; min-height:100%; max-width:none; margin-left:0; margin-right:0; }
    .fab{ right:auto; left:calc(var(--list-w) - 74px); }

    /* The overlay becomes the always-present right-hand pane */
    .overlay{
      display:flex; position:fixed; top:var(--header-h, 170px); bottom:var(--tabbar-h, 64px); right:0; left:var(--list-w);
      background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none;
      align-items:stretch; justify-content:stretch; z-index:15;
      border-left:1px solid var(--glass-edge-soft);
    }
    .overlay:not(.show) .sheet{ display:none; }
    .overlay:not(.show)::after{
      content:"Select something on the left to see its details here";
      margin:auto; padding:0 40px; max-width:340px; text-align:center;
      font-size:0.9375rem; font-weight:var(--fw-bold); line-height:1.5; color:var(--ink-muted); opacity:0.75;
    }
    /* Nothing open on a tab that has a summary (Rounds, Jobs, Quotes, Marketing): the pane shows it instead of the
       plain prompt. 08d-desktop.js draws it; the Today tab keeps its own full-width dashboard below. */
    .overlay.has-dash:not(.show)::after{ content:none; }
    .overlay:not(.show) .pane-dash{ display:block; flex:1 1 auto; min-width:0; overflow-y:auto; padding:22px 28px 32px; }

    /* A report opened on this layout previews in the pane (06-settings-reports-a.js, openReportPreview) rather than
       over the whole screen; its Print / Share bar comes with it. No z-index here: it keeps the full-screen one so
       the + button can't sit on top of the bar when Today is showing full width. */
    .report-preview.in-pane{ inset:auto; top:var(--header-h, 170px); bottom:var(--tabbar-h, 64px); left:var(--list-w); right:0; border-left:1px solid var(--glass-edge-soft); }
    /* On the wide view the preview's buttons go in a left sidebar (close and zoom on top, Print / Share below), which gives the paper the full height */
    .report-preview.in-pane.show{ display:grid; grid-template-columns:104px minmax(0, 1fr); grid-template-rows:auto 1fr; }
    .report-preview.in-pane .rp-bar{ grid-column:1; grid-row:1; flex-direction:column; align-items:stretch; gap:6px; padding:12px 10px 6px; }
    .report-preview.in-pane .rp-actions{ grid-column:1; grid-row:2; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:8px; padding:6px 10px 12px; }
    .report-preview.in-pane .rp-scroll{ grid-column:2; grid-row:1 / -1; min-height:0; }
    .report-preview.in-pane .rp-title{ order:-1; flex:none; white-space:normal; overflow:visible; font-size:0.8125rem; line-height:1.25; margin:2px 2px 6px; }
    .report-preview.in-pane .rp-bar .rp-btn:first-child{ order:-2; }
    .report-preview.in-pane .rp-btn{ width:100%; }
    .report-preview.in-pane .rp-action{ flex:none; flex-direction:column; gap:4px; padding:10px 4px; font-size:0.75rem; text-align:center; }
    body[data-tab="today"]:not(:has(#overlay.show)) .report-preview.in-pane{ left:0; border-left:none; } /* Today is full width until something opens */
    body[data-tab="schedule"] .report-preview.in-pane{ left:0; border-left:none; } /* the Schedule has no list on the left, so a printout fills the width */

    /* The draggable boundary between the list and the pane (08d-desktop.js). Hidden when there's no pane to resize. */
    /* The Schedule tab is a full-width workspace: neither column is used, so the right-hand pane (placeholder, summary
       or whatever was last open) and the list behind it are switched off instead of showing through. A pop-up opened
       from the header still appears, since that is deliberate. */
    body[data-tab="schedule"]:not(:has(#overlay.show)) .overlay{ display:none; }
    body[data-tab="schedule"] #appScroll{ display:none; }
    .pane-divider{ display:block; position:fixed; z-index:18; top:var(--header-h, 170px); bottom:var(--tabbar-h, 64px); left:var(--list-w); width:10px; cursor:col-resize; touch-action:none; outline:none; }
    body[data-tab="today"]:not(:has(#overlay.show)) .pane-divider, body:has(#schedEditor.show) .pane-divider, body[data-tab="schedule"] .pane-divider{ display:none; }
    .sheet{
      width:100%; max-width:none; height:100%; max-height:none; margin:0;
      border-radius:0; border:none; animation:none;
      padding:18px 28px calc(env(safe-area-inset-bottom, 0px) + 28px);
      box-shadow:none;
    }
    .pv-actions{ margin:0 -28px; padding-left:28px; padding-right:28px; }
    .sheet-handle{ display:none; }
    .overlay.top-sheet{ align-items:stretch; }
    .overlay.top-sheet .sheet{ margin:0; max-height:none; animation:none; }

    /* Today, nothing open: use the full width as a dashboard instead of a
       phone-width column with an empty pane beside it. */
    body[data-tab="today"]:not(:has(#overlay.show)){
      --list-w: 100%;
    }
    body[data-tab="today"]:not(:has(#overlay.show)) .overlay{ display:none; }
    body[data-tab="today"]:not(:has(#overlay.show)) .fab{ right:18px; left:auto; }
    body[data-tab="today"]:not(:has(#overlay.show)) main{
      display:grid; grid-template-columns:minmax(300px, 34%) 1fr; column-gap:16px; align-items:start;
      padding-bottom:40px; min-height:0;
    }
    body[data-tab="today"]:not(:has(#overlay.show)) main > *{ grid-column:1 / -1; }
    body[data-tab="today"]:not(:has(#overlay.show)) main > .today-top{ grid-column:1; grid-row:2; }
    body[data-tab="today"]:not(:has(#overlay.show)) main > .today-top.running{ top:14px; }
    body[data-tab="today"]:not(:has(#overlay.show)) main > .today-run-list{ grid-column:2; grid-row:2; }
    body[data-tab="today"]:not(:has(#overlay.show)) main > .today-grid{
      grid-column:2; grid-row:2; grid-template-columns:repeat(3, 1fr); margin-bottom:0;
    }
    body[data-tab="today"]:not(:has(#overlay.show)) main > .today-grid > .today-tile:last-child{ grid-column:1 / -1; }

    /* Today in the split (something open): compact so it fits without scrolling */
    body[data-tab="today"]:has(#overlay.show) .today-hero{ padding:12px 14px; margin-bottom:8px; }
    body[data-tab="today"]:has(#overlay.show) .today-hero .num{ font-size:1.75rem; }
    body[data-tab="today"]:has(#overlay.show) .today-hero .value{ margin-top:6px; }
    body[data-tab="today"]:has(#overlay.show) .today-tile{ padding:10px 12px; }
    body[data-tab="today"]:has(#overlay.show) .today-tile .num{ font-size:1.3rem; }
    body[data-tab="today"]:has(#overlay.show) .today-grid{ gap:8px; }

    /* Schedule editor as a workspace: instead of covering the whole screen it sits between the header and the
       tab bar. The tools stack in a rail down the left (so the calendar gets the full height) and the title,
       calendar and Commit / Reject bar fill the column beside it. Phones and portrait keep the full-screen
       editor with the toolbar across the top. */
    .sched-editor.show{ display:grid; grid-template-columns:88px minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); }
    .se-tools{ grid-column:1; grid-row:1 / -1; flex-direction:column; gap:6px; padding:10px 8px; overflow-x:hidden; overflow-y:auto; border-bottom:none; border-right:1px solid var(--line); }
    .se-tool{ width:100%; padding:10px 4px; white-space:normal; text-align:center; line-height:1.25; }
    .se-tool.se-tool-weeks{ display:block; }
    .se-bar{ grid-column:2; grid-row:1; padding-top:12px; }
    .se-scroll{ grid-column:2; grid-row:2; }
    .se-more{ display:none; } /* replaced by ＋ Weeks in the rail */
    .se-chip{ scroll-margin-top:40px; } /* keeps a chip moved with the arrow keys clear of the sticky day names */
    .se-modal{ align-items:center; }
    .se-modal-card{ border-radius:20px; padding-bottom:16px; }
  }

  @media print{
    body, body.dark{
      --bg:#ffffff !important;
      --surface:#ffffff;
      --ink:#1C2B36;
      --ink-muted:#66798A;
      --line:#E3E9EC;
      --card-surface:#ffffff;
      --card-border:transparent;
      --card-shadow:none;
    }
    html, body{ overflow:visible !important; height:auto !important; }
    #appScroll{ position:static !important; overflow:visible !important; width:auto !important; }
    header, .tabs, #lastActionBanner, #marketingFollowUpBanner, #jobAnniversaryBanner, #importReviewBanner, main, .fab, .overlay, .report-preview, .sched-editor, .pane-divider, .ctx-menu, #importFile, #importSpreadsheetFile, #syncFile, .toast{
      display:none !important;
    }
    body{ padding-top:0 !important; padding-bottom:0 !important; min-height:0 !important; }
    .print-area{
      display:block !important;
      position:static;
      width:100%;
      padding:0;
    }
    /* Liquid Glass extras must never reach paper: the fixed colour wash behind the
       app (body::before) was printing as a dark tinted block over the report. */
    html, body{ background:#ffffff !important; }
    body::before, body::after{ display:none !important; content:none !important; background:none !important; }
    .print-area, .print-area *{
      -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
    }
  }
  /* Little icon buttons (help, print, close, round actions, Reorder, Map, header icons...) have no box
     behind them — just the icon, with a soft flash when pressed. */
  .icon-btn, .sheet-close, .icon-plain{background:transparent !important; box-shadow:none !important; border-color:transparent !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important;}
  .icon-btn:active, .sheet-close:active, .icon-plain:active{background:rgba(128,140,155,0.22) !important;}
  /* Scrolling inside a pop-up never carries on to the page behind it */
  .overlay, .sheet, #schedEditor, .rp-scroll{overscroll-behavior:contain;}
  /* Your location on the round map */
  .you-pin{background:none; border:none;}
  .you-dot{position:relative; width:18px; height:18px; border-radius:50%; background:#1A73E8; border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,0.45); box-sizing:border-box;}
  .you-dot::after{content:""; position:absolute; inset:-9px; border-radius:50%; background:rgba(26,115,232,0.30); animation:youPulse 2s ease-out infinite;}
  @keyframes youPulse{0%{transform:scale(0.5); opacity:0.9;} 100%{transform:scale(1.5); opacity:0;}}
  .you-key{display:inline-block; width:10px; height:10px; border-radius:50%; background:#1A73E8; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.25); margin-right:5px; vertical-align:-1px; box-sizing:border-box;}
  .locate-btn{width:34px; height:34px; border:none; border-radius:8px; background:#fff; color:#1A73E8; font-size:1.25rem; line-height:34px; padding:0; box-shadow:0 1px 5px rgba(0,0,0,0.4);}

  /* ---------- Today: Start / Stop, the day's list and the progress bar (02b-today-run.js) ---------- */
  .today-top .today-hero{margin-bottom:8px;}
  .today-run-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .today-top:not(:has(.today-run-bar)) .today-hero{margin-bottom:12px;} /* no Start / Stop here (iPad, desktop): the hero's usual gap */
  .run-btn{padding:6px 14px; border:none; border-radius:999px; font-size:0.75rem; font-weight:var(--fw-black); white-space:nowrap;}
  .run-btn.start{background:var(--green); color:#fff;}
  .run-btn.stop{background:var(--red-dim); color:var(--red);}
  .run-btn.all{background:var(--blue-dim); color:var(--blue-deep);}
  .run-btn:disabled{opacity:0.4;}
  /* While running, the hero and its buttons are pinned under the header and the list scrolls beneath them. The hero is
     normally a little see-through; here it is made solid so the cards passing under it don't show. */
  .today-top.running{position:sticky; top:var(--header-h, 170px); z-index:6; background:var(--bg); padding-top:4px;}
  .today-top.running .today-hero{background:linear-gradient(155deg, rgba(255,255,255,0.20), rgba(255,255,255,0) 45%), var(--navy); -webkit-backdrop-filter:none; backdrop-filter:none;}
  .today-hero.compact{padding:12px 14px;} /* during a Start run the hero shrinks to the totals and the progress bar (no round chips) */
  .today-hero.compact .num{font-size:1.75rem;}
  .today-hero.compact .num[style]{font-size:1.25rem !important;}
  .today-hero.compact .value{margin-top:6px; font-size:0.8125rem;}
  .today-hero.compact .hero-progress{margin-top:10px;}
  .hero-progress{height:7px; margin-top:14px; border-radius:999px; background:rgba(255,255,255,0.18); overflow:hidden;}
  .hero-progress-fill{height:100%; border-radius:999px; background:#6FD3A1; transition:width .35s ease;}
  .hero-progress-lbl{display:flex; justify-content:space-between; margin-top:5px; font-size:0.6875rem; font-weight:var(--fw-bold); color:#B9D2E2;}
  .today-done .swipe-wrap, .swipe-wrap.today-done{opacity:0.6;}
  .today-run-list > .round-group-header:first-child{margin-top:4px !important;}
  .subtabs{position:fixed; left:0; right:0; top:var(--sub-top, 64px); z-index:19; display:flex; padding:0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); background:var(--bg); border-bottom:1px solid var(--line);}
  .subtabs[hidden]{display:none;}
  .subtab{position:relative; flex:1 1 0; min-width:0; padding:12px 6px 10px; border:none; background:transparent; color:var(--ink-muted); font-size:0.9375rem; font-weight:var(--fw-black); transition:color .15s ease;}
  .subtab.active{color:var(--blue-deep);}
  .subtab.active::after{content:""; position:absolute; left:20%; right:20%; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--blue);}
  .subtab .tab-badge{position:static; display:inline-block; margin-left:6px; vertical-align:1px;}

  /* ---------- iPad / desktop extras (08d-desktop.js) ---------- */
  /* Right-pane summary panel and divider: only ever shown by the wide split-view block above. */
  .pane-dash{ display:none; }
  .pd-title{ font-size:1.25rem; font-weight:var(--fw-black); margin:0 0 2px; }
  .pd-sub{ color:var(--ink-muted); font-size:0.8125rem; font-weight:600; margin:0 0 16px; }
  .pd-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:14px 0 20px; }
  .pd-sub + .pd-stats{ margin-top:0; }
  .pd-stats .stat{ text-align:left; padding:14px; border:1px solid var(--card-border); box-shadow:var(--card-shadow); }
  .pd-stats .stat .num{ font-size:1.375rem; }
  .pd-stats .pd-note{ font-size:0.75rem; font-weight:600; color:var(--ink-muted); margin-top:4px; }
  .pd-stats .stat.bad .num{ color:var(--red); }
  .pd-stats .stat.good .num{ color:var(--green); }
  .pd-stats .stat.warn .num{ color:var(--amber); }
  .pd-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; background:var(--card-surface); border:1px solid var(--card-border); box-shadow:var(--card-shadow); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .pd-row .t1{ font-size:0.9062rem; font-weight:var(--fw-black); }
  .pd-row .t2{ font-size:0.75rem; color:var(--ink-muted); margin-top:2px; }
  .pd-row .pd-amt{ font-weight:var(--fw-black); font-size:0.9375rem; white-space:nowrap; color:var(--emphasis); }
  .pd-empty{ color:var(--ink-muted); font-size:0.875rem; font-weight:600; line-height:1.5; padding:6px 2px 18px; }
  /* The divider's grip and guide line; dragging it also stops text being selected on the way. */
  .pane-divider::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--blue); opacity:0; transition:opacity .15s ease; }
  .pane-divider::after{ content:""; position:absolute; left:50%; top:50%; width:4px; height:44px; margin:-22px 0 0 -2px; border-radius:2px; background:var(--ink-muted); opacity:0.4; transition:opacity .15s ease, background .15s ease; }
  .pane-divider:hover::before, .pane-divider.dragging::before, .pane-divider:focus-visible::before{ opacity:0.55; }
  .pane-divider:hover::after, .pane-divider.dragging::after, .pane-divider:focus-visible::after{ opacity:1; background:var(--blue); }
  body.pane-resizing{ cursor:col-resize; -webkit-user-select:none; user-select:none; }

  /* The card the keyboard (or a right-click menu) is on. Drawn as an inside outline because the swipe wrapper
     clips anything that sticks out; scroll-margin keeps a card moved with j / k clear of the fixed header. */
  .kb-selected, .ctx-target{ outline:2px solid var(--blue); outline-offset:-2px; scroll-margin-top:calc(var(--header-h, 170px) + 12px + var(--today-lock, 0px)); scroll-margin-bottom:28px; }
  .cust-card.kb-selected::before, .round-card.kb-selected::before{ width:9px; }

  /* Right-click menu */
  .ctx-menu{ position:fixed; z-index:90; min-width:220px; max-width:320px; overflow-y:auto; background:var(--card-surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 14px 38px rgba(0,0,0,0.28), 0 2px 6px rgba(0,0,0,0.14); font-size:0.8438rem; }
  .ctx-title{ padding:6px 10px 4px; font-size:0.7188rem; font-weight:var(--fw-black); letter-spacing:.03em; text-transform:uppercase; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctx-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:none; border-radius:8px; padding:8px 10px; font:inherit; font-weight:var(--fw-bold); color:var(--ink); cursor:pointer; }
  .ctx-item:hover, .ctx-item:focus-visible{ background:var(--blue-dim); outline:none; }
  .ctx-item.danger{ color:var(--red); }
  .ctx-item.danger:hover, .ctx-item.danger:focus-visible{ background:var(--red-dim); }
  .ctx-hint{ margin-left:auto; padding-left:18px; font-size:0.7188rem; font-weight:var(--fw-black); color:var(--ink-muted); }
  .ctx-sep{ height:1px; margin:5px 4px; background:var(--line); }

  /* Hover states — mouse and trackpad only. A touch screen has no hover, and a stuck hover after a tap would look wrong. */
  @media (hover:hover) and (pointer:fine){
    .cust-top, .round-card, .backup-btn, .today-tile, .today-hero, .seg-btn, .btn, .btn-open, .btn-primary, .tab, .fab, .rp-btn, .rp-action,
    .pd-row, .call-btn, .dir-btn, .icon-btn, .sheet-close, .icon-plain, .round-group-header .section-label[onclick]{ cursor:pointer; }
    .cust-card, .round-card{ transition:box-shadow .15s ease, border-color .15s ease; }
    .cust-card:hover, .round-card:hover{ border-color:var(--blue); box-shadow:0 4px 16px rgba(16,52,76,0.16); }
    .backup-btn:hover, .pd-row:hover{ border-color:var(--blue); background:var(--card-tint); }
    .today-tile:hover{ box-shadow:0 4px 16px rgba(16,52,76,0.16); }
    .today-hero:hover{ filter:brightness(1.12); }
    .seg-btn:not(.active):hover{ background:var(--blue-dim); color:var(--ink); }
    .btn:hover, .btn-open:hover{ filter:brightness(0.95); }
    .btn-primary:hover, .fab:hover{ filter:brightness(1.08); }
    .call-btn:hover, .dir-btn:hover{ filter:brightness(0.9); }
    .tab:not(.active):hover{ background:rgba(255,255,255,0.08); color:#fff; }
    .subtab, .se-mini, .se-tool{ cursor:pointer; }
    .subtab:not(.active):hover{ color:var(--ink); }
    .se-mini:hover{ filter:brightness(0.95); }
    .rp-btn:hover, .rp-action:hover{ background:rgba(255,255,255,0.28); }
    /* After the "little icon buttons have no box" rule above, which is !important */
    .icon-btn:hover, .sheet-close:hover, .icon-plain:hover{ background:rgba(128,140,155,0.20) !important; }
    /* Report table rows, in the preview only (the PDF is drawn offscreen, where nothing can be hovered) */
    .rp-sheet .rpt-table tr:hover td{ background:#eef6fb; }
  }
</style>
