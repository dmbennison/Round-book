<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Book">
<meta name="theme-color" content="#10344C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/index.umd.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
<title>Round Book</title>
<style>
  :root{
    --navy:#10344C;
    --navy-dark:#0B2438;
    --blue:#2F9BDE;
    --blue-dim:#DCEFFA;
    --green:#2E9E5B;
    --green-dim:#E2F5EA;
    --amber:#C98A1D;
    --amber-dim:#FBF0DC;
    --red:#C4453F;
    --red-dim:#FAE4E2;
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#1C2B36;
    --ink-muted:#66798A;
    --line:#E3E9EC;
    --radius:14px;
    --emphasis:var(--navy);
    --card-tint:#EEF6FB;
    --card-surface:#FFFFFF;
    --card-border:#DCF0F8;
    --card-shadow:0 1px 3px rgba(0,0,0,0.06);
    /* Fixed colours for the directions/call buttons — deliberately NOT theme
       variables, so they stay the same blue/green whichever colour scheme is
       chosen, rather than following --blue/--green like most of the app does. */
    --fixed-blue:#2F9BDE;
    --fixed-blue-deep:#1F7BB8;
    --fixed-green:#2E9E5B;
  }
  body.dark{
    --bg:#0E1620;
    --surface:#16212C;
    --ink:#EAF1F6;
    --ink-muted:#8CA0B3;
    --line:#28394A;
    --blue-dim:#173347;
    --green-dim:#123321;
    --amber-dim:#3A2C10;
    --red-dim:#3A1616;
    --emphasis:#EAF1F6;
    --card-tint:#182530;
    --card-surface:#1C3444;
    --card-border:transparent;
    --card-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 8px rgba(9,28,36,0.45), 0 1px 2px rgba(9,28,36,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  html{font-size:18px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none;
    user-select:none;
  }
  input, textarea{-webkit-user-select:text; user-select:text;}
  h1,h2,h3{margin:0; font-family:-apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:-0.01em;}

  header{
    background:var(--navy);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    position:sticky; top:0; z-index:20;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(160deg, var(--blue), var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .brand-mark svg{width:26px;height:26px;}
  .brand-text{min-width:0;}
  .brand h1{font-size:1.1875rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand .sub{font-size:0.6875rem; color:#A9C4D8; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #weatherPill{text-transform:none; margin-top:8px; white-space:normal;}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;border:none; flex-shrink:0;
    background:rgba(255,255,255,0.12); color:#fff; display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{background:rgba(255,255,255,0.22);}

  .tabs{display:flex; gap:6px; margin-top:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; text-align:center; padding:9px 14px; border-radius:10px; font-size:0.8125rem; font-weight:700;
    color:#B9D2E2; background:transparent; border:none; white-space:nowrap;
  }
  .tab.active{background:rgba(255,255,255,0.14); color:#fff;}

  main{padding:14px 14px 100px;}

  .section-label{
    font-size:0.6875rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin:18px 2px 8px;
  }
  .section-label:first-child{margin-top:0;}

  .day-divider{
    font-size:0.75rem; font-weight:800; color:var(--blue-deep); background:var(--blue-dim);
    padding:7px 12px; border-radius:8px; margin:16px 0 8px;
  }
  .day-divider:first-child{margin-top:0;}

  .round-card{
    background:linear-gradient(to bottom, var(--card-surface), var(--card-tint));
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--card-border); box-shadow:var(--card-shadow); display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:relative; overflow:hidden;
  }
  .round-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .round-group-header{position:relative; padding-left:12px;}
  .round-group-header::before{
    content:""; position:absolute; left:0; top:1px; bottom:1px; width:4px; background:var(--blue); border-radius:2px;
  }
  .round-card .rname{font-size:1rem; font-weight:800;}
  .round-card .rcount{font-size:0.7812rem; color:var(--ink-muted); margin-top:2px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{
    font-size:0.7188rem; font-weight:800; padding:4px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge.due{background:var(--amber-dim); color:var(--amber);}
  .badge.overdue{background:var(--red-dim); color:var(--red);}
  .badge.owed{background:var(--red-dim); color:var(--red);}
  .badge.escalate{background:var(--red); color:#fff;}
  .badge.ok{background:var(--green-dim); color:var(--green);}
  .badge.paused{background:var(--line); color:var(--ink-muted);}
  .badge.deferred{background:var(--blue-dim); color:var(--blue-deep);}
  .badge.anniversary{background:var(--blue-dim); color:var(--blue-deep);}
  .chev{opacity:0.35;}

  .swipe-wrap{position:relative; border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .swipe-bg{position:absolute; inset:0; display:flex; align-items:center; font-weight:800; font-size:0.875rem; color:#fff; padding:0 22px; opacity:0;}
  .swipe-bg-left{background:var(--green); justify-content:flex-start;}
  .swipe-bg-right{background:var(--blue); justify-content:flex-end;}
  .cust-card{
    background:linear-gradient(to bottom, var(--card-surface), var(--card-tint));
    border-radius:var(--radius); padding:14px 16px;
    border:1px solid var(--card-border); box-shadow:var(--card-shadow); position:relative; z-index:1; touch-action:pan-y; overflow:hidden;
  }
  .cust-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .cust-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .cust-name{font-size:1rem; font-weight:800;}
  .cust-addr{font-size:0.8125rem; color:var(--ink-muted); margin-top:2px;}
  .cust-price{font-size:0.875rem; font-weight:800; color:var(--emphasis); white-space:nowrap;}
  .cust-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .cust-btn-row{display:flex; gap:6px;}
  .dir-btn, .call-btn{
    width:26px; height:26px; border-radius:50%; border:none; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto;
  }
  .dir-btn{background:var(--fixed-blue);}
  .call-btn{background:var(--fixed-green);}
  .dir-btn svg, .call-btn svg{width:14px;height:14px;}
  .dir-btn:active{background:var(--fixed-blue-deep);}
  .call-btn:active{filter:brightness(0.88);}
  .cust-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .cust-actions{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; padding:10px 8px; border-radius:10px; font-size:0.8438rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:15px;height:15px;}
  .btn-clean{background:var(--blue-dim); color:var(--blue-deep);}
  .btn-clean:active{background:#c8e6f8;}
  .btn-paid{background:var(--green-dim); color:var(--green);}
  .btn-paid:active{background:#cdefdc;}
  .btn-open{background:var(--bg); color:var(--ink); flex:0 0 auto; width:42px;}
  /* Utility icons (Show map, Reorder, the round-actions kebab, every menu-row
     icon in Settings/Reports/Backup) inherit currentColor from --ink, which in
     dark mode is a near-white text colour — fine for text, but as a thin SVG
     stroke it reads as a harsh white outline. Softening just the icon (not the
     button's own text) to --ink-muted keeps it recognisable without the glare. */
  .btn-open svg, .backup-btn svg{color:var(--ink-muted);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-muted);
  }
  .empty svg{width:44px;height:44px; opacity:0.3; margin-bottom:10px;}
  .empty b{display:block; color:var(--ink); font-size:0.9375rem; margin-bottom:4px;}
  .empty p{font-size:0.8125rem; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:30;
    width:56px; height:56px; border-radius:50%; border:none; background:var(--blue); color:#fff;
    box-shadow:0 6px 18px rgba(47,155,222,0.45); display:flex; align-items:center; justify-content:center;
  }
  .fab svg{width:24px;height:24px;}
  .fab:active{background:#2585c2;}

  /* Today home tab */
  .today-hero{
    background:var(--navy); color:#fff; border-radius:16px; padding:18px 18px 16px;
    margin-bottom:12px; cursor:pointer;
  }
  .today-hero:active{background:#0a2c45;}
  .today-hero .num{font-size:2.25rem; font-weight:800; line-height:1;}
  .today-hero .lbl{font-size:0.8125rem; font-weight:700; color:#B9D2E2; margin-top:4px;}
  .today-hero .value{font-size:0.9375rem; font-weight:700; margin-top:10px; color:#fff;}
  .today-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:8px;}
  .today-tile{
    background:var(--card-surface); border-radius:14px;
    padding:14px; text-align:left; cursor:pointer; display:block;
  }
  .today-tile:active{background:var(--line);}
  .today-tile .num{font-size:1.625rem; font-weight:800; color:var(--ink); line-height:1;}
  .today-tile .lbl{font-size:0.75rem; font-weight:700; color:var(--ink-muted); margin-top:5px;}

  /* Overlay / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,56,0.4); z-index:40; display:none;
    align-items:flex-end;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden;
    border-radius:20px 20px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation:slideup .22s ease-out; box-sizing:border-box;
  }
  @keyframes slideup{from{transform:translateY(20px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 6px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .sheet-head h2{font-size:1.125rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-close{width:32px;height:32px;border-radius:50%; border:none; background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;}

  label{display:block; font-size:0.7812rem; font-weight:700; color:var(--ink-muted); margin:14px 2px 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%; max-width:100%; min-width:0; padding:12px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.9688rem; color:var(--ink); font-family:inherit; box-sizing:border-box;
  }
  input[type=date], input[type=time]{
    display:block; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .form-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{background:var(--blue); color:#fff; padding:13px; border-radius:12px; font-weight:800; font-size:0.9375rem; flex:1;}
  .btn-primary:active{background:#2585c2;}
  .btn-danger-text{background:none; border:none; color:var(--red); font-weight:700; font-size:0.8438rem; padding:14px 2px 2px; width:100%; text-align:center;}

  .hist-list{list-style:none; margin:0; padding:0;}
  .hist-list li{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.875rem;
    flex-wrap:wrap; gap:4px 0;
  }
  .hist-list li:last-child{border-bottom:none;}

  .stat-row{display:flex; gap:8px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card-surface); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:1.1875rem; font-weight:800;}
  .stat .lbl{font-size:0.6562rem; color:var(--ink-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .backup-btn{
    display:flex; align-items:center; gap:12px; background:var(--card-surface); border:1px solid var(--card-border); box-shadow:var(--card-shadow);
    border-radius:12px; padding:14px; margin-bottom:10px; text-align:left; width:100%;
  }
  .backup-btn svg{width:20px;height:20px; color:var(--blue); flex-shrink:0;}
  .backup-btn .t1{font-size:0.9062rem; font-weight:700;}
  .backup-btn .t2{font-size:0.75rem; color:var(--ink-muted); margin-top:1px;}

  .cust-section{border:1px solid var(--card-border); box-shadow:var(--card-shadow); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--card-surface);}
  .cust-section summary{
    list-style:none; cursor:pointer; padding:13px 14px; font-weight:800; font-size:0.875rem; color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .cust-section summary::-webkit-details-marker{display:none;}
  .cust-section summary .chev{width:16px; height:16px; color:var(--ink-muted); flex-shrink:0; transition:transform .2s;}
  .cust-section[open] summary .chev{transform:rotate(180deg);}
  .cust-section .cust-section-body{padding:2px 14px 14px;}
  .cust-section .cust-section-body > *:first-child{margin-top:0;}

  #importFile, #importSpreadsheetFile{display:none;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy-dark); color:#fff;
    padding:11px 18px; border-radius:24px; font-size:0.8438rem; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast-undo-btn{margin-left:10px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-weight:800; padding:5px 12px; border-radius:14px; font-size:0.7812rem; vertical-align:middle;}

  .seg-row{display:flex; gap:8px; margin-bottom:14px;}
  .seg-btn{
    flex:1; padding:10px 6px; border-radius:11px; background:var(--card-surface);
    font-size:0.8438rem; font-weight:800; color:var(--ink-muted); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg-btn.active{background:var(--navy); color:#fff;}
  .seg-btn .count{
    font-size:0.6875rem; padding:1px 6px; border-radius:20px; background:rgba(0,0,0,0.06); color:inherit;
  }
  .seg-btn.active .count{background:rgba(255,255,255,0.22);}
  .seg-btn-sm{padding:6px 6px; font-size:0.75rem;}

  .summary-overall{display:flex; gap:6px; margin-bottom:12px;}
  .summary-overall .stat{flex:1; padding:7px;}
  .summary-overall .stat .num{font-size:1rem;}
  .summary-overall .stat .lbl{font-size:0.5625rem;}

  .print-area{display:none;}
  .rpt-round-title{font-size:16px; font-weight:800; margin:20px 0 8px; border-bottom:2px solid #10344C; padding-bottom:4px;}
  .rpt-round-title:first-child{margin-top:0;}
  .rpt-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  .rpt-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#66798A; padding:6px 8px; border-bottom:1px solid #ccc;}
  .rpt-table td{font-size:13px; padding:7px 8px; border-bottom:1px solid #eee; vertical-align:top;}
  .rpt-flag{font-weight:700;}
  .rpt-flag.overdue{color:#C4453F;}
  .rpt-flag.due{color:#C98A1D;}
  .rpt-total{text-align:right; font-weight:800; font-size:14px; margin-top:6px;}
  .rpt-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .rpt-header h1{font-size:20px;}
  .rpt-header .rpt-date{font-size:12px; color:#66798A;}
  .rpt-empty-note{font-size:12px; color:#66798A; padding:8px 0;}
  .rpt-footer{margin-top:24px; padding-top:10px; border-top:1px solid #ccc; font-size:11px; color:#66798A; text-align:center;}
  .rpt-page-break{page-break-before:always; break-before:page;}
  .rpt-calendar{width:100%; border-collapse:collapse; table-layout:fixed;}
  .rpt-calendar th{background:#10344C; color:#fff; font-size:11px; padding:6px; text-align:center; font-weight:700;}
  .rpt-calendar td{border:1px solid #E3E9EC; vertical-align:top; padding:5px; height:88px; font-size:10px; overflow:hidden;}
  .rpt-calendar td.outside{background:#F7F9FA; color:#B7C2CA;}
  .rpt-calendar .daynum{font-weight:800; font-size:11.5px; margin-bottom:3px; color:#1C2B36;}
  .rpt-calendar td.outside .daynum{color:#B7C2CA;}
  .rpt-calendar .round-chip{display:block; background:#DCEFFA; color:#1c6fa3; border-radius:5px; padding:1px 4px; margin-bottom:2px; font-weight:700; font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rpt-calendar .round-chip.job-chip{background:#FBEBD2; color:#8A5A15;}

  .inv-meta-table td{padding:4px 8px;}
  .inv-billto{background:#F5F7F8; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:13px; line-height:1.7; color:#1C2B36;}
  .inv-billto .inv-label{color:#66798A; text-transform:uppercase; font-size:10px; letter-spacing:.04em; font-weight:700; display:block; margin-bottom:3px;}
  .inv-total-box{background:#10344C !important; color:#fff !important; border-radius:8px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:16px !important;}
  .inv-total-box .inv-total-amount{font-size:22px; font-weight:800;}
  .inv-stamp{display:inline-block; font-size:12px; font-weight:800; letter-spacing:.06em; padding:4px 12px; border-radius:6px; border:2px solid; text-transform:uppercase; margin-bottom:16px;}
  .inv-stamp.paid{color:#1F7A46; border-color:#1F7A46;}
  .inv-stamp.due{color:#C4453F; border-color:#C4453F;}

  @media print{
    body, body.dark{
      --bg:#ffffff !important;
      --surface:#ffffff;
      --ink:#1C2B36;
      --ink-muted:#66798A;
      --line:#E3E9EC;
      --card-surface:#ffffff;
      --card-border:transparent;
      --card-shadow:none;
    }
    header, #backupBanner, #lastActionBanner, #marketingFollowUpBanner, #jobAnniversaryBanner, #importReviewBanner, main, .fab, .overlay, #importFile, #importSpreadsheetFile, .toast{
      display:none !important;
    }
    .print-area{
      display:block !important;
      position:static;
      width:100%;
      padding:0;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">
