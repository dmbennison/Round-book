<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Book">
<meta name="theme-color" content="#10344C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/index.umd.js" defer></script>
<title>Round Book</title>
<style>
  :root{
    --navy:#10344C;
    --navy-dark:#0B2438;
    --blue:#2F9BDE;
    --blue-dim:#DCEFFA;
    --green:#2E9E5B;
    --green-dim:#E2F5EA;
    --amber:#C98A1D;
    --amber-dim:#FBF0DC;
    --red:#C4453F;
    --red-dim:#FAE4E2;
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#1C2B36;
    --ink-muted:#66798A;
    --line:#E3E9EC;
    --radius:14px;
    --emphasis:var(--navy);
  }
  body.dark{
    --bg:#0E1620;
    --surface:#16212C;
    --ink:#EAF1F6;
    --ink-muted:#8CA0B3;
    --line:#28394A;
    --blue-dim:#173347;
    --green-dim:#123321;
    --amber-dim:#3A2C10;
    --red-dim:#3A1616;
    --emphasis:#EAF1F6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  html{font-size:18px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none;
    user-select:none;
  }
  input, textarea{-webkit-user-select:text; user-select:text;}
  h1,h2,h3{margin:0; font-family:-apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:-0.01em;}

  header{
    background:var(--navy);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    position:sticky; top:0; z-index:20;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(160deg, var(--blue), var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand h1{font-size:1.1875rem; font-weight:800;}
  .brand .sub{font-size:0.6875rem; color:#A9C4D8; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:1px;}
  #weatherPill{text-transform:none;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;border:none;
    background:rgba(255,255,255,0.12); color:#fff; display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn:active{background:rgba(255,255,255,0.22);}

  .tabs{display:flex; gap:6px; margin-top:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; text-align:center; padding:9px 14px; border-radius:10px; font-size:0.8125rem; font-weight:700;
    color:#B9D2E2; background:transparent; border:none; white-space:nowrap;
  }
  .tab.active{background:rgba(255,255,255,0.14); color:#fff;}

  main{padding:14px 14px 100px;}

  .section-label{
    font-size:0.6875rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin:18px 2px 8px;
  }
  .section-label:first-child{margin-top:0;}

  .round-card{
    background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:relative; overflow:hidden;
  }
  .round-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--blue);
  }
  .round-card .rname{font-size:1rem; font-weight:800;}
  .round-card .rcount{font-size:0.7812rem; color:var(--ink-muted); margin-top:2px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .badge{
    font-size:0.7188rem; font-weight:800; padding:4px 8px; border-radius:20px; white-space:nowrap;
  }
  .badge.due{background:var(--amber-dim); color:var(--amber);}
  .badge.overdue{background:var(--red-dim); color:var(--red);}
  .badge.owed{background:var(--red-dim); color:var(--red);}
  .badge.ok{background:var(--green-dim); color:var(--green);}
  .badge.paused{background:var(--line); color:var(--ink-muted);}
  .badge.anniversary{background:var(--blue-dim); color:var(--blue-deep);}
  .chev{opacity:0.35;}

  .swipe-wrap{position:relative; border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .swipe-bg{position:absolute; inset:0; display:flex; align-items:center; font-weight:800; font-size:0.875rem; color:#fff; padding:0 22px;}
  .swipe-bg-left{background:var(--green); justify-content:flex-start;}
  .swipe-bg-right{background:var(--blue); justify-content:flex-end;}
  .cust-card{
    background:var(--surface); border-radius:var(--radius); padding:14px 16px;
    border:1px solid var(--line); position:relative; z-index:1; touch-action:pan-y;
  }
  .cust-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .cust-name{font-size:1rem; font-weight:800;}
  .cust-addr{font-size:0.8125rem; color:var(--ink-muted); margin-top:2px;}
  .cust-price{font-size:0.875rem; font-weight:800; color:var(--emphasis); white-space:nowrap;}
  .cust-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .cust-actions{display:flex; gap:8px; margin-top:12px;}
  .swipe-hint{font-size:0.7188rem; color:var(--ink-muted); margin:0 2px 12px; display:flex; align-items:center; gap:5px;}
  .btn{
    flex:1; padding:10px 8px; border-radius:10px; border:none; font-size:0.8438rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:15px;height:15px;}
  .btn-clean{background:var(--blue-dim); color:var(--blue-deep);}
  .btn-clean:active{background:#c8e6f8;}
  .btn-paid{background:var(--green-dim); color:var(--green);}
  .btn-paid:active{background:#cdefdc;}
  .btn-open{background:var(--bg); color:var(--ink); flex:0 0 auto; width:42px;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-muted);
  }
  .empty svg{width:44px;height:44px; opacity:0.3; margin-bottom:10px;}
  .empty b{display:block; color:var(--ink); font-size:0.9375rem; margin-bottom:4px;}
  .empty p{font-size:0.8125rem; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:30;
    width:56px; height:56px; border-radius:50%; border:none; background:var(--blue); color:#fff;
    box-shadow:0 6px 18px rgba(47,155,222,0.45); display:flex; align-items:center; justify-content:center;
  }
  .fab svg{width:24px;height:24px;}
  .fab:active{background:#2585c2;}

  /* Overlay / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,56,0.4); z-index:40; display:none;
    align-items:flex-end;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden;
    border-radius:20px 20px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation:slideup .22s ease-out; box-sizing:border-box;
  }
  @keyframes slideup{from{transform:translateY(20px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 6px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px;}
  .sheet-head h2{font-size:1.125rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-close{width:32px;height:32px;border-radius:50%; border:none; background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;}

  label{display:block; font-size:0.7812rem; font-weight:700; color:var(--ink-muted); margin:14px 2px 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; max-width:100%; min-width:0; padding:12px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.9688rem; color:var(--ink); font-family:inherit; box-sizing:border-box;
  }
  input[type=date]{
    display:block; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .form-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{background:var(--blue); color:#fff; padding:13px; border-radius:12px; border:none; font-weight:800; font-size:0.9375rem; flex:1;}
  .btn-primary:active{background:#2585c2;}
  .btn-danger-text{background:none; border:none; color:var(--red); font-weight:700; font-size:0.8438rem; padding:14px 2px 2px; width:100%; text-align:center;}

  .hist-list{list-style:none; margin:0; padding:0;}
  .hist-list li{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.875rem;
    flex-wrap:wrap; gap:4px 0;
  }
  .hist-list li:last-child{border-bottom:none;}
  .hist-del{background:none; border:none; color:var(--ink-muted); font-size:0.75rem; padding:4px 6px; white-space:nowrap;}

  .stat-row{display:flex; gap:8px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:1.1875rem; font-weight:800;}
  .stat .lbl{font-size:0.6562rem; color:var(--ink-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .backup-btn{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-bottom:10px; text-align:left; width:100%;
  }
  .backup-btn svg{width:20px;height:20px; color:var(--blue); flex-shrink:0;}
  .backup-btn .t1{font-size:0.9062rem; font-weight:700;}
  .backup-btn .t2{font-size:0.75rem; color:var(--ink-muted); margin-top:1px;}
  #importFile{display:none;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy-dark); color:#fff;
    padding:11px 18px; border-radius:24px; font-size:0.8438rem; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast-undo-btn{margin-left:10px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-weight:800; padding:5px 12px; border-radius:14px; font-size:0.7812rem; vertical-align:middle;}

  .seg-row{display:flex; gap:8px; margin-bottom:14px;}
  .seg-btn{
    flex:1; padding:10px 6px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    font-size:0.8438rem; font-weight:800; color:var(--ink-muted); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg-btn.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .seg-btn .count{
    font-size:0.6875rem; padding:1px 6px; border-radius:20px; background:rgba(0,0,0,0.06); color:inherit;
  }
  .seg-btn.active .count{background:rgba(255,255,255,0.22);}

  .summary-overall{display:flex; gap:8px; margin-bottom:18px;}
  .summary-overall .stat{flex:1;}

  .print-area{display:none;}
  .rpt-round-title{font-size:16px; font-weight:800; margin:20px 0 8px; border-bottom:2px solid #10344C; padding-bottom:4px;}
  .rpt-round-title:first-child{margin-top:0;}
  .rpt-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  .rpt-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#66798A; padding:6px 8px; border-bottom:1px solid #ccc;}
  .rpt-table td{font-size:13px; padding:7px 8px; border-bottom:1px solid #eee; vertical-align:top;}
  .rpt-flag{font-weight:700;}
  .rpt-flag.overdue{color:#C4453F;}
  .rpt-flag.due{color:#C98A1D;}
  .rpt-total{text-align:right; font-weight:800; font-size:14px; margin-top:6px;}
  .rpt-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .rpt-header h1{font-size:20px;}
  .rpt-header .rpt-date{font-size:12px; color:#66798A;}
  .rpt-empty-note{font-size:12px; color:#66798A; padding:8px 0;}
  .rpt-footer{margin-top:24px; padding-top:10px; border-top:1px solid #ccc; font-size:11px; color:#66798A; text-align:center;}
  .rpt-page-break{page-break-before:always; break-before:page;}
  .rpt-calendar{width:100%; border-collapse:collapse; table-layout:fixed;}
  .rpt-calendar th{background:#10344C; color:#fff; font-size:11px; padding:6px; text-align:center; font-weight:700;}
  .rpt-calendar td{border:1px solid #E3E9EC; vertical-align:top; padding:5px; height:74px; font-size:10px; overflow:hidden;}
  .rpt-calendar td.outside{background:#F7F9FA; color:#B7C2CA;}
  .rpt-calendar .daynum{font-weight:800; font-size:11.5px; margin-bottom:3px; color:#1C2B36;}
  .rpt-calendar td.outside .daynum{color:#B7C2CA;}
  .rpt-calendar .round-chip{display:block; background:#DCEFFA; color:#1c6fa3; border-radius:5px; padding:1px 4px; margin-bottom:2px; font-weight:700; font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  @media print{
    body, body.dark{
      --bg:#ffffff;
      --surface:#ffffff;
      --ink:#1C2B36;
      --ink-muted:#66798A;
      --line:#E3E9EC;
    }
    header, #backupBanner, #jobReminderBanner, #quoteFollowUpBanner, #jobAnniversaryBanner, main, .fab, .overlay, #importFile, .toast{
      display:none !important;
    }
    .print-area{
      display:block !important;
      position:static;
      width:100%;
      padding:0;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v12H4z"/><path d="M4 10h16M10 4v12"/><path d="M14 20l3-3M18 20l1-1"/></svg>
      </div>
      <div>
        <h1>Round Book</h1>
        <div class="sub" id="dateNow"></div>
        <div class="sub" id="weatherPill"></div>
      </div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="icon-btn" onclick="openInfo()" aria-label="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
      <button class="icon-btn" onclick="openReports()" aria-label="Reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      </button>
      <button class="icon-btn" onclick="openBackup()" aria-label="Backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="rounds" onclick="setTab('rounds')">Rounds</button>
    <button class="tab" data-tab="jobs" onclick="setTab('jobs')">One-off jobs</button>
    <button class="tab" data-tab="quotes" onclick="setTab('quotes')">Quotes</button>
  </div>
</header>

<div id="backupBanner"></div>
<div id="jobReminderBanner"></div>
<div id="quoteFollowUpBanner"></div>
<div id="jobAnniversaryBanner"></div>
<main id="main"></main>

<button class="fab" onclick="handleFabClick()" aria-label="Add">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<input type="file" id="importFile" accept="application/json">
<div class="toast" id="toast"></div>
<div class="print-area" id="printArea"></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'roundBookData_v1';
const APP_VERSION = 50;
function formatVersion(v){ return Math.floor(v/10) + '.' + (v%10); }
const DEFAULT_CLEAN_TEMPLATE = "Hi {name}, just a reminder I'll be round to clean your windows soon. Let me know if that's not convenient.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_PAY_TEMPLATE = "Hi {name}, a friendly reminder that your window cleaning payment of {amount} is outstanding.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_RECEIPT_TEMPLATE = "Hi {name}, thank you for your payment of {amount} received {date}.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_QUOTE_TEMPLATE = "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead.\n\nThanks,\n{yourname}\n{company}";
const DEFAULT_REPEAT_QUOTE_TEMPLATE = "Hi {name}, hope you're well! I cleaned your windows for you before and wondered if you'd like the same job done again? I'd quote {amount}, same as last time — just let me know and I'll get you booked back in.\n\nThanks,\n{yourname}\n{company}";
function migrateData(parsed){
  parsed.customers = parsed.customers || [];
  parsed.oneOffJobs = parsed.oneOffJobs || [];
  parsed.oneOffJobs.forEach(j=>{
    if(!j.photos) j.photos = [];
    if(j.remind24h == null) j.remind24h = false;
    if(j.customerId === undefined) j.customerId = null;
  });
  parsed.quotes = parsed.quotes || [];
  parsed.quotes.forEach(q=>{
    if(!q.status) q.status = 'pending';
    if(q.date === undefined) q.date = todayISO();
    if(q.followUpDays == null) q.followUpDays = 7;
  });
  parsed.settings = parsed.settings || {};
  // Auto-upgrade template wording that still matches an earlier built-in default (i.e. the user
  // never customised it) so improvements to the default wording reach existing installs too.
  // Anything that doesn't match a known-old default is a real customisation and is left alone.
  const OLD_CLEAN_TEMPLATES = ["Hi {name}, just a reminder I'll be round to clean your windows soon. Let me know if that's not convenient. Thanks!"];
  const OLD_PAY_TEMPLATES = ["Hi {name}, a friendly reminder that your window cleaning payment of {amount} is outstanding. Thanks!"];
  const OLD_RECEIPT_TEMPLATES = ["Hi {name}, thank you for your payment of {amount} received {date}. {company}"];
  const OLD_QUOTE_TEMPLATES = [
    "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead. {company}",
    "Hi {name}, thanks for asking about window cleaning. I'd quote {amount} for this job — let me know if you'd like to go ahead. Thanks, {yourname}"
  ];
  const OLD_REPEAT_QUOTE_TEMPLATES = ["Hi {name}, great to clean for you again. For regular cleans I'd quote {amount} — let me know if you'd like to set up a round. Thanks, {yourname}"];
  if(!parsed.settings.cleanTemplate || OLD_CLEAN_TEMPLATES.includes(parsed.settings.cleanTemplate)) parsed.settings.cleanTemplate = DEFAULT_CLEAN_TEMPLATE;
  if(!parsed.settings.payTemplate || OLD_PAY_TEMPLATES.includes(parsed.settings.payTemplate)) parsed.settings.payTemplate = DEFAULT_PAY_TEMPLATE;
  if(!parsed.settings.receiptTemplate || OLD_RECEIPT_TEMPLATES.includes(parsed.settings.receiptTemplate)) parsed.settings.receiptTemplate = DEFAULT_RECEIPT_TEMPLATE;
  if(!parsed.settings.quoteTemplate || OLD_QUOTE_TEMPLATES.includes(parsed.settings.quoteTemplate)) parsed.settings.quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
  if(!parsed.settings.repeatQuoteTemplate || OLD_REPEAT_QUOTE_TEMPLATES.includes(parsed.settings.repeatQuoteTemplate)) parsed.settings.repeatQuoteTemplate = DEFAULT_REPEAT_QUOTE_TEMPLATE;
  if(parsed.settings.companyName == null) parsed.settings.companyName = '';
  parsed.customers.forEach(c=>{
    if(c.frequencyWeeks == null){
      c.frequencyWeeks = c.frequencyDays ? Math.max(1, Math.round(c.frequencyDays/7)) : 4;
    }
    if(!c.priceHistory){
      c.priceHistory = c.price != null ? [{date: todayISO(), price: c.price}] : [];
    }

    if(!c.cleanHistory){

    } else if(c.cleanHistory.length && typeof c.cleanHistory[0] === 'string'){

    if(c.paymentReminderSentDate === undefined) c.paymentReminderSentDate = null;
  });
  return parsed;
}

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function daysBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function lastOf(arr){ if(!arr||!arr.length) return null; return [...arr].sort().slice(-1)[0]; }
function lastDateOf(arr){ if(!arr||!arr.length) return null; return [...arr.map(e=>e.date)].sort().slice(-1)[0]; }
function money(n){ const v=Number(n||0); return '£'+v.toFixed(v%1?2:0); }
let pendingToastAction = null;
function toast(msg, actionLabel, actionFn){
  const t=document.getElementById('toast');
  clearTimeout(toast._t);
  pendingToastAction = actionFn || null;
  if(actionLabel && actionFn){
    t.innerHTML = `${escapeHtml(msg)}<button class="toast-undo-btn" onclick="runToastAction()">${escapeHtml(actionLabel)}</button>`;
    t.classList.add('show');
    toast._t = setTimeout(()=>{ t.classList.remove('show'); pendingToastAction=null; }, 5000);
  } else {
    t.textContent = msg;
    t.classList.add('show');
    toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
  }
}
function runToastAction(){
  const fn = pendingToastAction;
  pendingToastAction = null;
  const t = document.getElementById('toast');
  clearTimeout(toast._t);
  t.classList.remove('show');
  if(fn) fn();
}

function freqDays(c){ return (c.frequencyWeeks || 4) * 7; }
function nextDueISO(c){
  const lastClean = lastDateOf(c.cleanHistory);
  if(!lastClean) return null;
  const d = new Date(lastClean+'T00:00:00');
  d.setDate(d.getDate() + freqDays(c));
  return d.toISOString().slice(0,10);
}
function custStatus(c){
  const lastClean = lastDateOf(c.cleanHistory);
  const lastPaid = lastOf((c.paymentHistory||[]).map(p=>p.date));
  const freq = freqDays(c);
  let cleanBadge = null;
  if(c.paused){
    cleanBadge = {type:'paused', text:'Paused'};
  } else if(lastClean){
    const due = daysBetween(lastClean, todayISO());
    if(due >= freq) cleanBadge = {type: due >= freq+7 ? 'overdue' : 'due', text: due >= freq+7 ? `${due}d overdue` : `Due (${due}d)`};
  } else {
    cleanBadge = {type:'due', text:'Never cleaned'};
  }
  const totalCharged = (c.cleanHistory||[]).reduce((s,e)=>s+Number(e.amount||0), 0);
  const totalPaid = (c.paymentHistory||[]).reduce((s,p)=>s+Number(p.amount||0), 0);
  const balance = Math.round((totalCharged - totalPaid) * 100) / 100;
  const owed = balance > 0.005;
  const credit = balance < -0.005;
  return {cleanBadge, owed, credit, balance, lastClean, lastPaid};
}

function moveInRound(id, direction){
  const rn = currentRound;
  const custs = sortByRoute(data.customers.filter(c=>(c.round||'Unassigned')===rn));
  const idx = custs.findIndex(c=>c.id===id);
  const swapIdx = direction==='up' ? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=custs.length) return;
  const tmp = custs[idx]; custs[idx] = custs[swapIdx]; custs[swapIdx] = tmp;

    return;
  }

  if(allInRound.length){
    const roundTotal = allInRound.reduce((sum,c)=>sum+Number(c.price||0),0);
    const roundAvg = roundTotal / allInRound.length;
    shellHtml += `<div class="summary-overall">
      <div class="stat"><div class="num">${allInRound.length}</div><div class="lbl">Customers</div></div>
      <div class="stat"><div class="num">${money(roundTotal)}</div><div class="lbl">Round value</div></div>
      <div class="stat"><div class="num">${money(roundAvg)}</div><div class="lbl">Avg / customer</div></div>
    </div>`;
  }

  shellHtml += `<div class="seg-row">
    <button class="seg-btn ${roundFilterMode==='all'?'active':''}" onclick="setRoundFilterMode('all')">All</button>
    <button class="seg-btn ${roundFilterMode==='due'?'active':''}" onclick="setRoundFilterMode('due')">📅 Due only</button>
    <button class="seg-btn ${roundFilterMode==='owed'?'active':''}" onclick="setRoundFilterMode('owed')">💷 Owed only</button>
  </div>`;
  shellHtml += `<div class="swipe-hint">👉 Swipe a card right to mark cleaned, left to mark paid</div>`;

  let baseList = allInRound;
  if(roundFilterMode === 'due'){
    baseList = allInRound.filter(c=>{
      const s = custStatus(c);
      return !c.paused && s.cleanBadge && (s.cleanBadge.type==='due' || s.cleanBadge.type==='overdue');
    });
  } else if(roundFilterMode === 'owed'){
    baseList = allInRound.filter(c=>custStatus(c).owed);
  }
  const custs = baseList;
  if(!custs.length){
    main.innerHTML = shellHtml + emptyState(roundFilterMode!=='all' ? 'filter' : 'customers');
    return;
  }
  shellHtml += custs.map(custCardHtml).join('');
  if(roundFilterMode === 'owed'){
    const owedTotal = custs.reduce((sum,c)=>sum+custStatus(c).balance,0);
    shellHtml += `<div style="text-align:right; font-weight:800; font-size:0.9375rem; color:var(--emphasis); padding:10px 4px 4px;">Total owed: ${money(owedTotal)}</div>`;
  }
  main.innerHTML = shellHtml;
}

}

function useCurrentLocation(){
  if(!navigator.geolocation){ toast('Location not available on this device'); return; }
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    const field = document.getElementById('f_address');
    if(!field) return;
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${latitude}&lon=${longitude}`);
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      const a = (json && json.address) || {};
      const road = [a.house_number, (a.road || a.pedestrian || a.footway || '')].filter(Boolean).join(' ');
      const town = a.town || a.city || a.village || a.suburb || a.hamlet || '';
      const postcode = a.postcode || '';
      const shortAddress = [road, town, postcode].filter(Boolean).join(', ');
      if(shortAddress){
        field.value = shortAddress;
        toast('Address filled from your location');
      } else if(json && json.display_name){
        field.value = json.display_name;
        toast('Address filled from your location');
      } else {
        throw new Error('no address found');
      }
    }catch(e){
      field.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      toast('Got your coordinates — no signal to look up the address');
    }
  }, ()=>{
    toast('Could not get your location — check location permission');
  }, {enableHighAccuracy:true, timeout:12000});
}

function saveCustomerForm(id){
  const name = document.getElementById('f_name').value.trim();
  const address = document.getElementById('f_address').value.trim();
  if(!name && !address){ toast('Please enter at least a name or an address'); return; }
  if(address){
    const normalized = address.toLowerCase();
    const dupe = data.customers.find(x=> x.id!==id && (x.address||'').trim().toLowerCase()===normalized);
    if(dupe){
      const proceed = confirm(`This address is already saved for ${dupe.name || 'another customer'} (${dupe.round||'Unassigned'} round). Add it again anyway?`);
      if(!proceed) return;
    }
  }
  const payload = {
    name,
    address,
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    round: document.getElementById('f_round').value.trim() || 'Unassigned',
    price: parseFloat(document.getElementById('f_price').value) || 0,
    frequencyWeeks: parseInt(document.getElementById('f_freq').value) || 4,
    notes: document.getElementById('f_notes').value.trim()
  };
  if(id){
    const c = data.customers.find(x=>x.id===id);
    const oldPrice = c.price;
    const oldRound = c.round || 'Unassigned';
    Object.assign(c, payload);
    if(oldPrice !== payload.price){
      c.priceHistory = c.priceHistory || [];
      c.priceHistory.push({date: todayISO(), price: payload.price});
    }
    if(oldRound !== (payload.round || 'Unassigned')){
      const roundCusts = data.customers.filter(x=>x.id!==id && (x.round||'Unassigned')===(payload.round||'Unassigned'));
      const maxOrder = roundCusts.reduce((m,x)=>Math.max(m, x.order!=null?x.order:-1), -1);
      c.order = maxOrder + 1;
    }
    toast('Customer updated');
  } else {
    const roundCusts = data.customers.filter(x=>(x.round||'Unassigned')===(payload.round||'Unassigned'));
    const maxOrder = roundCusts.reduce((m,x)=>Math.max(m, x.order!=null?x.order:-1), -1);
    data.customers.push(Object.assign({
      id: uid(), cleanHistory: [], paymentHistory: [],
      priceHistory: [{date: todayISO(), price: payload.price}],
      order: maxOrder + 1
    }, payload));
    toast('Customer added');
  }
  saveData(); closeSheet(); render();
}

function deleteCustomer(id){
  const idx = data.customers.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = data.customers[idx];
  data.customers.splice(idx,1);
  saveData(); closeSheet(); render();
  toast(`Deleted ${removed.address||removed.name||'customer'}`, 'Undo', ()=>{
    data.customers.splice(idx,0,removed);
    saveData(); render();
    toast('Customer restored');
  });
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoSelected(id, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  toast('Adding photo…');
  try{
    const dataUrl = await compressImage(file, 900, 0.7);
    const c = data.customers.find(x=>x.id===id);
    c.photos = c.photos || [];
    c.photos.push({id: uid(), dataUrl, date: todayISO()});
    if(saveData()){
      openCustomerDetail(id);
      render();
      toast('Photo added');
    }
  }catch(e){
    toast('Could not add that photo — try again');
  }
  inputEl.value = '';
}

async function sharePhoto(id, photoId){
  const c = data.customers.find(x=>x.id===id);
  const p = (c.photos||[]).find(x=>x.id===photoId);
  if(!p) return;
  try{
    const res = await fetch(p.dataUrl);
    const blob = await res.blob();
    const safeName = (c.address || c.name || 'photo').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const file = new File([blob], `${safeName}-${p.date}.jpg`, { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Round Book photo', text: c.address || c.name || '' });
    } else {
      toast('Sharing not supported here — press and hold the photo instead');
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast('Could not share that photo — press and hold it instead');
  }
}

    .replace(/\{company\}/g, tokens.company || '')

}

function renderJobs(main){
  let html = '';
  const today = todayISO();
  const jobs = (data.oneOffJobs || [])
    .slice()
    .sort((a,b)=>{
      if(!!a.done !== !!b.done) return a.done ? 1 : -1;
      if(!a.done) return (a.date||'').localeCompare(b.date||'');
      return (b.date||'').localeCompare(a.date||'');
    });
  if(!jobs.length){
    html += `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <b>No one-off jobs yet</b>
      <p>Tap the blue + button to add a gutter clean, one-time job, or anything outside your regular rounds — you can schedule it for any future date.</p>
    </div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="section-label">${jobs.length} one-off job${jobs.length===1?'':'s'}</div>`;
  html += `<div class="swipe-hint">👉 Swipe a card right to mark done, left to mark paid</div>`;
  html += jobs.map(j=>jobCardHtml(j, today)).join('');
  main.innerHTML = html;
}

function jobCardHtml(j, today){
  today = today || todayISO();
  const isFuture = !j.done && j.date && j.date > today;
  const statusBadge = j.done
    ? `<span class="badge ok">Done</span>`
    : isFuture
      ? `<span class="badge due">Scheduled</span>`
      : `<span class="badge overdue">Not done</span>`;
  const anniv = jobAnniversaryInfo(j, today);
  return `<div class="swipe-wrap">
    <div class="swipe-bg swipe-bg-left">✓ Done</div>
    <div class="swipe-bg swipe-bg-right">💷 Paid</div>
    <div class="cust-card" data-id="${j.id}" data-kind="job">
      <div class="cust-top" onclick="openJobForm(data.oneOffJobs.find(x=>x.id==='${j.id}'))">
        <div>
          <div class="cust-addr" style="font-size:1rem; font-weight:800; color:var(--ink);">${escapeHtml(j.address||'No address')}</div>
          ${(j.name||j.phone) ? `<div class="cust-name" style="font-size:0.8125rem; font-weight:600; color:var(--ink-muted); margin-top:2px;">${[escapeHtml(j.name||''), j.phone?escapeHtml(j.phone):''].filter(Boolean).join(' · ')}</div>` : ''}
          <div style="font-size:0.75rem; color:var(--ink-muted); margin-top:2px;">${fmtDate(j.date)}${j.remind24h?' · 🔔 Reminder set':''}</div>
        </div>
        <div class="cust-price">${money(j.price)}</div>
      </div>
      <div class="cust-meta">
        ${statusBadge}
        <span class="badge ${j.paid?'ok':'owed'}">${j.paid?'Paid':'Unpaid'}</span>
        ${(j.photos && j.photos.length) ? `<span class="badge paused">📷 ${j.photos.length}</span>` : ''}
        ${anniv ? `<span class="badge anniversary">🎉 ${anniv}-year anniversary</span>` : ''}
      </div>
    </div>
  </div>`;
}
function jobAnniversaryInfo(j, today){
  today = today || todayISO();
  if(!j.done || !j.date) return null;
  const daysSince = daysBetween(j.date, today);
  if(daysSince < 365) return null;
  // Calculate which year anniversary this is (1st = 365+, 2nd = 730+, 3rd = 1095+, etc.)
  const anniversaryYear = Math.floor(daysSince / 365);
  return anniversaryYear;
}

async function handleJobPhotoSelected(id, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  toast('Adding photo…');
  try{
    const dataUrl = await compressImage(file, 900, 0.7);
    const j = data.oneOffJobs.find(x=>x.id===id);
    j.photos = j.photos || [];
    j.photos.push({id: uid(), dataUrl, date: todayISO()});
    if(saveData()){
      openJobForm(j);
      toast('Photo added');
    }
  }catch(e){
    toast('Could not add that photo — try again');
  }
  inputEl.value = '';
}

async function shareJobPhoto(id, photoId){
  const j = data.oneOffJobs.find(x=>x.id===id);
  const p = (j.photos||[]).find(x=>x.id===photoId);
  if(!p) return;
  try{
    const res = await fetch(p.dataUrl);
    const blob = await res.blob();
    const safeName = (j.address || j.name || 'photo').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const file = new File([blob], `${safeName}-${p.date}.jpg`, { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Round Book photo', text: j.address || j.name || '' });
    } else {
      toast('Sharing not supported here — press and hold the photo instead');
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast('Could not share that photo — press and hold it instead');
  }
}

function deleteJobPhoto(id, photoId){
  const j = data.oneOffJobs.find(x=>x.id===id);
  j.photos = (j.photos||[]).filter(p=>p.id!==photoId);
  saveData();
  openJobForm(j);
}

function saveJobForm(id){
  const address = document.getElementById('j_address').value.trim();
  const name = document.getElementById('j_name').value.trim();
  if(!address && !name){ toast('Please enter at least an address or a name'); return; }
  const customerIdField = document.getElementById('j_customerId');
  const fromQuoteField = document.getElementById('j_fromQuoteId');
  const payload = {
    address, name,
    phone: document.getElementById('j_phone').value.trim(),

    price: parseFloat(document.getElementById('j_price').value) || 0,

    remind24h: document.getElementById('j_remind').checked,

/* ---------- quotes ---------- */
function renderQuotes(main){
  let html = '';
  const todayForSort = todayISO();
  const quotes = (data.quotes || [])
    .slice()
    .sort((a,b)=>{
      const rank = q => q.status!=='pending' ? 2 : (quoteNeedsFollowUp(q, todayForSort) ? 0 : 1);
      const ra = rank(a), rb = rank(b);
      if(ra !== rb) return ra - rb;
      if(ra <= 1) return (a.date||'').localeCompare(b.date||'');
      return (b.date||'').localeCompare(a.date||'');
    });
  if(!quotes.length){
    html += `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <b>No quotes yet</b>
      <p>Tap the blue + button to note down a quote — you can turn it into a customer or a one-off job later.</p>
    </div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="section-label">${quotes.length} quote${quotes.length===1?'':'s'}</div>`;
  html += `<div class="swipe-hint">👉 Swipe a card right to accept, left to decline</div>`;
  html += quotes.map(quoteCardHtml).join('');
  main.innerHTML = html;
}

function quoteStatusBadge(q){
  if(q.status === 'accepted') return `<span class="badge ok">Accepted</span>`;
  if(q.status === 'declined') return `<span class="badge overdue">Declined</span>`;
  if(q.status === 'converted') return `<span class="badge ok">✅ Converted</span>`;
  return `<span class="badge due">Pending</span>`;
}

  const today = todayISO();

  return `<div class="swipe-wrap">

    <div class="cust-card" data-id="${q.id}" data-kind="quote">

const THEMES = {
  ocean: {name:'Ocean',  navy:'#10344C', blue:'#2F9BDE'},
  slate: {name:'Slate',  navy:'#333F4D', blue:'#8A99AC'},
  teal:  {name:'Teal',   navy:'#0F3D3E', blue:'#2FB6A6'},
  plum:  {name:'Plum',   navy:'#3A2359', blue:'#9B6BE0'},
  rust:  {name:'Rust',   navy:'#4A2A1B', blue:'#E08A4C'},
  berry: {name:'Berry',  navy:'#4A1942', blue:'#E0568C'}
};
let themeName = localStorage.getItem('roundBookTheme') || 'ocean';

// Small colour-mixing helpers so every tinted surface in the app (not just
// the header) can be derived from the two colours a scheme actually defines.
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function mixHex(hexA, hexB, weight){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const mixed = a.map((v,i)=> v + (b[i]-v)*weight);
  return '#' + mixed.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}

function applyDarkMode(){
  document.body.classList.toggle('dark', darkMode);
  applyTheme();
}
function setDarkMode(v){
  darkMode = v;
  localStorage.setItem('roundBookDark', v?'1':'0');
  applyDarkMode();
  openSettings();
}
function applyTextSize(){
  document.documentElement.style.fontSize = textSize + 'px';
}
function previewTextSize(v){
  const n = Math.max(15, Math.min(24, parseInt(v,10) || 18));
  document.documentElement.style.fontSize = n + 'px';
  const label = document.getElementById('textSizeLabel');
  if(label) label.textContent = n + 'px';
}
function setTextSize(v){
  const n = Math.max(15, Math.min(24, parseInt(v,10) || 18));
  textSize = n;
  localStorage.setItem('roundBookTextSize', String(n));
  applyTextSize();
  openSettings();
}
function applyTheme(){
  const t = THEMES[themeName] || THEMES.ocean;
  const root = document.documentElement.style;
  root.setProperty('--navy', t.navy);
  root.setProperty('--blue', t.blue);
  // A darker shade of the scheme's navy, used for toasts and other high-emphasis chrome.
  root.setProperty('--navy-dark', mixHex(t.navy, '#000000', 0.28));
  // A deepened version of the accent colour, used as readable text on the pale "dim" chips/buttons below.
  root.setProperty('--blue-deep', mixHex(t.blue, '#000000', 0.32));
  // The pale tinted background used for chips, quick-action buttons, and banners — mixed
  // toward white in light mode and toward the dark surface colour in dark mode, so every
  // scheme gets its own badge colour instead of everything defaulting to ocean-blue.
  root.setProperty('--blue-dim', darkMode ? mixHex(t.blue, '#0E1620', 0.82) : mixHex(t.blue, '#FFFFFF', 0.86));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.navy);
}
function setTheme(name){
  if(!THEMES[name]) return;
  themeName = name;
  localStorage.setItem('roundBookTheme', name);
  applyTheme();
  openSettings();
}

function htmlToDocxElements(bodyHtml){
  const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, HeadingLevel, ImageRun, TableLayoutType, AlignmentType, BorderStyle } = docx;
  const parsed = new DOMParser().parseFromString(`<div>${bodyHtml}</div>`, 'text/html');
  const root = parsed.body.firstElementChild;
  const elements = [];
  const PAGE_WIDTH_DXA = 9026; // usable width for an A4 page with 1440-twip margins (must match the Document's page setup below)

  // Recursively pulls text out of a cell, inserting a separator wherever the
  // source HTML has a line break (e.g. "<td>123 Main St<br>John Smith</td>")
  // or a boundary between child elements/text nodes, so values don't get
  // smashed together the way plain textContent would.
  const textOf = (node) => {
    const parts = [];
    node.childNodes.forEach(child=>{
      if(child.nodeType === 3){
        const t = child.textContent;
        if(t && t.trim()) parts.push(t.trim());
      } else if(child.nodeType === 1){
        if(child.tagName === 'BR'){ parts.push('·'); return; }
        const t = textOf(child);
        if(t) parts.push(t);
      }
    });
    return parts.join(' ').replace(/\s+/g,' ').trim();
  };

  const cellBorder = { style: BorderStyle.SINGLE, size: 4, color: 'D5DBDF' };
  const tableBorders = {
    top: cellBorder, bottom: cellBorder, left: cellBorder, right: cellBorder,
    insideHorizontal: cellBorder, insideVertical: cellBorder
  };
  const cellMargins = { top: 60, bottom: 60, left: 100, right: 100 };

  Array.from(root.children).forEach(node=>{
    const tag = node.tagName;
    const imgs = node.querySelectorAll ? node.querySelectorAll('img') : [];
    if(tag === 'TABLE'){
      const trs = Array.from(node.querySelectorAll('tr'));
      let numCols = 0;
      trs.forEach(tr => {
        let span = 0;
        Array.from(tr.children).forEach(td => { span += Math.max(1, parseInt(td.getAttribute('colspan')||'1',10)); });
        numCols = Math.max(numCols, span);
      });

      if(numCols > 0){
        const baseWidth = Math.floor(PAGE_WIDTH_DXA / numCols);
        const columnWidths = Array(numCols).fill(baseWidth);
        columnWidths[numCols-1] += PAGE_WIDTH_DXA - (baseWidth * numCols); // give rounding remainder to the last column
        const rows = [];
        trs.forEach(tr=>{
          const cellNodes = Array.from(tr.children);
          if(!cellNodes.length) return;
          const isHeaderRow = cellNodes.some(td => td.tagName === 'TH');
          let colIndex = 0;
          const cells = cellNodes.map(td=>{
            const span = Math.max(1, parseInt(td.getAttribute('colspan')||'1',10));
            const widthDxa = columnWidths.slice(colIndex, colIndex+span).reduce((a,b)=>a+b,0);
            colIndex += span;
            const styleAttr = td.getAttribute('style') || '';
            const alignRight = /text-align\s*:\s*right/i.test(styleAttr);
            const isBold = td.tagName==='TH' || /font-weight\s*:\s*(bold|[7-9]00)/i.test(styleAttr);
            const cellConfig = {
              children: [new Paragraph({
                alignment: alignRight ? AlignmentType.RIGHT : undefined,
                children: [new TextRun({ text: textOf(td), bold: isBold })]
              })],
              width: { size: widthDxa, type: WidthType.DXA },
              margins: cellMargins
            };
            if(span > 1) cellConfig.columnSpan = span;
            if(isHeaderRow) cellConfig.shading = { fill: 'EFF3F5' };
            return new TableCell(cellConfig);
          });
          rows.push(new TableRow({ children: cells, cantSplit: true }));
        });
        if(rows.length){
          const tableConfig = {
            rows,
            columnWidths,
            width: { size: PAGE_WIDTH_DXA, type: WidthType.DXA },
            borders: tableBorders
          };
          if(TableLayoutType && TableLayoutType.FIXED){ tableConfig.layout = TableLayoutType.FIXED; }
          elements.push(new Table(tableConfig));
          elements.push(new Paragraph({ text: '' }));
        }
      }
    } else if(imgs.length){
      imgs.forEach(img=>{
        const src = img.getAttribute('src') || '';
        if(!src.startsWith('data:image')) return;
        try{
          const base64 = src.split(',')[1];
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
          elements.push(new Paragraph({ children: [ new ImageRun({ data: bytes, transformation: { width: 160, height: 160 } }) ] }));
        }catch(e){ /* skip a photo that fails to embed rather than aborting the whole export */ }
      });
    } else if(tag === 'DIV' && node.classList.contains('rpt-round-title')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ text: t, heading: HeadingLevel.HEADING_2, spacing:{ before:200, after:100 } }));
    } else if(tag === 'DIV' && node.classList.contains('rpt-total')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t, bold:true })], spacing:{ before:100, after:200 } }));
    } else if(tag === 'DIV' && node.classList.contains('rpt-empty-note')){
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t, italics:true })] }));
    } else {
      const t = textOf(node);
      if(t) elements.push(new Paragraph({ children:[new TextRun({ text: t })], spacing:{ after:120 } }));
    }
  });
  return elements;
}

async function exportPendingReportDocx(){
  if(typeof docx === 'undefined'){
    toast('Still loading — try again in a moment, or once you have signal');
    return;
  }
  try{
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
    const plainTitle = pendingReportTitle.replace(/<[^>]+>/g,'');
    const company = data.settings.companyName || '';

    const headerChildren = [ new Paragraph({ text: plainTitle, heading: HeadingLevel.HEADING_1 }) ];
    if(company) headerChildren.push(new Paragraph({ children:[new TextRun({ text: company, italics:true })] }));
    headerChildren.push(new Paragraph({ children:[new TextRun({ text: reportDate(), color:'666666' })], spacing:{ after:300 } }));

    const bodyChildren = htmlToDocxElements(pendingReportBody);

    const wordDoc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 }, // A4, in twips (DXA)
            margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 }
          }
        },
        children: [...headerChildren, ...bodyChildren]
      }]
    });

    const blob = await Packer.toBlob(wordDoc);
    const filename = `${plainTitle.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${todayISO()}.docx`;

    if(navigator.canShare){
      try{
        const file = new File([blob], filename, { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        if(navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title: plainTitle });
          closeSheet();
          toast('Word document shared');
          return;
        }
      }catch(e){
        if(e && e.name === 'AbortError'){ closeSheet(); return; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    closeSheet();
    toast('Word document saved');
  }catch(e){
    toast('Could not create the Word document — try Print instead');
  }
}

function printRoundsLastCleaned(){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  if(!roundNames.length){
    runPrint('Round Cleaning Dates', '<div class="rpt-empty-note">No rounds yet.</div>');
    return;
  }
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const cutoffISO = cutoff.toISOString().slice(0,10);

  const rows = roundNames.map(rn=>{
    const custs = rounds[rn];
    const dateSet = new Set();
    let latestOverall = null;
    custs.forEach(c=>{
      (c.cleanHistory||[]).forEach(e=>{
        if(!e.date) return;
        if(e.date >= cutoffISO) dateSet.add(e.date);
        if(!latestOverall || e.date > latestOverall) latestOverall = e.date;
      });
    });
    const sortedDates = Array.from(dateSet).sort().reverse();
    const datesCell = sortedDates.length
      ? sortedDates.map(d=>fmtDate(d)).join(', ')
      : `<span style="color:#66798A;">None in the last 30 days${latestOverall ? ' · last cleaned ' + fmtDate(latestOverall) : ' · never cleaned'}</span>`;
    return `<tr>
      <td>${escapeHtml(rn)}</td>
      <td>${datesCell}</td>
      <td>${custs.length} customer${custs.length===1?'':'s'}</td>
    </tr>`;
  }).join('');
  const body = `<table class="rpt-table"><thead><tr><th>Round</th><th>Dates cleaned (last 30 days)</th><th>Customers</th></tr></thead><tbody>${rows}</tbody></table>`;
  runPrint('Round Cleaning Dates', body);
}

function printRoundsLastCleanedCalendar(){
  if(!data.customers.length){
    runPrint('Round Cleaning Dates — Calendar', '<div class="rpt-empty-note">No rounds yet.</div>');
    return;
  }
  const today = new Date();
  today.setHours(0,0,0,0);
  const rangeStart = new Date(today);
  rangeStart.setDate(rangeStart.getDate() - 29);

  const dow = today.getDay();
  const diffToMonday = (dow === 0) ? 6 : dow - 1;
  const gridStart = new Date(today);
  gridStart.setDate(gridStart.getDate() - diffToMonday - 28);

  const cleanedByDate = {};
  data.customers.forEach(c=>{
    (c.cleanHistory||[]).forEach(e=>{
      if(!e.date) return;
      if(!cleanedByDate[e.date]) cleanedByDate[e.date] = new Set();
      cleanedByDate[e.date].add(c.round || 'Unassigned');
    });
  });

  const totalWeeks = Math.ceil((Math.round((today - gridStart) / 86400000) + 1) / 7);
  let bodyRows = '';
  for(let w=0; w<totalWeeks; w++){
    bodyRows += '<tr>';
    for(let d=0; d<7; d++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w*7 + d);
      const iso = cellDate.toISOString().slice(0,10);
      const outside = cellDate < rangeStart || cellDate > today;
      const roundsCleaned = cleanedByDate[iso] ? Array.from(cleanedByDate[iso]).sort((a,b)=>a.localeCompare(b)) : [];
      const dayNum = cellDate.getDate();
      const monthLabel = (dayNum === 1) ? cellDate.toLocaleDateString('en-GB',{month:'short'}) + ' ' : '';
      bodyRows += `<td class="${outside?'outside':''}">
        <div class="daynum">${monthLabel}${dayNum}</div>
        ${roundsCleaned.map(rn=>`<span class="round-chip" style="background:#E2F5EA; color:#1F7A46;">${escapeHtml(rn)}</span>`).join('')}
      </td>`;
    }
    bodyRows += '</tr>';
  }

  const body = `
    <table class="rpt-calendar">
      <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Shows any round with a customer cleaned on that day. Greyed-out days fall outside the last 30 days.</p>
  `;
  runPrint('Round Cleaning Dates — Calendar', body);
}

function printWindowsDue(){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  let body = '';
  let anyRoundShown = false;
  roundNames.forEach((rn)=>{
    const custs = rounds[rn].filter(c=>{
      const s = custStatus(c);
      return !c.paused && s.cleanBadge && (s.cleanBadge.type==='due' || s.cleanBadge.type==='overdue');
    }).sort((a,b)=>{
      const sa=custStatus(a), sb=custStatus(b);
      const rank = x => x.cleanBadge.type==='overdue' ? 0 : 1;
      return rank(sa)-rank(sb);
    });
    if(!custs.length) return;
    body += `<div class="rpt-round-title${anyRoundShown?' rpt-page-break':''}">${escapeHtml(rn)}</div>`;
    anyRoundShown = true;
    const rows = custs.map(c=>{
      const s = custStatus(c);
      const flagClass = s.cleanBadge.type;
      const flagText = s.cleanBadge.type==='overdue' ? 'Overdue' : 'Due';
      return `<tr>
        <td>${escapeHtml(c.address||'')}${c.name?`<br><span style="color:#66798A">${escapeHtml(c.name)}</span>`:''}</td>
        <td>${fmtDate(s.lastClean)}</td>
        <td>${fmtDate(nextDueISO(c))}</td>
        <td class="rpt-flag ${flagClass}">${flagText}</td>
      </tr>`;
    }).join('');
    body += `<table class="rpt-table"><thead><tr><th>Customer</th><th>Last cleaned</th><th>Next due</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  });
  if(!anyRoundShown) body = '<div class="rpt-empty-note">Nobody\'s due or overdue a clean right now.</div>';
  runPrint('Windows Due, by Round', body);
}

function printMoneyOwed(){
  const owedCusts = data.customers.filter(c=>custStatus(c).owed);
  const rounds = groupByRound(owedCusts);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  let total = 0;
  let rows = '';
  roundNames.forEach(rn=>{
    const custs = rounds[rn].slice().sort((a,b)=>custStatus(b).balance-custStatus(a).balance);
    custs.forEach(c=>{
      const s = custStatus(c);
      total += s.balance;
      rows += `<tr>
        <td style="font-weight:700;">${escapeHtml(rn)}</td>
        <td>${escapeHtml(c.address||'')}${(c.name||c.phone)?`<br><span style="color:#66798A">${[escapeHtml(c.name||''), c.phone?escapeHtml(c.phone):''].filter(Boolean).join(' · ')}</span>`:''}</td>
        <td>${fmtDate(s.lastPaid)}</td>
        <td class="rpt-flag overdue" style="text-align:right;">${money(s.balance)}</td>
      </tr>`;
    });
  });
  let body;
  if(!rows){
    body = '<div class="rpt-empty-note">Nobody currently owes money — everyone is paid up.</div>';
  } else {
    body = `<table class="rpt-table"><thead><tr><th>Round</th><th>Customer</th><th>Last paid</th><th style="text-align:right;">Owed</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rpt-total" style="border-top:2px solid #10344C; padding-top:10px; margin-top:12px; font-size:16px;">Total outstanding: ${money(total)}</div>`;
  }
  runPrint('Money Owed', body);
}

function printFullRounds(){
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  let body = '';
  let grandTotal = 0;
  let grandCount = 0;
  roundNames.forEach((rn, idx)=>{
    body += `<div class="rpt-round-title${idx>0?' rpt-page-break':''}">${escapeHtml(rn)}</div>`;
    const custs = sortByRoute(rounds[rn]);
    let roundTotal = 0;
    const rows = custs.map(c=>{
      roundTotal += Number(c.price||0);
      return `<tr>
        <td>${escapeHtml(c.address||'')}${c.name?`<br><span style="color:#66798A">${escapeHtml(c.name)}</span>`:''}</td>
        <td>${escapeHtml(c.phone||'')}${c.phone&&c.email?'<br>':''}${escapeHtml(c.email||'')}</td>
        <td>${money(c.price)}</td>
        <td>Every ${c.frequencyWeeks||4}wk</td>
      </tr>`;
    }).join('');
    grandTotal += roundTotal;
    grandCount += custs.length;
    const roundAvg = custs.length ? roundTotal/custs.length : 0;
    body += `<table class="rpt-table"><thead><tr><th>Customer</th><th>Contact</th><th>Price</th><th>Frequency</th></tr></thead><tbody>${rows}</tbody></table>`;
    body += `<div class="rpt-total">${custs.length} customer${custs.length===1?'':'s'} · Round total: ${money(roundTotal)} · Avg: ${money(roundAvg)}</div>`;

  if(!roundNames.length){

    body += `<div class="rpt-total" style="border-top:2px solid #10344C; padding-top:10px; margin-top:16px; font-size:16px;">Grand total (all rounds): ${grandCount} customers · ${money(grandTotal)} · Avg: ${money(grandAvg)}</div>`;
  }

}

function getLastPriceIncreaseDate(c){
  const hist = (c.priceHistory||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!hist.length) return null;
  let lastIncrease = hist[0].date;
  for(let i=1; i<hist.length; i++){
    if(hist[i].price > hist[i-1].price) lastIncrease = hist[i].date;
  }
  return lastIncrease;
}

function printPriceReview(){
  const flagged = [];
  data.customers.forEach(c=>{
    const lastIncrease = getLastPriceIncreaseDate(c);
    if(!lastIncrease) return;
    const target = nextDueISO(c) || todayISO();
    const days = daysBetween(lastIncrease, target);
    if(days >= 365){
      flagged.push({ c, lastIncrease, target, days });
    }
  });
  flagged.sort((a,b)=> b.days - a.days);

  if(!flagged.length){
    runPrint('Price Review Due', '<div class="rpt-empty-note">Nobody is due a price review right now.</div>');
    return;
  }

  const rows = flagged.map(({c, lastIncrease, target})=>`<tr>
    <td>${escapeHtml(c.address||'')}${c.name?`<br><span style="color:#66798A">${escapeHtml(c.name)}</span>`:''}</td>
    <td>${escapeHtml(c.round||'Unassigned')}</td>
    <td style="text-align:right;">${money(c.price)}</td>
    <td>${fmtDate(lastIncrease)}</td>
    <td>${fmtDate(target)}</td>
  </tr>`).join('');
  const body = `
    <table class="rpt-table"><thead><tr><th>Customer</th><th>Round</th><th style="text-align:right;">Current price</th><th>Last increase</th><th>Next clean</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Shows customers where it will have been 12 months or more since their last price increase by their next scheduled clean. Customers with no price history are not included.</p>
  `;
  runPrint('Price Review Due', body);
}

function printEarnings(){
  const payments = [];
  data.customers.forEach(c=>{
    (c.paymentHistory||[]).forEach(p=>{
      payments.push({date: p.date, amount: Number(p.amount||0)});
    });
  });
  (data.oneOffJobs||[]).forEach(j=>{
    if(j.paid){
      payments.push({date: j.paidDate || j.date, amount: Number(j.price||0)});
    }
  });

  if(!payments.length){
    runPrint('Earnings Report', '<div class="rpt-empty-note">No payments recorded yet.</div>');
    return;
  }

  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
  const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth()-1);
  const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear()-1);
  const sumSince = (from) => payments.filter(p=>new Date(p.date+'T00:00:00') >= from).reduce((s,p)=>s+p.amount,0);
  const allTime = payments.reduce((s,p)=>s+p.amount,0);

  const byMonth = {};
  payments.forEach(p=>{
    const key = (p.date||'').slice(0,7);
    if(!key) return;
    byMonth[key] = (byMonth[key]||0) + p.amount;
  });
  const monthKeys = Object.keys(byMonth).sort().reverse().slice(0,12);

  const body = `
    <table class="rpt-table" style="margin-bottom:20px;">
      <tbody>
        <tr><td>Last 7 days</td><td style="text-align:right; font-weight:800;">${money(sumSince(weekAgo))}</td></tr>
        <tr><td>Last 30 days</td><td style="text-align:right; font-weight:800;">${money(sumSince(monthAgo))}</td></tr>
        <tr><td>Last 12 months</td><td style="text-align:right; font-weight:800;">${money(sumSince(yearAgo))}</td></tr>
        <tr><td>All time</td><td style="text-align:right; font-weight:800;">${money(allTime)}</td></tr>
      </tbody>
    </table>
    <div class="rpt-round-title" style="margin-top:0;">By month</div>
    <table class="rpt-table">
      <thead><tr><th>Month</th><th style="text-align:right;">Total</th></tr></thead>
      <tbody>
        ${monthKeys.map(k=>{
          const d = new Date(k+'-01T00:00:00');
          const label = d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
          return `<tr><td>${label}</td><td style="text-align:right;">${money(byMonth[k])}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  runPrint('Earnings Report', body);
}

function printDailyWork(){
  const dailyTotals = {};
  function addToDay(dateISO, amount){
    if(!dateISO) return;
    if(!dailyTotals[dateISO]) dailyTotals[dateISO] = { total: 0, count: 0 };
    dailyTotals[dateISO].total += Number(amount || 0);
    dailyTotals[dateISO].count += 1;
  }

  data.customers.forEach(c=>{
    (c.cleanHistory||[]).forEach(e=> addToDay(e.date, e.amount));
  });
  (data.oneOffJobs||[]).forEach(j=>{
    if(j.done) addToDay(j.date, j.price);
  });

  const today = new Date();
  const rows = [];
  let grandTotal = 0;
  let grandCount = 0;
  for(let i=29; i>=0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0,10);
    const info = dailyTotals[iso] || { total: 0, count: 0 };
    grandTotal += info.total;
    grandCount += info.count;
    rows.push(`<tr>
      <td>${fmtDate(iso)}</td>
      <td>${info.count || ''}</td>
      <td style="text-align:right; ${info.total ? 'font-weight:700;' : 'color:#66798A;'}">${info.total ? money(info.total) : '—'}</td>
    </tr>`);
  }

  const body = `
    <table class="rpt-table">
      <thead><tr><th>Date</th><th>Cleans / jobs</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div class="rpt-total" style="border-top:2px solid #10344C; padding-top:10px; margin-top:16px; font-size:16px;">
      30-day total: ${money(grandTotal)} across ${grandCount} clean${grandCount===1?'':'s'}/job${grandCount===1?'':'s'}
    </div>
  `;
  runPrint('Daily Work Done — Last 30 Days', body);
}

function printSchedule(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const rangeEnd = new Date(today);
  rangeEnd.setDate(rangeEnd.getDate() + 30);

  // Find the Monday on/before today so the calendar always shows full weeks
  const dow = today.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow === 0) ? 6 : dow - 1;
  const gridStart = new Date(today);
  gridStart.setDate(gridStart.getDate() - diffToMonday);

  // Which rounds have a customer next due on each date, within the next 30 days
  const dueByDate = {};
  data.customers.forEach(c=>{
    if(c.paused) return;
    const next = nextDueISO(c);
    if(!next) return;
    if(!dueByDate[next]) dueByDate[next] = new Set();
    dueByDate[next].add(c.round || 'Unassigned');
  });

  let bodyRows = '';
  for(let w=0; w<5; w++){
    bodyRows += '<tr>';
    for(let d=0; d<7; d++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w*7 + d);
      const iso = cellDate.toISOString().slice(0,10);
      const outside = cellDate < today || cellDate > rangeEnd;
      const roundsDue = dueByDate[iso] ? Array.from(dueByDate[iso]).sort((a,b)=>a.localeCompare(b)) : [];
      const dayNum = cellDate.getDate();
      const monthLabel = (dayNum === 1) ? cellDate.toLocaleDateString('en-GB',{month:'short'}) + ' ' : '';
      bodyRows += `<td class="${outside?'outside':''}">
        <div class="daynum">${monthLabel}${dayNum}</div>
        ${roundsDue.map(rn=>`<span class="round-chip">${escapeHtml(rn)}</span>`).join('')}
      </td>`;
    }
    bodyRows += '</tr>';
  }

  const body = `
    <table class="rpt-calendar">
      <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <p style="font-size:11px; color:#66798A; margin-top:12px;">Shows any round with a customer due for cleaning on that day, based on their last clean date and frequency. Greyed-out days fall outside the next 30 days. Customers not yet cleaned at all aren't included, since there's no date to schedule from.</p>
  `;
  runPrint('Monthly Schedule', body);
}

    <p style="color:${days>=BACKUP_REMINDER_DAYS?'var(--amber)':'var(--ink-muted)'}; font-size:0.7812rem; font-weight:700; margin:0 2px 16px;">${lastText}</p>

async function exportData(){
  const jsonStr = JSON.stringify(data, null, 2);
  const filename = `round-book-backup-${todayISO()}.json`;

  const markBackedUp = ()=>{
    localStorage.setItem('roundBookLastBackup', todayISO());
    bannerDismissed = false;
    renderBackupBanner();
  };

  if(navigator.canShare){
    try{
      const file = new File([jsonStr], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Round Book Backup'});
        markBackedUp();
        toast('Backup shared');
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      // fall through to classic download on any other failure
    }
  }

  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  markBackedUp();
  toast('Backup saved');
}
document.getElementById('importFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.customers || !Array.isArray(parsed.customers)) throw new Error('bad format');
      if(confirm(`Import ${parsed.customers.length} customers? This will replace all data currently on this phone.`)){
        data = migrateData(parsed);
        saveData();
        closeSheet();
        render();
        toast('Backup restored');
      }
    }catch(err){
      alert('That file could not be read as a Round Book backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

async function exportExcel(){
  if(typeof XLSX === 'undefined'){
    toast('Still loading — try again in a moment, or once you have signal');
    return;
  }
  const rounds = groupByRound(data.customers);
  const roundNames = Object.keys(rounds).sort((a,b)=>a.localeCompare(b));
  if(!roundNames.length){ toast('No customers to export yet'); return; }

  const wb = XLSX.utils.book_new();
  const usedNames = {};
  function safeSheetName(name){
    let base = (name||'Round').replace(/[\\\/:\*\?\[\]]/g,'').trim().slice(0,31) || 'Round';
    let final = base, i = 2;
    while(usedNames[final]){
      const suffix = ` (${i})`;
      final = base.slice(0, 31-suffix.length) + suffix;
      i++;
    }
    usedNames[final] = true;
    return final;
  }

  const summaryRows = roundNames.map(rn=>{
    const custs = rounds[rn];
    const total = custs.reduce((sum,c)=>sum+Number(c.price||0),0);
    const avg = custs.length ? total/custs.length : 0;
    return {
      'Round': rn,
      'Customers': custs.length,
      'Round Value': total,
      'Average / Customer': Math.round(avg * 100) / 100
    };
  });
  const overallCustomers = data.customers.length;
  const overallValue = data.customers.reduce((sum,c)=>sum+Number(c.price||0),0);
  summaryRows.push({
    'Round': 'TOTAL (all rounds)',
    'Customers': overallCustomers,
    'Round Value': overallValue,
    'Average / Customer': overallCustomers ? Math.round((overallValue/overallCustomers)*100)/100 : 0
  });
  const summaryWs = XLSX.utils.json_to_sheet(summaryRows);
  summaryWs['!cols'] = [{wch:22},{wch:12},{wch:14},{wch:18}];
  XLSX.utils.book_append_sheet(wb, summaryWs, safeSheetName('Summary'));

  roundNames.forEach(rn=>{
    const custs = sortByRoute(rounds[rn]);
    const rows = custs.map(c=>{
      const s = custStatus(c);
      return {
        'Address': c.address || '',
        'Name': c.name || '',
        'Phone': c.phone || '',
        'Email': c.email || '',
        'Price': Number(c.price || 0),
        'Frequency (weeks)': c.frequencyWeeks || 4,
        'Last Cleaned': s.lastClean ? fmtDate(s.lastClean) : '',
        'Next Due': (()=>{ const d=nextDueISO(c); return d ? fmtDate(d) : ''; })(),
        'Last Paid': s.lastPaid ? fmtDate(s.lastPaid) : '',
        'Amount Owed': s.owed ? s.balance : 0,
        'Notes': c.notes || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:18},{wch:14},{wch:22},{wch:8},{wch:14},{wch:12},{wch:12},{wch:12},{wch:12},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(rn));
  });

  if((data.oneOffJobs||[]).length){
    const jobRows = data.oneOffJobs.map(j=>({
      'Date': j.date ? fmtDate(j.date) : '',
      'Address': j.address || '',
      'Name': j.name || '',
      'Phone': j.phone || '',
      'Price': Number(j.price || 0),
      'Done': j.done ? 'Yes' : 'No',
      'Paid': j.paid ? 'Yes' : 'No',
      'Notes': j.notes || ''
    }));
    const jobsWs = XLSX.utils.json_to_sheet(jobRows);
    jobsWs['!cols'] = [{wch:12},{wch:26},{wch:18},{wch:14},{wch:8},{wch:8},{wch:8},{wch:24}];
    XLSX.utils.book_append_sheet(wb, jobsWs, safeSheetName('One-off Jobs'));
  }

  const filename = `round-book-${todayISO()}.xlsx`;

  if(navigator.canShare){
    try{
      const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      const file = new File([wbout], filename, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Round Book Export'});
        toast('Excel file shared');
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      // fall through to classic download on any other failure
    }
  }

  XLSX.writeFile(wb, filename);
  toast('Excel file saved');
}

/* ---------- util ---------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- swipe actions ---------- */
let swipeState = null;
function initSwipeHandlers(){
  const main = document.getElementById('main');
  main.addEventListener('touchstart', onSwipeStart, {passive:true});
  main.addEventListener('touchmove', onSwipeMove, {passive:false});
  main.addEventListener('touchend', onSwipeEnd, {passive:true});
  main.addEventListener('touchcancel', onSwipeCancel, {passive:true});
}
function onSwipeStart(e){
  const card = e.target.closest('.cust-card[data-id]');
  if(!card) return;
  const touch = e.touches[0];
  swipeState = { card, startX: touch.clientX, startY: touch.clientY, currentX: 0, decided:false, horizontal:false };
}
function onSwipeMove(e){
  if(!swipeState) return;
  const touch = e.touches[0];
  const dx = touch.clientX - swipeState.startX;
  const dy = touch.clientY - swipeState.startY;
  if(!swipeState.decided){
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
      swipeState.decided = true;
      swipeState.horizontal = Math.abs(dx) > Math.abs(dy);
      if(!swipeState.horizontal){ swipeState = null; return; }
    } else {
      return;
    }
  }
  if(!swipeState) return;
  e.preventDefault();
  const maxDrag = 96;
  const clamped = Math.max(-maxDrag, Math.min(maxDrag, dx));
  swipeState.currentX = clamped;
  swipeState.card.style.transition = 'none';
  swipeState.card.style.transform = `translateX(${clamped}px)`;
}
function onSwipeEnd(){
  if(!swipeState) return;
  const { card, currentX, decided, horizontal } = swipeState;
  card.style.transition = 'transform 0.2s ease';
  card.style.transform = 'translateX(0)';
  const threshold = 64;
  if(decided && horizontal && Math.abs(currentX) >= threshold){
    const id = card.dataset.id;
    const kind = card.dataset.kind || 'customer';
    if(currentX > 0){
      if(kind === 'job') toggleJobDone(id);
      else if(kind === 'quote') markQuoteAccepted(id);
      else quickClean(id);
    } else {
      if(kind === 'job') toggleJobPaid(id);
      else if(kind === 'quote') markQuoteDeclined(id);
      else quickPaid(id);
    }
  }
  swipeState = null;
}
function onSwipeCancel(){
  if(!swipeState) return;
  swipeState.card.style.transition = 'transform 0.2s ease';
  swipeState.card.style.transform = 'translateX(0)';
  swipeState = null;
}

const WEATHER_CODES = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌦️', 56:'🌦️', 57:'🌦️',
  61:'🌧️', 63:'🌧️', 65:'🌧️', 66:'🌧️', 67:'🌧️',
  71:'🌨️', 73:'🌨️', 75:'🌨️', 77:'🌨️',
  80:'🌦️', 81:'🌧️', 82:'🌧️',
  85:'🌨️', 86:'🌨️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};
function loadWeather(){
  const el = document.getElementById('weatherPill');
  if(!el) return;
  const cacheRaw = localStorage.getItem('roundBookWeatherCache');
  let cache = null;
  try{ cache = cacheRaw ? JSON.parse(cacheRaw) : null; }catch(e){}
  if(cache && cache.text){ el.textContent = cache.text; }

  const cacheAgeMs = cache ? (Date.now() - cache.time) : Infinity;
  if(cacheAgeMs < 30*60*1000) return; // refresh at most every 30 minutes
  if(!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      const cw = json && json.current_weather;
      if(!cw) throw new Error('no weather');
      const icon = WEATHER_CODES[cw.weathercode] || '🌡️';
      const temp = Math.round(cw.temperature);
      const text = `${icon} ${temp}°C`;
      const el2 = document.getElementById('weatherPill');
      if(el2) el2.textContent = text;
      localStorage.setItem('roundBookWeatherCache', JSON.stringify({ text, time: Date.now() }));
    }catch(e){ /* offline or blocked — leave any cached reading showing */ }
  }, ()=>{ /* permission denied — fail silently, no clutter */ }, { enableHighAccuracy:false, timeout:10000, maximumAge:600000 });
}
loadWeather();
