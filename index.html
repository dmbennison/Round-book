  retry: function(fn,n,d,ctx) {
    n = n || 3; d = d || 1000; ctx = ctx || '';

    var lastError;
    function doTry() {
      attempt++;

            lastError = e;
            if(attempt < n) { return new Promise(function(r) { setTimeout(r, d * attempt); }).then(doTry); }

      } catch(e) {
        lastError = e;
        if(attempt < n) { return new Promise(function(r) { setTimeout(r, d * attempt); }).then(doTry); }
        self.handle(lastError, ctx || 'Retry failed', 'error');
        throw lastError;
      }
    }
    return doTry();
  }
};

  photoDbPromise: null,

  openPhotoDb: function() {
    if(this.photoDbPromise) return this.photoDbPromise;

  },
  photoUrlCache: new Map(),
  photoBytesTotal: 0,
  photoCountTotal: 0,
  cachePhotoBlob: function(id, blob) {
    var existing = this.photoUrlCache.get(id);
    if(existing) URL.revokeObjectURL(existing);

  uncachePhoto: function(id) {
    var existing = this.photoUrlCache.get(id);

  initPhotoStorage: function() {

      .then(function() { return self._cleanupOrphaned(); })

  _migrateLegacyPhotos: function() {
    var self = this;
    var jobs = [];
    var migrateList = function(list) {
      if(!list) return;
      for(var i = 0; i < list.length; i++) {
        var p = list[i];
        if(p && p.dataUrl) {
          var b = self._dataURLToBlob(p.dataUrl);
          jobs.push(b.then(function(blob) { return self.savePhoto(p.id, blob).then(function() { delete p.dataUrl; }); }));
        }
      }
    };
    for(var ci = 0; ci < (this.data.customers||[]).length; ci++) {
      migrateList(this.data.customers[ci].photos);
    }
    for(var ji = 0; ji < (this.data.oneOffJobs||[]).length; ji++) {
      migrateList(this.data.oneOffJobs[ji].photos);
    }
    if(jobs.length) return Promise.all(jobs).catch(function() {});
    return Promise.resolve();

  _preloadAllPhotos: function() {
    var self = this;
    return this.getAllPhotos().then(function(all) {
      var bytes = 0;
      all.forEach(function(blob, id) {
        self.cachePhotoBlob(id, blob);

      self.photoCountTotal = all.size;
    }).catch(function(e) { self.photoStorageAvailable = false; });
  },
  _cleanupOrphaned: function() {
    var self = this;
    return this.getAllPhotos().then(function(all) {
      var ref = new Set();
      for(var ci = 0; ci < (self.data.customers||[]).length; ci++) {
        var photos = self.data.customers[ci].photos || [];
        for(var pi = 0; pi < photos.length; pi++) ref.add(photos[pi].id);
      }
      for(var ji = 0; ji < (self.data.oneOffJobs||[]).length; ji++) {
        var jphotos = self.data.oneOffJobs[ji].photos || [];
        for(var jpi = 0; jpi < jphotos.length; jpi++) ref.add(jphotos[jpi].id);
      }
      var toRemove = [];
      all.forEach(function(blob, id) {
        if(!ref.has(id)) toRemove.push(id);
      });
      if(!toRemove.length) return;
      return Promise.all(toRemove.map(function(id) {
        return self.deletePhoto(id).then(function() {
          self.uncachePhoto(id);
          var b = all.get(id);
          if(b) { self.photoBytesTotal -= b.size; self.photoCountTotal--; }

    }).catch(function() {});
  },
  _dataURLToBlob: function(dataUrl) { return fetch(dataUrl).then(function(r) { return r.blob(); }); },
  blobToDataURL: function(blob) {

      reader.onload = function() { resolve(reader.result); };

      reader.readAsDataURL(blob);

  }
};

var Search = {
  index: [],
  isIndexed: false,
  buildIndex: function() {
    var d = Data.data;
    this.index = [];
    for(var ci = 0; ci < d.customers.length; ci++) {
      var c = d.customers[ci];
      var terms = [c.address, c.name, c.phone, c.email, c.round, c.accountNumber, c.notes];
      terms = terms.filter(function(t) { return t; });
      this.index.push({
        id: c.id,
        type: 'customer',
        text: c.address || '',
        subtext: [c.name, c.phone, c.email, c.round, c.accountNumber].filter(function(t){return t;}).join(' · '),
        searchTerms: terms.map(function(t){return t.toLowerCase();})
      });
    }
    for(var ji = 0; ji < (d.oneOffJobs||[]).length; ji++) {
      var j = d.oneOffJobs[ji];
      var jterms = [j.address, j.name, j.phone, j.notes].filter(function(t){return t;});
      this.index.push({
        id: j.id,
        type: 'job',
        text: j.address || j.name || 'Job',
        subtext: 'One-off job · ' + (j.date || ''),
        searchTerms: jterms.map(function(t){return t.toLowerCase();})
      });
    }
    this.isIndexed = true;
  },
  search: function(query, max) {
    max = max || 20;
    if(!this.isIndexed) this.buildIndex();
    if(!query || query.length < 2) return [];
    var terms = query.toLowerCase().split(/\s+/).filter(function(t){return t.length > 0;});
    var results = [];
    for(var i = 0; i < this.index.length; i++) {
      var item = this.index[i];
      var score = 0;
      var searchText = item.searchTerms.join(' ');
      for(var ti = 0; ti < terms.length; ti++) {
        var term = terms[ti];
        if(searchText.indexOf(term) !== -1) score += 2;
        if(item.text.toLowerCase().indexOf(term) === 0) score += 1;
        if(item.subtext.toLowerCase().indexOf(term) !== -1) score += 0.5;
      }
      if(score > 0) results.push({item:item, score:score});
    }
    results.sort(function(a,b){ return b.score - a.score; });
    var sliced = results.slice(0, max);
    return sliced.map(function(r){ return r.item; });
  },
  getSuggestions: function(query) {
    var results = this.search(query, 10);
    var self = this;
    return results.map(function(r) {
      return {
        text: r.text,
        subtext: r.subtext,
        id: r.id,
        type: r.type,
        highlight: self._highlight(r.text, query)
      };
    });
  },
  _highlight: function(text, query) {
    var result = text;
    var words = query.toLowerCase().split(/\s+/);
    for(var i = 0; i < words.length; i++) {
      var w = words[i];
      var regex = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(regex, '<span class="highlight">$1</span>');
    }
    return result;
  },
  renderAutocomplete: function(inputId, containerId) {
    var inp = document.getElementById(inputId);
    var cont = document.getElementById(containerId);
    if(!inp || !cont) return;
    var self = this;
    var sel = -1;
    var sugs = [];
    inp.addEventListener('input', function() {
      var q = inp.value.trim();
      if(q.length < 2) { cont.classList.remove('show'); return; }
      sugs = self.getSuggestions(q);
      if(!sugs.length) { cont.classList.remove('show'); return; }
      var html = '';
      for(var i = 0; i < sugs.length; i++) {
        html += '<div class="autocomplete-suggestion" data-index="' + i + '" onclick="window.RoundBook._selectSuggestion(\'' + inputId + '\',\'' + containerId + '\',' + i + ')"><div>' + sugs[i].highlight + '</div><div style="font-size:0.75rem;color:var(--ink-muted);">' + sugs[i].subtext + '</div></div>';
      }
      cont.innerHTML = html;
      cont.classList.add('show');
      sel = -1;
    });
    inp.addEventListener('keydown', function(e) {
      var items = cont.querySelectorAll('.autocomplete-suggestion');
      if(!items.length) return;
      if(e.key === 'ArrowDown') {
        e.preventDefault();
        sel = Math.min(sel + 1, items.length - 1);
        for(var i = 0; i < items.length; i++) {
          items[i].style.background = (i === sel) ? 'var(--blue-dim)' : '';
        }
      } else if(e.key === 'ArrowUp') {
        e.preventDefault();
        sel = Math.max(sel - 1, -1);
        for(var i = 0; i < items.length; i++) {
          items[i].style.background = (i === sel) ? 'var(--blue-dim)' : '';
        }
      } else if(e.key === 'Enter' && sel >= 0) {
        e.preventDefault();
        self._selectSuggestion(inputId, containerId, sel);
      } else if(e.key === 'Escape') {
        cont.classList.remove('show');
      }
    });
    document.addEventListener('click', function(e) {
      if(!cont.contains(e.target) && e.target !== inp) cont.classList.remove('show');
    });
  },
  _selectSuggestion: function(inputId, containerId, index) {
    var cont = document.getElementById(containerId);
    var items = cont.querySelectorAll('.autocomplete-suggestion');
    if(!items[index]) return;
    var idx = parseInt(items[index].dataset.index, 10);
    var sugs = this.getSuggestions(document.getElementById(inputId).value);
    if(!sugs[idx]) return;
    document.getElementById(inputId).value = sugs[idx].text;
    cont.classList.remove('show');
    document.getElementById(inputId).dispatchEvent(new Event('input'));
    if(sugs[idx].type === 'customer') {
      if(window.RoundBook) window.RoundBook.openCustomerDetail(sugs[idx].id);
    } else if(sugs[idx].type === 'job') {
      var jobs = Data.data.oneOffJobs || [];
      for(var i = 0; i < jobs.length; i++) {
        if(jobs[i].id === sugs[idx].id) {
          if(window.RoundBook) window.RoundBook.openJobForm(jobs[i]);
          break;
        }
      }
    }
  }
};

// ===== BACKUP WITH ENCRYPTION =====
var Backup = {
  encryptionKey: null,
  exportWithPassword: function(pw) {
    try {
      var jsonStr = JSON.stringify(Data.data, null, 2);
      if(pw && typeof CryptoJS !== 'undefined') {
        var encrypted = CryptoJS.AES.encrypt(jsonStr, pw);
        return new Blob([encrypted.toString()], {type:'application/octet-stream'});
      }
      return new Blob([jsonStr], {type:'application/json'});
    } catch(e) {
      ErrorHandler.handle(e, 'Export backup failed', 'error');
      throw e;
    }
  },
  importWithPassword: function(file, pw) {
    var self = this;
    return file.text().then(function(text) {
      var jsonStr;
      if(pw && typeof CryptoJS !== 'undefined') {
        try {
          var dec = CryptoJS.AES.decrypt(text, pw);
          jsonStr = dec.toString(CryptoJS.enc.Utf8);
          if(!jsonStr) throw new Error('Invalid password');
        } catch(e) {
          throw new Error('Invalid password or corrupted backup');
        }
      } else {
        jsonStr = text;
      }
      var data = JSON.parse(jsonStr);
      if(!data.customers || !Array.isArray(data.customers)) throw new Error('Invalid backup format');
      return data;
    }).catch(function(e) {
      ErrorHandler.handle(e, 'Import backup failed', 'error');
      throw e;
    });
  },
  exportBackup: function() {
    var self = this;
    return this._promptPassword('Set a password for this backup (optional):', true).then(function(pw) {
      return self.exportWithPassword(pw || '');
    }).then(function(blob) {
      var fn = 'round-book-backup-' + Utils.todayISO() + '.json';
      if(navigator.canShare) {
        try {
          var file = new File([blob], fn, {type:'application/octet-stream'});
          if(navigator.canShare({files:[file]})) {
            return navigator.share({files:[file], title:'Round Book Backup'}).then(function() {
              self._markBackedUp();
            });
          }
        } catch(e) {
          if(e.name === 'AbortError') return;
        }
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fn;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      self._markBackedUp();
    });
  },
  importBackup: function(file) {
    var self = this;
    return this._promptPassword('Enter password if encrypted (leave blank if not):', false).then(function(pw) {
      return self.importWithPassword(file, pw || '');
    }).then(function(data) {
      if(confirm('Import ' + data.customers.length + ' customers? This will replace all data.')) {
        Data.data = Data.migrate(data);
        Data.save();
        Search.isIndexed = false;
        if(window.RoundBook) { window.RoundBook.render(); window.RoundBook.toast('Backup restored successfully'); }
      }
    }).catch(function(e) {
      if(window.RoundBook) window.RoundBook.toast('❌ ' + e.message);
      throw e;
    });
  },
  _promptPassword: function(msg, isSetting) {
    return new Promise(function(resolve) {
      var result = prompt(msg);
      if(result === null) { resolve(null); return; }
      if(result && isSetting) {
        var c = prompt('Confirm password:');
        if(result !== c) { alert('Passwords do not match'); resolve(null); return; }
      }
      resolve(result);
    });
  },
  _markBackedUp: function() {
    localStorage.setItem('roundBookLastBackup', Utils.todayISO());
    if(window.RoundBook) window.RoundBook.render();
  },
  renderBackupUI: function() {
    var stats = this._computeStats();
    var days = window.RoundBook ? window.RoundBook._daysSinceBackup() : 0;
    var lastText = days === Infinity ? "You haven't backed up yet" : days === 0 ? "Backed up today" : "Last backup: " + days + " day" + (days === 1 ? '' : 's') + " ago";
    var html = '<p style="color:var(--ink-muted);font-size:0.8438rem;line-height:1.5;margin:0 2px 4px;">Everything is stored only on this phone, in this browser. Nothing is sent anywhere. Export a backup regularly in case the app data is ever cleared.</p><p style="color:' + (days >= 7 ? 'var(--amber)' : 'var(--ink-muted)') + ';font-size:0.7812rem;font-weight:700;margin:0 2px 16px;">' + lastText + '</p><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:12px;padding:14px;margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;"><span style="font-size:0.8125rem;font-weight:800;color:var(--ink);">Customer &amp; job data</span><span style="font-size:0.9375rem;font-weight:800;color:var(--ink);">' + Utils.formatBytes(stats.totalBytes) + '</span></div><div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:' + stats.pctUsed + '%;background:' + stats.barColor + ';border-radius:3px;"></div></div></div>' + (stats.photoCount > 0 ? '<div style="background:var(--surface);border:1px solid var(--box-border);border-radius:12px;padding:14px;margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;"><span style="font-size:0.8125rem;font-weight:800;color:var(--ink);">Photos</span><span style="font-size:0.9375rem;font-weight:800;color:var(--ink);">' + Utils.formatBytes(stats.photoBytes) + '</span></div></div>' : '') + '<button class="backup-btn" onclick="window.RoundBookBackup.exportBackup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><div><div class="t1">Export backup ' + (Data.data.settings.encryptedBackups ? '🔒' : '') + '</div><div class="t2">' + Data.data.customers.length + ' customers · ' + (Data.data.settings.encryptedBackups ? 'Password protected' : 'Unencrypted') + '</div></div></button><button class="backup-btn" onclick="document.getElementById(\'importFile\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg><div><div class="t1">Restore from backup</div><div class="t2">' + (Data.data.settings.encryptedBackups ? '🔒 Password protected' : 'Unencrypted') + '</div></div></button><button class="backup-btn" onclick="document.getElementById(\'importSpreadsheetFile\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/><path d="M14 14l3 3 3-3" transform="translate(0,-2)"/></svg><div><div class="t1">Import customers from spreadsheet</div><div class="t2">.csv or .xlsx — added to a "needs review" round</div></div></button><div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);"><label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-size:0.8125rem;font-weight:600;"><input type="checkbox" id="encryptedBackupsToggle" ' + (Data.data.settings.encryptedBackups ? 'checked' : '') + ' onchange="Data.data.settings.encryptedBackups=this.checked;Data.save();"><span>Encrypt backups by default</span></label><p style="color:var(--ink-muted);font-size:0.75rem;margin:4px 2px 0;line-height:1.4;">When enabled, all new backups will be encrypted with a password.</p></div>';
    return html;
  },
  _computeStats: function() {
    var jsonStr = JSON.stringify(Data.data);
    var totalBytes = new Blob([jsonStr]).size;
    var assumedLimit = 5 * 1024 * 1024;
    var pctUsed = Math.min(100, Math.round((totalBytes / assumedLimit) * 100));
    var barColor = pctUsed >= 80 ? 'var(--red)' : pctUsed >= 50 ? 'var(--amber)' : 'var(--green)';
    var photoBytes = Data.photoBytesTotal || 0;
    var photoCount = Data.photoCountTotal || 0;
    for(var ci = 0; ci < (Data.data.customers||[]).length; ci++) {
      var photos = Data.data.customers[ci].photos || [];
      for(var pi = 0; pi < photos.length; pi++) {
        if(photos[pi].dataUrl) { photoBytes += new Blob([photos[pi].dataUrl]).size; photoCount++; }
      }
    }
    for(var ji = 0; ji < (Data.data.oneOffJobs||[]).length; ji++) {
      var jphotos = Data.data.oneOffJobs[ji].photos || [];
      for(var jpi = 0; jpi < jphotos.length; jpi++) {
        if(jphotos[jpi].dataUrl) { photoBytes += new Blob([jphotos[jpi].dataUrl]).size; photoCount++; }
      }
    }
    return {totalBytes:totalBytes, pctUsed:pctUsed, barColor:barColor, photoBytes:photoBytes, photoCount:photoCount};
  }
};

// ===== SCHEDULE =====
var Schedule = {
  generate: function() {
    var today = Utils.todayISO();
    var tomorrow = (function() { var d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0,10); })();
    var sched = [];
    var customers = Data.data.customers || [];
    for(var ci = 0; ci < customers.length; ci++) {
      var c = customers[ci];
      if(c.paused) continue;
      var next = window.RoundBook ? window.RoundBook.nextDueISO(c) : null;
      if(next === today || next === tomorrow) {
        sched.push({
          id: c.id,
          type: 'round',
          title: c.address || c.name || 'Customer',
          subtitle: 'Round: ' + (c.round || 'Unassigned') + ' · ' + Utils.money(c.price),
          date: next,
          badge: next === today ? 'Today' : 'Tomorrow',
          badgeType: next === today ? 'today' : 'round',
          data: c
        });
      }
    }
    var jobs = Data.data.oneOffJobs || [];
    for(var ji = 0; ji < jobs.length; ji++) {
      var j = jobs[ji];
      if(j.done) continue;
      if(j.date === today || j.date === tomorrow) {
        sched.push({
          id: j.id,
          type: 'job',
          title: j.address || j.name || 'Job',
          subtitle: 'One-off job · ' + Utils.money(j.price) + (j.time ? ' at ' + Utils.fmtTime(j.time) : ''),
          date: j.date,
          time: j.time,
          badge: j.date === today ? 'Today' : 'Tomorrow',
          badgeType: 'job',
          data: j
        });
      }
    }
    var quotes = Data.data.quotes || [];
    for(var qi = 0; qi < quotes.length; qi++) {
      var q = quotes[qi];
      if(q.status !== 'pending') continue;
      if(window.RoundBook && window.RoundBook.quoteNeedsFollowUp(q, today)) {
        sched.push({
          id: q.id,
          type: 'quote',
          title: q.address || q.name || 'Quote',
          subtitle: 'Pending follow-up · ' + Utils.money(q.price) + ' · Quoted ' + Utils.fmtDate(q.date),
          date: q.date,
          badge: 'Follow up',
          badgeType: 'overdue',
          data: q,
          isOverdue: true
        });
      }
    }
    sched.sort(function(a,b) {
      if(a.date !== b.date) return a.date.localeCompare(b.date);
      return (a.time || '').localeCompare(b.time || '');
    });
    return sched;
  },
  render: function() {
    var sched = this.generate();
    if(!sched.length) {
      return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg><b>Nothing scheduled for today or tomorrow</b><p>Check back later for upcoming work.</p></div>';
    }
    var groups = {};
    for(var i = 0; i < sched.length; i++) {
      var item = sched[i];
      if(!groups[item.date]) groups[item.date] = [];
      groups[item.date].push(item);
    }
    var html = '<div class="section-label" style="margin-top:0;">Today &amp; Tomorrow</div><div style="margin-bottom:8px;font-size:0.75rem;color:var(--ink-muted);">' + sched.length + ' item' + (sched.length === 1 ? '' : 's') + ' scheduled</div>';
    var dates = Object.keys(groups).sort();
    for(var di = 0; di < dates.length; di++) {
      var date = dates[di];
      var label = date === Utils.todayISO() ? 'Today' : 'Tomorrow';
      html += '<div class="day-divider">' + label + ' · ' + Utils.fmtDate(date) + '</div>';
      var items = groups[date];
      for(var ii = 0; ii < items.length; ii++) {
        var item = items[ii];
        var badgeClass = item.isOverdue ? 'overdue' : item.badgeType;
        html += '<div class="schedule-item" onclick="window.RoundBook._openScheduleItem(\'' + item.type + '\',\'' + item.id + '\')"><div class="schedule-time">' + (item.time ? Utils.fmtTime(item.time) : '—') + '</div><div class="schedule-details"><div class="title">' + Utils.escapeHtml(item.title) + '</div><div class="sub">' + Utils.escapeHtml(item.subtitle) + '</div></div><span class="schedule-badge ' + badgeClass + '">' + item.badge + '</span></div>';
      }
    }
    return html;
  },
  openItem: function(type, id) {
    if(!window.RoundBook) return;
    if(type === 'round' || type === 'customer') {
      window.RoundBook.openCustomerDetail(id);
    } else if(type === 'job') {
      var jobs = Data.data.oneOffJobs || [];
      for(var i = 0; i < jobs.length; i++) {
        if(jobs[i].id === id) { window.RoundBook.openJobForm(jobs[i]); break; }
      }
    } else if(type === 'quote') {
      var quotes = Data.data.quotes || [];
      for(var qi = 0; qi < quotes.length; qi++) {
        if(quotes[qi].id === id) { window.RoundBook.openQuoteForm(quotes[qi]); break; }
      }
    }
  }
};

      tabs[i].addEventListener('click', function() { self.setTab(this.dataset.tab); });
    }
    document.addEventListener('keydown', function(e) {
      if(e.ctrlKey && e.key === 'n') self.handleFabClick();
      if(e.ctrlKey && e.key === 's') { e.preventDefault(); Data.save(); self.toast('Saved'); }
      if(e.ctrlKey && e.key === 'p') self.openReports();
    });
  },

  _applyDarkMode: function() {
    document.body.classList.toggle('dark', this.darkMode);
    this._applyTheme();
  },
  setDarkMode: function(v) {
    this.darkMode = v;
    localStorage.setItem('roundBookDark', v ? '1' : '0');
    this._applyDarkMode();
    this.openSettings();
  },
  _applyTextSize: function() {
    document.documentElement.style.fontSize = this.textSize + 'px';
  },
  setTextSize: function(v) {
    var n = Math.max(15, Math.min(24, parseInt(v,10) || 18));
    this.textSize = n;
    localStorage.setItem('roundBookTextSize', String(n));
    this._applyTextSize();
    this.openSettings();
  },
  _applyTheme: function() {
    var t = THEMES[this.themeName] || THEMES.ocean;
    var r = document.body.style;
    r.setProperty('--navy', t.navy);
    r.setProperty('--blue', t.blue);
    r.setProperty('--navy-dark', Utils.mixHex(t.navy, '#000000', 0.28));
    r.setProperty('--blue-deep', Utils.mixHex(t.blue, '#000000', 0.32));
    r.setProperty('--blue-dim', this.darkMode ? Utils.mixHex(t.blue, '#0E1620', 0.82) : Utils.mixHex(t.blue, '#FFFFFF', 0.86));
    r.setProperty('--card-tint', this.darkMode ? Utils.mixHex(t.blue, '#16212C', 0.92) : Utils.mixHex(t.blue, '#FFFFFF', 0.94));
    r.setProperty('--bg', this.darkMode ? Utils.mixHex(t.blue, '#0E1620', 0.90) : Utils.mixHex(t.blue, '#F5F7F8', 0.92));
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', t.navy);
  },
  setTheme: function(name) {
    if(!THEMES[name]) return;
    this.themeName = name;
    localStorage.setItem('roundBookTheme', name);
    this._applyTheme();
    this.openSettings();
  },

  setTab: function(tab) {
    this.currentTab = tab;
    this.currentRound = null;
    this.reorderMode = false;
    this.roundFilterMode = 'all';
    this.roundDayFilter = 'all';
    var tabs = document.querySelectorAll('.tab');
    for(var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].dataset.tab === tab);
    }
    this.render();
    window.scrollTo(0, 0);
  },

  openSheet: function(html, onClose) {
    this.sheetOnClose = onClose || null;
    document.getElementById('sheet').innerHTML = '<div class="sheet-handle"></div>' + html;
    document.getElementById('overlay').classList.add('show');
  },
  closeSheet: function() {
    document.getElementById('overlay').classList.remove('show');
    if(this.sheetOnClose) {
      var cb = this.sheetOnClose;
      this.sheetOnClose = null;
      cb();
    }
  },

  toast: function(msg, actionLabel, actionFn) {
    var t = document.getElementById('toast');
    clearTimeout(t._t);
    this._pendingToastAction = actionFn || null;
    if(actionLabel && actionFn) {
      t.innerHTML = Utils.escapeHtml(msg) + '<button class="toast-undo-btn" onclick="window.RoundBook._runToastAction()">' + Utils.escapeHtml(actionLabel) + '</button>';
      t.classList.add('show');
      var self = this;
      t._t = setTimeout(function() { t.classList.remove('show'); self._pendingToastAction = null; }, 5000);
    } else {
      t.textContent = msg;
      t.classList.add('show');
      t._t = setTimeout(function() { t.classList.remove('show'); }, 1600);
    }
  },
  _runToastAction: function() {
    var fn = this._pendingToastAction;
    this._pendingToastAction = null;
    var t = document.getElementById('toast');
    clearTimeout(t._t);
    t.classList.remove('show');
    if(fn) fn();
  },

  handleFabClick: function() {
    if(this.currentTab === 'jobs') this.openJobForm();
    else if(this.currentTab === 'quotes') this.openQuoteForm();
    else if(this.currentTab === 'schedule') this.openJobForm();
    else this.openCustomerForm();
  },

  // ===== CUSTOMER STATUS HELPERS =====
  custStatus: function(c) {
    var lastClean = Utils.lastDateOf(c.cleanHistory);
    var lastPaid = Utils.lastOf((c.paymentHistory||[]).map(function(p){ return p.date; }));
    var freq = (c.frequencyWeeks || 4) * 7;
    var cleanBadge = null;
    var deferred = c.deferUntil && c.deferUntil > Utils.todayISO();
    if(c.paused) {
      cleanBadge = {type:'paused', text: c.pauseReason ? 'Paused — ' + c.pauseReason : 'Paused'};
    } else if(deferred) {
      cleanBadge = {type:'deferred', text: 'Deferred to ' + Utils.fmtDate(c.deferUntil)};
    } else if(lastClean) {
      var due = Utils.daysBetween(lastClean, Utils.todayISO());
      if(due >= freq) {
        cleanBadge = {type:'due', text: (due - freq === 0) ? 'Due today' : 'Due +' + (due - freq)};
      }
    } else {
      cleanBadge = {type:'due', text:'Never cleaned'};
    }
    var totalCharged = 0;
    for(var i = 0; i < (c.cleanHistory||[]).length; i++) {
      totalCharged += Number(c.cleanHistory[i].amount || 0);
    }
    var totalPaid = 0;
    for(var pi = 0; pi < (c.paymentHistory||[]).length; pi++) {
      totalPaid += Number(c.paymentHistory[pi].amount || 0);
    }
    var balance = Math.round((totalCharged - totalPaid) * 100) / 100;
    var owed = balance > 0.005;
    var credit = balance < -0.005;
    return {cleanBadge:cleanBadge, owed:owed, credit:credit, balance:balance, lastClean:lastClean, lastPaid:lastPaid};
  },

  nextDueISO: function(c) {
    var lastClean = Utils.lastDateOf(c.cleanHistory);
    if(!lastClean) return null;
    var d = new Date(lastClean + 'T00:00:00');
    d.setDate(d.getDate() + (c.frequencyWeeks || 4) * 7);
    return d.toISOString().slice(0,10);
  },

  quoteNeedsFollowUp: function(q, today) {
    today = today || Utils.todayISO();
    if(!q || q.status !== 'pending' || !q.date) return false;
    var days = q.followUpDays != null ? q.followUpDays : 7;
    return Utils.daysBetween(q.date, today) >= days;
  },

  // ===== RENDER =====
  render: function() {
    this._renderBanners();
    var main = document.getElementById('main');
    if(this.currentTab === 'schedule') { main.innerHTML = Schedule.render(); return; }
    if(this.currentTab === 'rounds' && !this.currentRound) { this._renderRoundsList(main); return; }
    if(this.currentTab === 'rounds' && this.currentRound) { this._renderRoundDetail(main, this.currentRound); return; }
    if(this.currentTab === 'jobs') { this._renderJobs(main); return; }
    if(this.currentTab === 'quotes') { this._renderQuotes(main); return; }
  },

  // ===== BANNERS =====
  _renderBanners: function() {
    var bc = document.getElementById('bannerContainer');
    if(!bc) return;
    var html = '';
    var days = this._daysSinceBackup();
    if(!this._bannerDismissed.backup && Data.data.customers.length && days >= 7) {
      html += '<div style="background:var(--amber-dim);color:var(--amber);border-radius:12px;padding:11px 14px;margin:0 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:0.8125rem;font-weight:700;"><span>📦 ' + (days === Infinity ? 'You haven\'t backed up yet' : 'It\'s been ' + days + ' days since your last backup') + '</span><span style="display:flex;gap:8px;flex-shrink:0;align-items:center;"><button onclick="window.RoundBook.openBackup()" style="background:var(--amber);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-weight:800;font-size:0.7812rem;">Back up</button><button onclick="window.RoundBook._dismissBanner(\'backup\')" style="background:none;border:none;color:var(--amber);font-weight:800;font-size:1rem;line-height:1;padding:0 2px;">✕</button></span></div>';
    }
    bc.innerHTML = html;
  },
  _dismissBanner: function(type) {
    this._bannerDismissed[type] = true;
    this._renderBanners();
  },
  _daysSinceBackup: function() {
    var last = localStorage.getItem('roundBookLastBackup');
    if(!last) return Infinity;
    return Utils.daysBetween(last, Utils.todayISO());
  },

  // ===== ROUNDS LIST =====
  _groupByRound: function(list) {
    var rounds = {};
    for(var i = 0; i < list.length; i++) {
      var r = list[i].round || 'Unassigned';
      if(!rounds[r]) rounds[r] = [];
      rounds[r].push(list[i]);
    }
    return rounds;
  },

  _roundDaysUsed: function(custs) {
    var days = [];
    for(var i = 0; i < custs.length; i++) {
      var d = custs[i].visitDay || 1;
      if(days.indexOf(d) === -1) days.push(d);
    }
    days.sort(function(a,b){ return a-b; });
    return days;
  },

  _isMobileNumber: function(phone) {
    if(!phone) return false;
    var digits = phone.replace(/[^\d+]/g, '');
    return /^07\d{9}$/.test(digits) || /^(\+44|0044)7\d{9}$/.test(digits);
  },

  _emptyState: function(kind) {
    if(kind === 'rounds') return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M4 4h16v12H4z"/><path d="M4 10h16M10 4v12"/></svg><b>No customers yet</b><p>Tap the blue + button to add your first customer and give them a round.</p></div>';
    return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><b>No matches</b><p>Try a different filter.</p></div>';
  },

  _renderRoundsList: function(main) {
    var rounds = this._groupByRound(Data.data.customers);
    var roundNames = Object.keys(rounds).sort(function(a,b){ return a.localeCompare(b); });
    var html = '';
    if(Data.data.customers.length) {
      var active = Data.data.customers.filter(function(c){ return !c.paused; });
      var total = active.length;
      var value = 0;
      for(var i = 0; i < active.length; i++) value += Number(active[i].price || 0);
      var avg = total ? value / total : 0;
      html += '<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;"><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._openCustomerSearch()" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._openRoundReports()" aria-label="Print"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button></div><div class="summary-overall"><div class="stat"><div class="num">' + total + '</div><div class="lbl">Customers</div></div><div class="stat"><div class="num">' + Utils.money(value) + '</div><div class="lbl">Round value</div></div><div class="stat"><div class="num">' + Utils.money(avg) + '</div><div class="lbl">Avg / customer</div></div></div>';
    }
    html += '<div class="seg-row"><button class="seg-btn ' + (this.roundsViewMode === 'overview' ? 'active' : '') + '" onclick="window.RoundBook._setRoundsView(\'overview\')">Rounds</button><button class="seg-btn ' + (this.roundsViewMode === 'due' ? 'active' : '') + '" onclick="window.RoundBook._setRoundsView(\'due\')">Due</button><button class="seg-btn ' + (this.roundsViewMode === 'owed' ? 'active' : '') + '" onclick="window.RoundBook._setRoundsView(\'owed\')">Owed</button></div>';
    if(!roundNames.length) { main.innerHTML = html + this._emptyState('rounds'); return; }
    if(this.roundsViewMode === 'overview') {
      html += '<div class="section-label">Your rounds</div>';
      for(var ri = 0; ri < roundNames.length; ri++) {
        var rn = roundNames[ri];
        var all = rounds[rn];
        var daysUsed = this._roundDaysUsed(all);
        var due = 0, owed = 0, paused = 0;
        for(var ci = 0; ci < all.length; ci++) {
          var s = this.custStatus(all[ci]);
          if(all[ci].paused) paused++;
          else if(s.cleanBadge && s.cleanBadge.type === 'due') due++;
          if(s.owed) owed++;
        }
        html += '<div class="round-card" onclick="window.RoundBook._openRound(\'' + rn + '\')"><div><div class="rname">' + Utils.escapeHtml(rn) + '</div><div class="rcount">' + all.length + ' customer' + (all.length === 1 ? '' : 's') + (daysUsed.length > 1 ? ' · ' + daysUsed.length + ' days' : '') + '</div></div><div class="badges">' + (due ? '<span class="badge due">' + due + ' due</span>' : '') + (owed ? '<span class="badge owed">' + owed + ' owe</span>' : '') + (paused ? '<span class="badge paused">' + paused + ' paused</span>' : '') + (!due && !owed ? '<span class="badge ok">All clear</span>' : '') + '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></div></div>';
      }
    } else if(this.roundsViewMode === 'due') {
      var anyDue = false;
      for(var rni = 0; rni < roundNames.length; rni++) {
        var rn2 = roundNames[rni];
        var dueCusts = [];
        var all2 = rounds[rn2];
        for(var ci2 = 0; ci2 < all2.length; ci2++) {
          var s2 = this.custStatus(all2[ci2]);
          if(!all2[ci2].paused && s2.cleanBadge && s2.cleanBadge.type === 'due') {
            dueCusts.push(all2[ci2]);
          }
        }
        if(!dueCusts.length) continue;
        anyDue = true;
        var anyPhone = false;
        for(var di = 0; di < dueCusts.length; di++) {
          if(this._isMobileNumber(dueCusts[di].phone)) { anyPhone = true; break; }
        }
        html += '<div class="round-group-header" style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;"><div class="section-label" style="margin:0;">' + Utils.escapeHtml(rn2) + ' <span style="font-weight:600;color:var(--ink-muted);text-transform:none;letter-spacing:0;">(' + dueCusts.length + ')</span></div>' + (anyPhone ? '<button onclick="window.RoundBook._openBulkReminders(\'due\',\'' + rn2 + '\')" style="background:none;border:none;color:var(--blue);font-size:0.75rem;font-weight:800;">✉️ Remind all</button>' : '') + '</div>';
        for(var ci3 = 0; ci3 < dueCusts.length; ci3++) {
          html += this._custCardHtml(dueCusts[ci3]);
        }
      }
      if(!anyDue) html += '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg><b>Nobody\'s due</b><p>Everyone\'s cleaned on schedule.</p></div>';
    } else if(this.roundsViewMode === 'owed') {
      var anyOwed = false;
      var grandTotal = 0;
      for(var rni2 = 0; rni2 < roundNames.length; rni2++) {
        var rn3 = roundNames[rni2];
        var owedCusts = [];
        var all3 = rounds[rn3];
        for(var ci4 = 0; ci4 < all3.length; ci4++) {
          if(this.custStatus(all3[ci4]).owed) owedCusts.push(all3[ci4]);
        }
        if(!owedCusts.length) continue;
        anyOwed = true;
        var rt = 0;
        for(var oi = 0; oi < owedCusts.length; oi++) {
          rt += this.custStatus(owedCusts[oi]).balance;
        }
        grandTotal += rt;
        var anyPhone2 = false;
        for(var oi2 = 0; oi2 < owedCusts.length; oi2++) {
          if(this._isMobileNumber(owedCusts[oi2].phone)) { anyPhone2 = true; break; }
        }
        html += '<div class="round-group-header" style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;"><div class="section-label" style="margin:0;">' + Utils.escapeHtml(rn3) + ' <span style="font-weight:600;color:var(--ink-muted);text-transform:none;letter-spacing:0;">(owing ' + Utils.money(rt) + ')</span></div>' + (anyPhone2 ? '<button onclick="window.RoundBook._openBulkReminders(\'owed\',\'' + rn3 + '\')" style="background:none;border:none;color:var(--blue);font-size:0.75rem;font-weight:800;">✉️ Remind all</button>' : '') + '</div>';
        for(var ci5 = 0; ci5 < owedCusts.length; ci5++) {
          html += this._custCardHtml(owedCusts[ci5]);
        }
      }
      if(!anyOwed) html += '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg><b>Nobody owes anything</b><p>Everyone\'s paid up.</p></div>';
      else html += '<div style="text-align:right;font-weight:800;font-size:0.9375rem;color:var(--emphasis);padding:10px 4px 4px;">Total owed: ' + Utils.money(grandTotal) + '</div>';
    }
    main.innerHTML = html;
  },

  _custCardHtml: function(c) {
    var s = this.custStatus(c);
    var roundCustomers = Data.data.customers.filter(function(x) { return (x.round||'Unassigned') === (c.round||'Unassigned'); });
    var showDayBadge = this._roundDaysUsed(roundCustomers).length > 1;
    var html = '<div class="swipe-wrap"><div class="swipe-bg swipe-bg-left">✓ Cleaned</div><div class="swipe-bg swipe-bg-right">💷 Paid</div><div class="cust-card" data-id="' + c.id + '" data-kind="customer"><div class="cust-top" onclick="window.RoundBook.openCustomerDetail(\'' + c.id + '\')"><div><div class="cust-addr" style="font-size:1rem;font-weight:800;color:var(--ink);">' + Utils.escapeHtml(c.address||'No address') + '</div>';
    if(c.name || c.phone) {
      var parts = [];
      if(c.name) parts.push(Utils.escapeHtml(c.name));
      if(c.phone) parts.push(Utils.escapeHtml(c.phone));
      html += '<div class="cust-name" style="font-size:0.8125rem;font-weight:600;color:var(--ink-muted);margin-top:2px;">' + parts.join(' · ') + '</div>';
    }
    html += '</div><div class="cust-right"><div class="cust-price">' + Utils.money(c.price) + '</div><div class="cust-btn-row">';
    if(c.phone) html += '<button class="call-btn" onclick="event.stopPropagation();window.RoundBook._callCustomer(\'customer\',\'' + c.id + '\')" title="Call" aria-label="Call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>';
    if(c.address) html += '<button class="dir-btn" onclick="event.stopPropagation();window.RoundBook._openDirections(\'customer\',\'' + c.id + '\')" title="Directions" aria-label="Directions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg></button>';
    html += '</div></div></div><div class="cust-meta">';
    if(s.cleanBadge) html += '<span class="badge ' + s.cleanBadge.type + '"' + (c.paused && c.pauseDate ? ' title="Paused since ' + Utils.fmtDate(c.pauseDate) + '"' : '') + '>' + s.cleanBadge.text + '</span>';
    else html += '<span class="badge ok">Cleaned ' + Utils.fmtDate(s.lastClean) + '</span>';
    if(s.owed) html += '<span class="badge owed">Owes ' + Utils.money(s.balance) + '</span>';
    else if(s.credit) html += '<span class="badge ok">Credit ' + Utils.money(Math.abs(s.balance)) + '</span>';
    else html += '<span class="badge ok">Paid up</span>';
    if(s.owed && (c.paymentReminderCount||0) >= 2) html += '<span class="badge escalate" title="' + (c.paymentReminderCount||0) + ' payment reminders sent, still unpaid">⚠ Chase</span>';
    if(s.owed && c.paymentReminderSent) html += '<span class="badge paused">🔔 ' + Utils.fmtDate(c.paymentReminderSentDate).split(' ').slice(0,2).join(' ') + '</span>';
    if(c.photos && c.photos.length) html += '<span class="badge paused">📷 ' + c.photos.length + '</span>';
    if(c.textBeforeVisit) html += '<span class="badge anniversary" title="Text before you arrive">📱 Text first</span>';
    if(showDayBadge) html += '<span class="badge anniversary">Day ' + (c.visitDay||1) + '</span>';
    if(this._isMobileNumber(c.phone) && s.lastClean === Utils.todayISO()) {
      html += '<button onclick="event.stopPropagation();window.RoundBook._sendTemplate(\'' + c.id + '\',\'cleanedToday\')" style="display:inline-flex;align-items:center;gap:4px;background:var(--green-dim);color:var(--green);border:none;border-radius:20px;padding:5px 10px;font-size:0.7188rem;font-weight:800;line-height:1;">💬 Cleaned today</button>';
    }
    html += '</div></div></div>';
    return html;
  },

  // ===== ROUND DETAIL =====
  _renderRoundDetail: function(main, rn) {
    main.innerHTML = '<div style="padding:20px;text-align:center;color:var(--ink-muted);">Round detail for ' + Utils.escapeHtml(rn) + '<br><br><button class="btn btn-clean" onclick="window.RoundBook.currentRound=null;window.RoundBook.render();">← Back</button></div>';
  },

  // ===== JOBS =====
  _renderJobs: function(main) {
    var jobs = Data.data.oneOffJobs || [];
    if(!jobs.length) {
      main.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><b>No one-off jobs yet</b><p>Tap the blue + button to add a gutter clean, one-time job, or anything outside your regular rounds.</p></div>';
      return;

  _analyticsHTML: function() {
    var d = Data.data;
    var customers = d.customers || [];
    var active = [];
    for(var ci = 0; ci < customers.length; ci++) {
      if(!customers[ci].paused) active.push(customers[ci]);
    }
    var total = active.length;
    var value = 0;
    for(var vi = 0; vi < active.length; vi++) value += Number(active[vi].price || 0);
    var avg = total ? value / total : 0;
    var owed = 0, owedCount = 0;
    for(var oi = 0; oi < customers.length; oi++) {
      var s = this.custStatus(customers[oi]);
      if(s.owed) { owed += s.balance; owedCount++; }
    }
    var payments = [];
    for(var pi = 0; pi < customers.length; pi++) {
      var pHistory = customers[pi].paymentHistory || [];
      for(var hi = 0; hi < pHistory.length; hi++) {
        payments.push({date: pHistory[hi].date, amount: Number(pHistory[hi].amount || 0)});
      }
    }
    var jobs = d.oneOffJobs || [];
    for(var ji = 0; ji < jobs.length; ji++) {
      if(jobs[ji].paid) {
        payments.push({date: jobs[ji].paidDate || jobs[ji].date, amount: Number(jobs[ji].price || 0)});
      }
    }
    var totalRevenue = 0;
    for(var ri = 0; ri < payments.length; ri++) totalRevenue += payments[ri].amount;
    var totalPayments = payments.length;
    var now = new Date();
    var last30 = 0, last90 = 0, last365 = 0;
    var d30 = new Date(now.getTime() - 30*24*60*60*1000);
    var d90 = new Date(now.getTime() - 90*24*60*60*1000);
    var d365 = new Date(now.getTime() - 365*24*60*60*1000);
    for(var pi2 = 0; pi2 < payments.length; pi2++) {
      var pDate = new Date(payments[pi2].date + 'T00:00:00');
      if(pDate >= d30) last30 += payments[pi2].amount;
      if(pDate >= d90) last90 += payments[pi2].amount;
      if(pDate >= d365) last365 += payments[pi2].amount;
    }
    return '<div class="analytics-grid"><div class="analytics-card"><div class="value">' + total + '</div><div class="label">Active Customers</div></div><div class="analytics-card"><div class="value">' + Utils.money(value) + '</div><div class="label">Total Round Value</div></div><div class="analytics-card"><div class="value">' + Utils.money(avg) + '</div><div class="label">Avg per Customer</div></div><div class="analytics-card"><div class="value ' + (owed > 0 ? 'analytics-trend-down' : 'analytics-trend-up') + '">' + Utils.money(owed) + '</div><div class="label">Outstanding (' + owedCount + ' customers)</div></div><div class="analytics-card"><div class="value">' + Utils.money(totalRevenue) + '</div><div class="label">All Time Revenue</div></div><div class="analytics-card"><div class="value">' + totalPayments + '</div><div class="label">Total Payments</div></div></div><div class="section-label">Revenue</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;"><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">' + Utils.money(last30) + '</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 30 days</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">' + Utils.money(last90) + '</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 90 days</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">' + Utils.money(last365) + '</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 12 months</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">' + Utils.money(totalRevenue) + '</div><div style="font-size:0.6562rem;color:var(--ink-muted);">All time</div></div></div><div style="font-size:0.75rem;color:var(--ink-muted);text-align:center;border-top:1px solid var(--line);padding-top:12px;">Data as of ' + Utils.fmtDate(Utils.todayISO()) + '</div>';
  },

  // ===== WEATHER =====
  _loadWeather: function() {
    var el = document.getElementById('weatherPill');
    if(!el) return;
    var cacheRaw = localStorage.getItem('roundBookWeatherCache');
    var cache = null;
    try { cache = cacheRaw ? JSON.parse(cacheRaw) : null; } catch(e) {}
    if(cache && cache.text) el.textContent = cache.text;
    var cacheAgeMs = cache ? Date.now() - cache.time : Infinity;
    if(cacheAgeMs < 30*60*1000) return;
    if(!navigator.geolocation) return;
    var self = this;
    navigator.geolocation.getCurrentPosition(function(pos) {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + pos.coords.latitude + '&longitude=' + pos.coords.longitude + '&current_weather=true&hourly=precipitation_probability&forecast_days=1&timezone=auto')
        .then(function(res) { return res.json(); })
        .then(function(json) {
          var cw = json && json.current_weather;
          if(!cw) throw new Error('no weather');
          var codes = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',56:'🌦️',57:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
          var icon = codes[cw.weathercode] || '🌡️';
          var temp = Math.round(cw.temperature);
          var rainChance = null;
          if(json.hourly && json.hourly.time && json.hourly.precipitation_probability) {
            var idx = json.hourly.time.indexOf(cw.time);
            if(idx === -1) {
              var nowMs = new Date(cw.time).getTime();
              var bestDiff = Infinity;
              for(var i = 0; i < json.hourly.time.length; i++) {
                var diff = Math.abs(new Date(json.hourly.time[i]).getTime() - nowMs);
                if(diff < bestDiff) { bestDiff = diff; idx = i; }
              }
            }
            if(idx !== -1) rainChance = json.hourly.precipitation_probability[idx];
          }
          var rainPart = rainChance != null ? ' · 🌧️ ' + rainChance + '%' : '';
          var text = icon + ' ' + temp + '°C' + rainPart;
          var el2 = document.getElementById('weatherPill');
          if(el2) el2.textContent = text;
          localStorage.setItem('roundBookWeatherCache', JSON.stringify({text:text, time:Date.now()}));
        })
        .catch(function() {});
    }, function() {}, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
  },

  _swipeState: null,
  _initSwipe: function() {
    var main = document.getElementById('main');
    var self = this;
    main.addEventListener('touchstart', function(e) { self._onSwipeStart(e); }, {passive:true});
    main.addEventListener('touchmove', function(e) { self._onSwipeMove(e); }, {passive:false});

  _onSwipeStart: function(e) {
    var card = e.target.closest('.cust-card[data-id]');
    if(!card) return;
    var touch = e.touches[0];
    this._swipeState = {card:card, startX:touch.clientX, startY:touch.clientY, currentX:0, decided:false, horizontal:false};
  },
  _onSwipeMove: function(e) {
    if(!this._swipeState) return;
    var touch = e.touches[0];
    var dx = touch.clientX - this._swipeState.startX;
    var dy = touch.clientY - this._swipeState.startY;
    if(!this._swipeState.decided) {
      if(Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        this._swipeState.decided = true;
        this._swipeState.horizontal = Math.abs(dx) > Math.abs(dy);
        if(!this._swipeState.horizontal) { this._swipeState = null; return; }
      } else return;
    }
    if(!this._swipeState) return;
    e.preventDefault();
    var maxDrag = 96;
    var clamped = Math.max(-maxDrag, Math.min(maxDrag, dx));
    this._swipeState.currentX = clamped;
    this._swipeState.card.style.transition = 'none';
    this._swipeState.card.style.transform = 'translateX(' + clamped + 'px)';
  },
  _onSwipeEnd: function(e) {
    if(!this._swipeState) return;
    var card = this._swipeState.card;
    var currentX = this._swipeState.currentX;
    var decided = this._swipeState.decided;
    var horizontal = this._swipeState.horizontal;
    card.style.transition = 'transform 0.2s ease';
    card.style.transform = 'translateX(0)';
    if(decided && horizontal && Math.abs(currentX) >= 64) {
      var id = card.dataset.id;
      var kind = card.dataset.kind || 'customer';
      if(currentX > 0) {
        this._quickClean(id);
      } else {
        this._quickPaid(id);
      }
    }
    this._swipeState = null;
  },
  _onSwipeCancel: function(e) {
    if(!this._swipeState) return;
    this._swipeState.card.style.transition = 'transform 0.2s ease';
    this._swipeState.card.style.transform = 'translateX(0)';
    this._swipeState = null;
  },
  _quickClean: function(id) {
    var c = Data.data.customers.find(function(x){ return x.id === id; });
    if(!c) return;
    c.cleanHistory = c.cleanHistory || [];
    c.cleanHistory.push({date: Utils.todayISO(), amount: c.price || 0});
    c.deferUntil = null;
    Data.save();
    this.render();
    this.toast('Marked ' + (c.name || c.address || 'customer') + ' as cleaned today');
  },
  _quickPaid: function(id) {
    var c = Data.data.customers.find(function(x){ return x.id === id; });
    if(!c) return;
    c.paymentHistory = c.paymentHistory || [];
    c.paymentHistory.push({date: Utils.todayISO(), amount: c.price || 0});
    c.paymentReminderSent = false;
    c.paymentReminderSentDate = null;
    c.paymentReminderCount = 0;
    Data.save();
    this.render();
    this.toast('Marked ' + (c.name || c.address || 'customer') + ' as paid');
  }
};

// ===== EXPOSE GLOBALLY =====

document.getElementById('importFile').addEventListener('change', function(e) {

  Backup.importBackup(file).catch(function() {});

document.getElementById('importSpreadsheetFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined') {
    if(window.RoundBook) window.RoundBook.toast('Still loading — try again in a moment');
    e.target.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var wb = XLSX.read(evt.target.result, {type:'array'});
      var firstSheetName = wb.SheetNames[0];
      var ws = wb.Sheets[firstSheetName];
      var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length) { alert('That spreadsheet looks empty.'); e.target.value=''; return; }
      var headers = Object.keys(rows[0]);
      var map = {address:null, name:null, phone:null, email:null, round:null, price:null, frequency:null};
      var normHeaders = headers.map(function(h){ return String(h||'').toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim(); });
      var synonyms = {address:['address','addr','street','street address','property','location'], name:['name','customer','customer name','client','contact name'], phone:['phone','mobile','tel','telephone','contact','contact number','phone number'], email:['email','email address','e-mail'], round:['round','route','area','zone','round name'], price:['price','amount','cost','fee','value','rate','clean price'], frequency:['frequency','freq','weeks','cycle','interval','frequency (weeks)']};
      var mapKeys = Object.keys(synonyms);
      for(var mi = 0; mi < mapKeys.length; mi++) {
        var field = mapKeys[mi];
        var syns = synonyms[field];
        var found = null;
        for(var si = 0; si < syns.length; si++) {
          var idx = normHeaders.indexOf(syns[si]);
          if(idx !== -1) { found = headers[idx]; break; }
        }
        if(!found) {
          for(var hi = 0; hi < normHeaders.length; hi++) {
            for(var si2 = 0; si2 < syns.length; si2++) {
              if(normHeaders[hi].indexOf(syns[si2]) !== -1) { found = headers[hi]; break; }
            }
            if(found) break;
          }
        }
        map[field] = found;
      }
      if(!map.address && !map.name) { alert("Couldn't find an address or name column."); e.target.value=''; return; }
      var imported = 0, skipped = 0;
      var holdingRound = 'Needs review (imported)';
      var roundCusts = Data.data.customers.filter(function(x){ return (x.round||'Unassigned') === holdingRound; });
      var nextOrder = 0;
      for(var rci = 0; rci < roundCusts.length; rci++) {
        nextOrder = Math.max(nextOrder, roundCusts[rci].order != null ? roundCusts[rci].order : -1);
      }
      nextOrder++;
      var existingAddresses = new Set();
      for(var ei = 0; ei < Data.data.customers.length; ei++) {
        var addr = (Data.data.customers[ei].address||'').trim().toLowerCase();
        if(addr) existingAddresses.add(addr);
      }
      for(var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        var address = map.address ? String(row[map.address]||'').trim() : '';
        var name = map.name ? String(row[map.name]||'').trim() : '';
        if(!address && !name) continue;
        var normalized = address.toLowerCase();
        if(address && existingAddresses.has(normalized)) { skipped++; continue; }
        var suggestedRound = map.round ? String(row[map.round]||'').trim() : '';
        var priceRaw = map.price ? parseFloat(String(row[map.price]).replace(/[^0-9.]/g,'')) : NaN;
        var freqRaw = map.frequency ? parseInt(String(row[map.frequency]).replace(/[^0-9]/g,''),10) : NaN;
        var notesParts = ['Imported from spreadsheet'];
        if(suggestedRound) notesParts.push('Suggested round: ' + suggestedRound);
        var newCust = {
          id: Utils.uid(),
          name: name,
          address: address,
          phone: map.phone ? String(row[map.phone]||'').trim() : '',
          email: map.email ? String(row[map.email]||'').trim() : '',
          round: holdingRound,
          order: nextOrder++,
          price: Number.isFinite(priceRaw) ? priceRaw : 0,
          frequencyWeeks: Number.isFinite(freqRaw) && freqRaw > 0 ? freqRaw : 4,
          notes: notesParts.join(' · '),
          cleanHistory: [],
          paymentHistory: [],
          priceHistory: []
        };
        Data.data.customers.push(newCust);
        if(address) existingAddresses.add(normalized);
        imported++;
      }
      Data.save();
      if(window.RoundBook) window.RoundBook.render();
      var summary = skipped ? 'Imported ' + imported + ' customer' + (imported===1?'':'s') + ' — ' + skipped + ' skipped as likely duplicates' : 'Imported ' + imported + ' customer' + (imported===1?'':'s');
      if(imported) {
        if(window.RoundBook) {
          window.RoundBook.openSheet('<div class="sheet-head"><h2>Import complete</h2><button class="sheet-close" onclick="window.RoundBook.closeSheet()">✕</button></div><p style="color:var(--ink);font-size:0.875rem;line-height:1.6;margin:0 2px 10px;">' + Utils.escapeHtml(summary) + '.</p><p style="color:var(--ink-muted);font-size:0.8125rem;line-height:1.6;margin:0 2px 18px;">They\'ve been placed in a <b>"' + Utils.escapeHtml(holdingRound) + '"</b> round for review.</p><button class="btn-primary" style="width:100%;" onclick="window.RoundBook.closeSheet();window.RoundBook.setTab(\'rounds\');window.RoundBook._openRound(\'' + holdingRound + '\');">Review imported customers</button>');
        }
      } else {
        if(window.RoundBook) window.RoundBook.toast(skipped ? 'All ' + skipped + ' rows already exist — nothing imported' : 'Nothing to import');
      }
    } catch(err) {
      alert('That file could not be read. Make sure it\'s a .csv or .xlsx spreadsheet with a header row.');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});
