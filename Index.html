<script>
// ============================================================================

// ===== UTILITY FUNCTIONS =====
const Utils = {
  uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);},
  todayISO(){const d=new Date();return d.toISOString().slice(0,10);},
  fmtDate(iso){if(!iso)return'—';const d=new Date(iso+'T00:00:00');return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2);},
  fmtTime(t){if(!t)return'';const p=t.split(':');const h=parseInt(p[0],10);const m=p[1];if(isNaN(h))return'';return (h%12||12)+':'+m+(h<12?' AM':' PM');},
  daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);},
  money(n){const v=Number(n||0);return'£'+v.toFixed(v%1?2:0);},
  escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));},
  escapeAttr(s){return this.escapeHtml(s);},
  formatBytes(b){if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';if(b<1073741824)return(b/1048576).toFixed(1)+'MB';return(b/1073741824).toFixed(1)+'GB';},
  lastOf(arr){return arr&&arr.length?arr.slice().sort().pop():null;},
  lastDateOf(arr){return arr&&arr.length?arr.slice().map(e=>e.date).sort().pop():null;},
  debounce(fn,w){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn(...a),w);};},
  hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];},
  mixHex(a,b,w){const ca=this.hexToRgb(a),cb=this.hexToRgb(b);const m=ca.map((v,i)=>v+(cb[i]-v)*w);return'#'+m.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
};

// ===== ERROR HANDLING =====
const ErrorHandler = {
  errors:[],
  handle(err,ctx='',sev='error'){const e={message:err.message||String(err),stack:err.stack,context:ctx,severity:sev,timestamp:Date.now()};this.errors.unshift(e);if(this.errors.length>50)this.errors.length=50;console.error('['+sev+']'+ctx+':',err);if(sev==='critical'){const t=document.getElementById('toast');if(t){t.textContent='⚠️ '+(ctx||'Something went wrong');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),4000);}}return e;},
  async retry(fn,n=3,d=1e3,ctx=''){let le;for(let a=1;a<=n;a++){try{return await fn();}catch(e){le=e;if(a<n)await new Promise(r=>setTimeout(r,d*a));}}this.handle(le,ctx||'Retry failed','error');throw le;}
};
window.addEventListener('error',e=>ErrorHandler.handle(e.error||e.message,'Uncaught error','critical'));
window.addEventListener('unhandledrejection',e=>ErrorHandler.handle(e.reason,'Unhandled promise rejection','critical'));

// ===== THEMES =====
const THEMES = {ocean:{name:'Ocean',navy:'#164559',blue:'#3FA9D6'},slate:{name:'Slate',navy:'#3A424C',blue:'#A6B4C2'},rust:{name:'Rust',navy:'#5A2A1C',blue:'#E0723A'},plum:{name:'Plum',navy:'#4A1F52',blue:'#C15FC0'},forest:{name:'Forest',navy:'#1E4A2E',blue:'#4FAE64'},ruby:{name:'Ruby',navy:'#661018',blue:'#FF3B4A'}};

// ===== DATA LAYER =====
const Data = {
  STORE_KEY:'roundBookData_v56',
  APP_VERSION:56,
  data:null,
  saveTimeout:null,
  saveDebounceMs:500,
  drafts:{},
  VERSION_HISTORY:[{version:56,changes:['Complete code reorganization for better performance','Analytics dashboard with revenue trends','Today\'s Schedule view','Search with autocomplete','Voice input for notes','Customizable receipt layout','Encrypted backups with password protection','Improved error handling with retry logic','Auto-save drafts for all text inputs','Fixed timezone handling','Better memory management']},{version:55,changes:['Account numbers now show on every report...']},{version:54,changes:['Every customer now has a unique account number...']},{version:53,changes:['The directions and call buttons are now always blue and green...']}],

  load(){try{const r=localStorage.getItem(this.STORE_KEY);this.data=r?this.migrate(JSON.parse(r)):this.migrate({customers:[]});this.loadDrafts();return this.data;}catch(e){ErrorHandler.handle(e,'Failed to load data','critical');this.data=this.migrate({customers:[]});return this.data;}},
  save(){clearTimeout(this.saveTimeout);this.saveTimeout=setTimeout(()=>this._saveNow(),this.saveDebounceMs);},
  _saveNow(){try{if(!this.data)return false;localStorage.setItem(this.STORE_KEY,JSON.stringify(this.data));return true;}catch(e){ErrorHandler.handle(e,'Failed to save data','critical');setTimeout(()=>{const t=document.getElementById('toast');if(t){t.textContent='⚠️ Storage is full — nothing was saved';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),5000);}},100);return false;}},

  migrate(d){d.customers=d.customers||[];d.oneOffJobs=d.oneOffJobs||[];d.quotes=d.quotes||[];d.settings=d.settings||{};d.oneOffJobs.forEach(j=>{if(!j.photos)j.photos=[];if(!j.messageLog)j.messageLog=[];if(j.paymentReminderCount==null)j.paymentReminderCount=0;});d.quotes.forEach(q=>{if(!q.status)q.status='pending';if(q.followUpDays==null)q.followUpDays=7;});if(!d.settings.encryptedBackups)d.settings.encryptedBackups=false;if(!d.settings.receiptLayout)d.settings.receiptLayout={showCompany:true,showLogo:true,showCustomer:true,showDetails:true,showFooter:true};if(!d.settings.companyName)d.settings.companyName='';if(!d.settings.yourName)d.settings.yourName='';if(!d.settings.bankPayeeName)d.settings.bankPayeeName='';if(!d.settings.bankAccountNumber)d.settings.bankAccountNumber='';if(!d.settings.bankSortCode)d.settings.bankSortCode='';if(!d.settings.nextAccountNumber)d.settings.nextAccountNumber=1001;d.customers.forEach(c=>{if(!c.photos)c.photos=[];if(!c.cleanHistory)c.cleanHistory=[];else if(c.cleanHistory.length&&typeof c.cleanHistory[0]==='string'){c.cleanHistory=c.cleanHistory.map(d=>{return{date:d,amount:c.price||0};});}if(!c.paymentHistory)c.paymentHistory=[];if(!c.priceHistory)c.priceHistory=c.price!=null?[{date:Utils.todayISO(),price:c.price}]:[];if(!c.messageLog)c.messageLog=[];if(c.frequencyWeeks==null)c.frequencyWeeks=4;if(!c.visitDay||c.visitDay<1||c.visitDay>5)c.visitDay=1;if(!c.accountNumber){c.accountNumber=String(d.settings.nextAccountNumber);d.settings.nextAccountNumber++;}});return d;},

  loadDrafts(){try{const r=localStorage.getItem('roundBookDrafts');this.drafts=r?JSON.parse(r):{};}catch{this.drafts={};}},
  saveDraft(k,v){this.drafts[k]={value:v,timestamp:Date.now()};try{localStorage.setItem('roundBookDrafts',JSON.stringify(this.drafts));}catch{}},
  getDraft(k){const d=this.drafts[k];if(!d)return null;if(Date.now()-d.timestamp>7*24*60*60*1000){delete this.drafts[k];return null;}return d.value;},
  clearDraft(k){delete this.drafts[k];try{localStorage.setItem('roundBookDrafts',JSON.stringify(this.drafts));}catch{}},

  photoDbPromise:null,photoStorageAvailable:true,
  async savePhoto(id,blob){try{const db=await this.openPhotoDb();return new Promise((r,x)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>r();tx.onerror=()=>x(tx.error);});}catch(e){ErrorHandler.handle(e,'Failed to save photo','error');throw e;}},
  async getPhoto(id){try{const db=await this.openPhotoDb();return new Promise((r,x)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>r(req.result||null);req.onerror=()=>x(req.error);});}catch{return null;}},
  async deletePhoto(id){try{const db=await this.openPhotoDb();return new Promise((r,x)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>r();tx.onerror=()=>x(tx.error);});}catch{}},
  async getAllPhotos(){const db=await this.openPhotoDb();return new Promise((r,x)=>{const tx=db.transaction('photos','readonly');const store=tx.objectStore('photos');const out=new Map();const req=store.openCursor();req.onsuccess=e=>{const c=e.target.result;if(c){out.set(c.key,c.value);c.continue();}else r(out);};req.onerror=()=>x(req.error);});},
  openPhotoDb(){if(this.photoDbPromise)return this.photoDbPromise;this.photoDbPromise=new Promise((r,x)=>{if(!('indexedDB' in window)){x(new Error('IndexedDB not available'));return;}const req=indexedDB.open('roundBookPhotos',1);req.onupgradeneeded=()=>{req.result.createObjectStore('photos');};req.onsuccess=()=>r(req.result);req.onerror=()=>x(req.error);});this.photoDbPromise.catch(()=>{this.photoStorageAvailable=false;});return this.photoDbPromise;},
  photoUrlCache:new Map(),photoBytesTotal:0,photoCountTotal:0,
  cachePhotoBlob(id,blob){const e=this.photoUrlCache.get(id);if(e)URL.revokeObjectURL(e);this.photoUrlCache.set(id,URL.createObjectURL(blob));},
  uncachePhoto(id){const e=this.photoUrlCache.get(id);if(e){URL.revokeObjectURL(e);this.photoUrlCache.delete(id);}},
  async initPhotoStorage(){await this._migrateLegacyPhotos();await this._preloadAllPhotos();await this._cleanupOrphaned();},
  async _migrateLegacyPhotos(){const jobs=[];const migrateList=(l)=>{(l||[]).forEach(p=>{if(p&&p.dataUrl){const b=this._dataURLToBlob(p.dataUrl);jobs.push(b.then(bl=>this.savePhoto(p.id,bl).then(()=>{delete p.dataUrl;})));}});};(this.data.customers||[]).forEach(c=>migrateList(c.photos));(this.data.oneOffJobs||[]).forEach(j=>migrateList(j.photos));if(jobs.length)await Promise.all(jobs).catch(()=>{});this.save();},
  async _preloadAllPhotos(){try{const all=await this.getAllPhotos();let bytes=0;all.forEach((blob,id)=>{this.cachePhotoBlob(id,blob);bytes+=blob.size;});this.photoBytesTotal=bytes;this.photoCountTotal=all.size;}catch(e){this.photoStorageAvailable=false;}},
  async _cleanupOrphaned(){try{const ref=new Set();(this.data.customers||[]).forEach(c=>(c.photos||[]).forEach(p=>ref.add(p.id)));(this.data.oneOffJobs||[]).forEach(j=>(j.photos||[]).forEach(p=>ref.add(p.id)));const all=await this.getAllPhotos();const toRemove=[...all.keys()].filter(id=>!ref.has(id));if(!toRemove.length)return;await Promise.all(toRemove.map(id=>this.deletePhoto(id).then(()=>{this.uncachePhoto(id);const b=all.get(id);if(b){this.photoBytesTotal-=b.size;this.photoCountTotal--;}})));}catch{}},
  _dataURLToBlob(d){return fetch(d).then(r=>r.blob());},
  blobToDataURL(blob){return new Promise((r,x)=>{const reader=new FileReader();reader.onload=()=>r(reader.result);reader.onerror=x;reader.readAsDataURL(blob);});}
};

// ===== VOICE INPUT =====
const Voice = {isListening:false,recognition:null,onResult:null,supported:false,
  init(){this.supported='webkitSpeechRecognition' in window||'SpeechRecognition' in window;if(!this.supported)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;this.recognition=new SR();this.recognition.continuous=false;this.recognition.interimResults=true;this.recognition.lang='en-GB';this.recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;if(this.onResult)this.onResult(t,e.results[e.resultIndex].isFinal);};this.recognition.onerror=()=>{this.isListening=false;this._updateBtn();};this.recognition.onend=()=>{this.isListening=false;this._updateBtn();};},
  start(cb,fieldId){if(!this.supported){window.RoundBook.toast('Voice not supported');return;}if(this.isListening){this.stop();return;}this.onResult=cb;this.isListening=true;this._updateBtn();try{this.recognition.start();}catch{this.isListening=false;this._updateBtn();}},
  stop(){try{this.recognition.stop();}catch{}this.isListening=false;this._updateBtn();},
  _updateBtn(){const b=document.getElementById('voiceBtn');if(b){b.classList.toggle('listening',this.isListening);b.textContent=this.isListening?'🔴':'🎤';}},
  createBtn(fieldId,cb){if(!this.supported)return'';return'<button id="voiceBtn" class="voice-btn" onclick="window.RoundBook._voiceStart(\''+fieldId+'\')">🎤</button>';}
};Voice.init();

// ===== SEARCH =====
const Search={index:[],isIndexed:false,
  buildIndex(){const d=Data.data;this.index=[];d.customers.forEach(c=>{this.index.push({id:c.id,type:'customer',text:c.address||'',subtext:[c.name,c.phone,c.email,c.round,c.accountNumber].filter(Boolean).join(' · '),searchTerms:[c.address,c.name,c.phone,c.email,c.round,c.accountNumber,c.notes].filter(Boolean).map(s=>s.toLowerCase())});});(d.oneOffJobs||[]).forEach(j=>{this.index.push({id:j.id,type:'job',text:j.address||j.name||'Job',subtext:'One-off job · '+(j.date||''),searchTerms:[j.address,j.name,j.phone,j.notes].filter(Boolean).map(s=>s.toLowerCase())});});this.isIndexed=true;},
  search(q,max=20){if(!this.isIndexed)this.buildIndex();if(!q||q.length<2)return[];const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>0);return this.index.map(item=>{let score=0;const text=item.searchTerms.join(' ');terms.forEach(term=>{if(text.includes(term))score+=2;if(item.text.toLowerCase().startsWith(term))score+=1;if(item.subtext.toLowerCase().includes(term))score+=0.5;});return{...item,score};}).filter(i=>i.score>0).sort((a,b)=>b.score-a.score).slice(0,max);},
  getSuggestions(q){const r=this.search(q,10);return r.map(s=>({text:s.text,subtext:s.subtext,id:s.id,type:s.type,highlight:this._highlight(s.text,q)}));},
  _highlight(text,q){let r=text;q.toLowerCase().split(/\s+/).forEach(w=>{r=r.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="highlight">$1</span>');});return r;},
  renderAutocomplete(inputId,containerId){const inp=document.getElementById(inputId);const cont=document.getElementById(containerId);if(!inp||!cont)return;let sel=-1,sugs=[];inp.addEventListener('input',()=>{const q=inp.value.trim();if(q.length<2){cont.classList.remove('show');return;}sugs=this.getSuggestions(q);if(!sugs.length){cont.classList.remove('show');return;}cont.innerHTML=sugs.map((s,i)=>'<div class="autocomplete-suggestion" data-index="'+i+'" onclick="window.RoundBook._selectSuggestion(\''+inputId+'\',\''+containerId+'\','+i+')"><div>'+s.highlight+'</div><div style="font-size:0.75rem;color:var(--ink-muted);">'+s.subtext+'</div></div>').join('');cont.classList.add('show');sel=-1;});inp.addEventListener('keydown',e=>{const items=cont.querySelectorAll('.autocomplete-suggestion');if(!items.length)return;if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);items.forEach((it,i)=>{it.style.background=i===sel?'var(--blue-dim)':'';});}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,-1);items.forEach((it,i)=>{it.style.background=i===sel?'var(--blue-dim)':'';});}else if(e.key==='Enter'&&sel>=0){e.preventDefault();this._selectSuggestion(inputId,containerId,sel);}else if(e.key==='Escape'){cont.classList.remove('show');}});document.addEventListener('click',e=>{if(!cont.contains(e.target)&&e.target!==inp)cont.classList.remove('show');});},
  _selectSuggestion(inputId,containerId,index){const cont=document.getElementById(containerId);const items=cont.querySelectorAll('.autocomplete-suggestion');if(!items[index])return;const id=items[index].dataset.index;const s=this.getSuggestions(document.getElementById(inputId).value)[id];if(!s)return;document.getElementById(inputId).value=s.text;cont.classList.remove('show');document.getElementById(inputId).dispatchEvent(new Event('input'));if(s.type==='customer'){window.RoundBook.openCustomerDetail(s.id);}else if(s.type==='job'){const job=Data.data.oneOffJobs.find(j=>j.id===s.id);if(job)window.RoundBook.openJobForm(job);}}
};

// ===== BACKUP WITH ENCRYPTION =====
const Backup={encryptionKey:null,
  async exportWithPassword(pw){try{const jsonStr=JSON.stringify(Data.data,null,2);if(pw&&typeof CryptoJS!=='undefined'){const enc=CryptoJS.AES.encrypt(jsonStr,pw);return new Blob([enc.toString()],{type:'application/octet-stream'});}return new Blob([jsonStr],{type:'application/json'});}catch(e){ErrorHandler.handle(e,'Export backup failed','error');throw e;}},
  async importWithPassword(file,pw){try{const text=await file.text();let jsonStr;if(pw&&typeof CryptoJS!=='undefined'){try{const dec=CryptoJS.AES.decrypt(text,pw);jsonStr=dec.toString(CryptoJS.enc.Utf8);if(!jsonStr)throw new Error('Invalid password');}catch{throw new Error('Invalid password or corrupted backup');}}else jsonStr=text;const data=JSON.parse(jsonStr);if(!data.customers||!Array.isArray(data.customers))throw new Error('Invalid backup format');return data;}catch(e){ErrorHandler.handle(e,'Import backup failed','error');throw e;}},
  async exportBackup(){const pw=await this._promptPassword('Set a password for this backup (optional):',true);const blob=await this.exportWithPassword(pw||'');const fn='round-book-backup-'+Utils.todayISO()+(pw?'.encrypted':'')+'.json';if(navigator.canShare){try{const file=new File([blob],fn,{type:'application/octet-stream'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Round Book Backup'});this._markBackedUp();return;}}catch(e){if(e.name==='AbortError')return;}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),2000);this._markBackedUp();},
  async importBackup(file){const pw=await this._promptPassword('Enter password if encrypted (leave blank if not):',false);try{const data=await this.importWithPassword(file,pw||'');if(confirm('Import '+data.customers.length+' customers? This will replace all data.')){Data.data=Data.migrate(data);Data.save();Search.isIndexed=false;window.RoundBook.render();window.RoundBook.toast('Backup restored successfully');}}catch(e){window.RoundBook.toast('❌ '+e.message);throw e;}},
  _promptPassword(msg,isSetting){return new Promise(r=>{const result=prompt(msg);if(result===null){r(null);return;}if(result&&isSetting){const c=prompt('Confirm password:');if(result!==c){alert('Passwords do not match');r(null);return;}}r(result);});},
  _markBackedUp(){localStorage.setItem('roundBookLastBackup',Utils.todayISO());window.RoundBook.render();}
};

// ===== SCHEDULE =====
const Schedule={
  generate(){const today=Utils.todayISO();const tomorrow=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);})();const sched=[];const customers=Data.data.customers||[];customers.forEach(c=>{if(c.paused)return;const next=window.RoundBook.nextDueISO(c);if(next===today||next===tomorrow){const status=window.RoundBook.custStatus(c);sched.push({id:c.id,type:'round',title:c.address||c.name||'Customer',subtitle:'Round: '+(c.round||'Unassigned')+' · '+Utils.money(c.price),date:next,badge:next===today?'Today':'Tomorrow',badgeType:next===today?'today':'round',isOverdue:next===today&&status.cleanBadge?.type==='due',data:c});}});const jobs=Data.data.oneOffJobs||[];jobs.forEach(j=>{if(j.done)return;if(j.date===today||j.date===tomorrow){sched.push({id:j.id,type:'job',title:j.address||j.name||'Job',subtitle:'One-off job · '+Utils.money(j.price)+(j.time?' at '+Utils.fmtTime(j.time):''),date:j.date,time:j.time,badge:j.date===today?'Today':'Tomorrow',badgeType:'job',data:j});}});const quotes=Data.data.quotes||[];quotes.forEach(q=>{if(q.status!=='pending')return;if(window.RoundBook.quoteNeedsFollowUp(q,today)){sched.push({id:q.id,type:'quote',title:q.address||q.name||'Quote',subtitle:'Pending follow-up · '+Utils.money(q.price)+' · Quoted '+Utils.fmtDate(q.date),date:q.date,badge:'Follow up',badgeType:'overdue',data:q,isOverdue:true});}});sched.sort((a,b)=>{if(a.date!==b.date)return a.date.localeCompare(b.date);return(a.time||'').localeCompare(b.time||'');});return sched;},
  render(){const sched=this.generate();if(!sched.length){return'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg><b>Nothing scheduled for today or tomorrow</b><p>Check back later for upcoming work.</p></div>';}const groups={};sched.forEach(i=>{if(!groups[i.date])groups[i.date]=[];groups[i.date].push(i);});let html='<div class="section-label" style="margin-top:0;">Today &amp; Tomorrow</div><div style="margin-bottom:8px;font-size:0.75rem;color:var(--ink-muted);">'+sched.length+' item'+(sched.length===1?'':'s')+' scheduled</div>';Object.keys(groups).sort().forEach(date=>{const label=date===Utils.todayISO()?'Today':'Tomorrow';html+='<div class="day-divider">'+label+' · '+Utils.fmtDate(date)+'</div>';groups[date].forEach(item=>{const badgeClass=item.isOverdue?'overdue':item.badgeType;html+='<div class="schedule-item" onclick="window.RoundBook._openScheduleItem(\''+item.type+'\',\''+item.id+'\')"><div class="schedule-time">'+(item.time?Utils.fmtTime(item.time):'—')+'</div><div class="schedule-details"><div class="title">'+Utils.escapeHtml(item.title)+'</div><div class="sub">'+Utils.escapeHtml(item.subtitle)+'</div></div><span class="schedule-badge '+badgeClass+'">'+item.badge+'</span></div>';});});return html;},
  openItem(type,id){if(type==='round'||type==='customer')window.RoundBook.openCustomerDetail(id);else if(type==='job'){const job=Data.data.oneOffJobs.find(j=>j.id===id);if(job)window.RoundBook.openJobForm(job);}else if(type==='quote'){const quote=Data.data.quotes.find(q=>q.id===id);if(quote)window.RoundBook.openQuoteForm(quote);}}
};

n" style="background:var(--line);color:var(--ink);" onclick="window.RoundBook._resetReceiptLayout()">Reset Default</button></div>';window.RoundBook.openSheet(html,returnTo);document.querySelectorAll('#rec_showCompany,#rec_showLogo,#rec_showCustomer,#rec_showDetails,#rec_showFooter').forEach(el=>{el.addEventListener('change',()=>{const nl={showCompany:document.getElementById('rec_showCompany').checked,showLogo:document.getElementById('rec_showLogo').checked,showCustomer:document.getElementById('rec_showCustomer').checked,showDetails:document.getElementById('rec_showDetails').checked,showFooter:document.getElementById('rec_showFooter').checked};document.getElementById('receiptPreview').innerHTML=this._generatePreview(nl);});});},

  _applyTheme(){const t=THEMES[this.themeName]||THEMES.ocean;const r=document.body.style;r.setProperty('--navy',t.navy);r.setProperty('--blue',t.blue);r.setProperty('--navy-dark',Utils.mixHex(t.navy,'#000000',0.28));r.setProperty('--blue-deep',Utils.mixHex(t.blue,'#000000',0.32));r.setProperty('--blue-dim',this.darkMode?Utils.mixHex(t.blue,'#0E1620',0.82):Utils.mixHex(t.blue,'#FFFFFF',0.86));r.setProperty('--card-tint',this.darkMode?Utils.mixHex(t.blue,'#16212C',0.92):Utils.mixHex(t.blue,'#FFFFFF',0.94));r.setProperty('--bg',this.darkMode?Utils.mixHex(t.blue,'#0E1620',0.90):Utils.mixHex(t.blue,'#F5F7F8',0.92));const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',t.navy);},

  // Customer status helpers
  custStatus(c){const lastClean=Utils.lastDateOf(c.cleanHistory);const lastPaid=Utils.lastOf((c.paymentHistory||[]).map(p=>p.date));const freq=(c.frequencyWeeks||4)*7;let cleanBadge=null;const deferred=c.deferUntil&&c.deferUntil>Utils.todayISO();if(c.paused){cleanBadge={type:'paused',text:c.pauseReason?'Paused — '+c.pauseReason:'Paused'};}else if(deferred){cleanBadge={type:'deferred',text:'Deferred to '+Utils.fmtDate(c.deferUntil)};}else if(lastClean){const due=Utils.daysBetween(lastClean,Utils.todayISO());if(due>=freq){cleanBadge={type:'due',text:due-freq===0?'Due today':'Due +'+(due-freq)};}}else{cleanBadge={type:'due',text:'Never cleaned'};}const totalCharged=(c.cleanHistory||[]).reduce((s,e)=>s+Number(e.amount||0),0);const totalPaid=(c.paymentHistory||[]).reduce((s,p)=>s+Number(p.amount||0),0);const balance=Math.round((totalCharged-totalPaid)*100)/100;const owed=balance>0.005;const credit=balance<-0.005;return{cleanBadge,owed,credit,balance,lastClean,lastPaid};},

  // ===== ROUNDS LIST =====
  _renderRoundsList(main){const rounds=this._groupByRound(Data.data.customers);const roundNames=Object.keys(rounds).sort((a,b)=>a.localeCompare(b));let html='';if(Data.data.customers.length){const active=Data.data.customers.filter(c=>!c.paused);const total=active.length;const value=active.reduce((s,c)=>s+Number(c.price||0),0);const avg=total?value/total:0;html+='<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;"><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._openCustomerSearch()" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._openRoundReports()" aria-label="Print"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button></div><div class="summary-overall"><div class="stat"><div class="num">'+total+'</div><div class="lbl">Customers</div></div><div class="stat"><div class="num">'+Utils.money(value)+'</div><div class="lbl">Round value</div></div><div class="stat"><div class="num">'+Utils.money(avg)+'</div><div class="lbl">Avg / customer</div></div></div>';}html+='<div class="seg-row"><button class="seg-btn '+(this.roundsViewMode==='overview'?'active':'')+'" onclick="window.RoundBook._setRoundsView(\'overview\')">Rounds</button><button class="seg-btn '+(this.roundsViewMode==='due'?'active':'')+'" onclick="window.RoundBook._setRoundsView(\'due\')">Due</button><button class="seg-btn '+(this.roundsViewMode==='owed'?'active':'')+'" onclick="window.RoundBook._setRoundsView(\'owed\')">Owed</button></div>';if(!roundNames.length){main.innerHTML=html+this._emptyState('rounds');return;}if(this.roundsViewMode==='overview'){html+='<div class="section-label">Your rounds</div>';roundNames.forEach(rn=>{const all=rounds[rn];const activeAll=all.filter(c=>!c.paused);const daysUsed=this._roundDaysUsed(all);let due=0,owed=0,paused=0;all.forEach(c=>{const s=this.custStatus(c);if(c.paused)paused++;else if(s.cleanBadge&&s.cleanBadge.type==='due')due++;if(s.owed)owed++;});html+='<div class="round-card" onclick="window.RoundBook._openRound(\''+rn+'\')"><div><div class="rname">'+Utils.escapeHtml(rn)+'</div><div class="rcount">'+all.length+' customer'+(all.length===1?'':'s')+(daysUsed.length>1?' · '+daysUsed.length+' days':'')+'</div></div><div class="badges">'+(due?'<span class="badge due">'+due+' due</span>':'')+(owed?'<span class="badge owed">'+owed+' owe</span>':'')+(paused?'<span class="badge paused">'+paused+' paused</span>':'')+(!due&&!owed?'<span class="badge ok">All clear</span>':'')+'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></div></div>';});}else if(this.roundsViewMode==='due'){let anyDue=false;roundNames.forEach(rn=>{const dueCusts=rounds[rn].filter(c=>{const s=this.custStatus(c);return!c.paused&&s.cleanBadge&&s.cleanBadge.type==='due';}).sort((a,b)=>{const daysDueOf=x=>{const lc=Utils.lastDateOf(x.cleanHistory);return lc?Utils.daysBetween(lc,Utils.todayISO()):0;};return daysDueOf(b)-daysDueOf(a);});if(!dueCusts.length)return;anyDue=true;const anyPhone=dueCusts.some(c=>this._isMobileNumber(c.phone));html+='<div class="round-group-header" style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;"><div class="section-label" style="margin:0;">'+Utils.escapeHtml(rn)+' <span style="font-weight:600;color:var(--ink-muted);text-transform:none;letter-spacing:0;">('+dueCusts.length+')</span></div>'+(an   // ===== WEATHER =====
  _loadWeather(){const el=document.getElementById('weatherPill');if(!el)return;const cacheRaw=localStorage.getItem('roundBookWeatherCache');let cache=null;try{cache=cacheRaw?JSON.parse(cacheRaw):null;}catch{}if(cache&&cache.text)el.textContent=cache.text;const cacheAgeMs=cache?Date.now()-cache.time:Infinity;if(cacheAgeMs<30*60*1000)return;if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async pos=>{try{const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&current_weather=true&hourly=precipitation_probability&forecast_days=1&timezone=auto');if(!res.ok)throw new Error('bad response');const json=await res.json();const cw=json&&json.current_weather;if(!cw)throw new Error('no weather');const codes={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',56:'🌦️',57:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};const icon=codes[cw.weathercode]||'🌡️';const temp=Math.round(cw.temperature);let rainChance=null;if(json.hourly&&json.hourly.time&&json.hourly.precipitation_probability){let idx=json.hourly.time.indexOf(cw.time);if(idx===-1){const nowMs=new Date(cw.time).getTime();let bestDiff=Infinity;json.hourly.time.forEach((t,i)=>{const diff=Math.abs(new Date(t).getTime()-nowMs);if(diff<bestDiff){bestDiff=diff;idx=i;}});}if(idx!==-1)rainChance=json.hourly.precipitation_probability[idx];}const rainPart=rainChance!=null?' · 🌧️ '+rainChance+'%':'';const text=icon+' '+temp+'°C'+rainPart;const el2=document.getElementById('weatherPill');if(el2)el2.textContent=text;localStorage.setItem('roundBookWeatherCache',JSON.stringify({text,time:Date.now()}));}catch(e){}},()=>{}, {enableHighAccuracy:false,timeout:10000,maximumAge:600000});},

  _analyticsHTML(){const d=Data.data;const customers=d.customers||[];const active=customers.filter(c=>!c.paused);const total=active.length;const value=active.reduce((s,c)=>s+Number(c.price||0),0);const avg=total?value/total:0;let owed=0,owedCount=0;customers.forEach(c=>{const s=this.custStatus(c);if(s.owed){owed+=s.balance;owedCount++;}});let payments=[];customers.forEach(c=>{(c.paymentHistory||[]).forEach(p=>{payments.push({date:p.date,amount:Number(p.amount||0)});});});(d.oneOffJobs||[]).forEach(j=>{if(j.paid)payments.push({date:j.paidDate||j.date,amount:Number(j.price||0)});});const totalRevenue=payments.reduce((s,p)=>s+p.amount,0);const totalPayments=payments.length;const now=new Date();const last30=payments.filter(p=>new Date(p.date+'T00:00:00')>=new Date(now.getTime()-30*24*60*60*1000)).reduce((s,p)=>s+p.amount,0);const last90=payments.filter(p=>new Date(p.date+'T00:00:00')>=new Date(now.getTime()-90*24*60*60*1000)).reduce((s,p)=>s+p.amount,0);const last365=payments.filter(p=>new Date(p.date+'T00:00:00')>=new Date(now.getTime()-365*24*60*60*1000)).reduce((s,p)=>s+p.amount,0);return'<div class="analytics-grid"><div class="analytics-card"><div class="value">'+total+'</div><div class="label">Active Customers</div></div><div class="analytics-card"><div class="value">'+Utils.money(value)+'</div><div class="label">Total Round Value</div></div><div class="analytics-card"><div class="value">'+Utils.money(avg)+'</div><div class="label">Avg per Customer</div></div><div class="analytics-card"><div class="value '+(owed>0?'analytics-trend-down':'analytics-trend-up')+'">'+Utils.money(owed)+'</div><div class="label">Outstanding ('+owedCount+' customers)</div></div><div class="analytics-card"><div class="value">'+Utils.money(totalRevenue)+'</div><div class="label">All Time Revenue</div></div><div class="analytics-card"><div class="value">'+totalPayments+'</div><div class="label">Total Payments</div></div></div><div class="section-label">Revenue</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;"><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">'+Utils.money(last30)+'</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 30 days</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">'+Utils.money(last90)+'</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 90 days</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">'+Utils.money(last365)+'</div><div style="font-size:0.6562rem;color:var(--ink-muted);">Last 12 months</div></div><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:10px;padding:10px;text-align:center;"><div style="font-weight:700;font-size:0.8125rem;">'+Utils.money(totalRevenue)+'</div><div style="font-size:0.6562rem;color:var(--ink-muted);">All time</div></div></div><div style="font-size:0.75rem;color:var(--ink-muted);text-align:center;border-top:1px solid var(--line);padding-top:12px;">Data as of '+Utils.fmtDate(Utils.todayISO())+'</div>';},

  _renderJobs(main){const jobs=Data.data.oneOffJobs||[];if(!jobs.length){main.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><b>No one-off jobs yet</b><p>Tap the blue + button to add a gutter clean, one-time job, or anything outside your regular rounds.</p></div>';return;}let html='<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;"><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._printAllJobs()" aria-label="Print"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button></div><div class="section-label">'+jobs.length+' one-off job'+(jobs.length===1?'':'s')+'</div>';jobs.sort((a,b)=>{if(!!a.done!==!!b.done)return a.done?1:-1;return(a.date||'').localeCompare(b.date||'');});jobs.forEach(j=>{const today=Utils.todayISO();const isFuture=!j.done&&j.date&&j.date>today;const statusBadge=j.done?'<span class="badge ok">Done</span>':isFuture?'<span class="badge due">Scheduled</span>':'<span class="badge overdue">Not done</span>';html+='<div class="swipe-wrap"><div class="swipe-bg swipe-bg-left">✓ Done</div><div class="swipe-bg swipe-bg-right">💷 Paid</div><div class="cust-card" data-id="'+j.id+'" data-kind="job"><div class="cust-top" onclick="window.RoundBook.openJobForm(Data.data.oneOffJobs.find(x=>x.id===\''+j.id+'\'))"><div><div class="cust-addr" style="font-size:1rem;font-weight:800;color:var(--ink);">'+Utils.escapeHtml(j.address||'No address')+'</div>'+(j.name||j.phone)?'<div class="cust-name" style="font-size:0.8125rem;font-weight:600;color:var(--ink-muted);margin-top:2px;">'+[Utils.escapeHtml(j.name||''),j.phone?Utils.escapeHtml(j.phone):''].filter(Boolean).join(' · ')+'</div>':''+'<div style="font-size:0.75rem;color:var(--ink-muted);margin-top:2px;">'+Utils.fmtDate(j.date)+(j.time?' at '+Utils.fmtTime(j.time):'')+(j.remind24h?' · 🔔 Reminder set':'')+'</div></div><div class="cust-right"><div class="cust-price">'+Utils.money(j.price)+'</div><div class="cust-btn-row">'+(j.phone?'<button class="call-btn" onclick="event.stopPropagation();window.RoundBook._callCustomer(\'job\',\''+j.id+'\')" title="Call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>':'')+(j.address?'<button class="dir-btn" onclick="event.stopPropagation();window.RoundBook._openDirections(\'job\',\''+j.id+'\')" title="Directions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg></button>':'')+'</div></div></div><div class="cust-meta">'+statusBadge+'<span class="badge '+(j.paid?'ok':'owed')+'">'+(j.paid?'Paid':'Unpaid')+'</span>'+(j.photos&&j.photos.length?'<span class="badge paused">📷 '+j.photos.length+'</span>':'')+'</div></div></div>';});const total=jobs.reduce((s,j)=>s+Number(j.price||0),0);html+='<div style="text-align:right;font-weight:800;font-size:0.9375rem;color:var(--emphasis);padding:10px 4px 4px;">'+jobs.length+' job'+(jobs.length===1?'':'s')+' · '+Utils.money(total)+'</div>';main.innerHTML=html;},
  _printAllJobs(){this.toast('Print all jobs - would generate the jobs report');},
  
  _renderQuotes(main){const quotes=Data.data.quotes||[];if(!quotes.length){main.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#66798A" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><b>No quotes yet</b><p>Tap the blue + button to note down a quote — you can turn it into a customer or a one-off job later.</p></div>';return;}let html='<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;"><button class="btn-open" style="width:38px;height:38px;padding:0;" onclick="window.RoundBook._printQuotes()" aria-label="Print"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></button></div><div class="section-label">'+quotes.length+' quote'+(quotes.length===1?'':'s')+'</div>';quotes.sort((a,b)=>b.date.localeCompare(a.date));quotes.forEach(q=>{const today=Utils.todayISO();const needsFollowUp=this.quoteNeedsFollowUp(q,today);const statusLabel=q.status==='accepted'?'Accepted':q.status==='declined'?'Declined':q.status==='converted'?'Converted':'Pending';const statusClass=q.status==='accepted'?'':q.status==='declined'?'overdue':q.status==='converted'?'':needsFollowUp?'due':'';html+='<div class="swipe-wrap"><div class="swipe-bg swipe-bg-left">✓ Accept</div><div class="swipe-bg swipe-bg-right">✕ Decline</div><div class="cust-card" data-id="'+q.id+'" data-kind="quote"><div class="cust-top" onclick="window.RoundBook.openQuoteForm(Data.data.quotes.find(x=>x.id===\''+q.id+'\'))"><div><div class="cust-addr" style="font-size:1rem;font-weight:800;color:var(--ink);">'+Utils.escapeHtml(q.address||'No address')+'</div>'+(q.name||q.phone)?'<div class="cust-name" style="font-size:0.8125rem;font-weight:600;color:var(--ink-muted);margin-top:2px;">'+[Utils.escapeHtml(q.name||''),q.phone?Utils.escapeHtml(q.phone):''].filter(Boolean).join(' · ')+'</div>':''+'<div style="font-size:0.75rem;color:var(--ink-muted);margin-top:2px;">'+Utils.fmtDate(q.date)+'</div></div><div class="cust-price">'+Utils.money(q.price)+'</div></div><div class="cust-meta"><span class="badge '+statusClass+'">'+statusLabel+'</span>'+(q.fromJobId?'<span class="badge anniversary">🔁 Repeat work</span>':'')+(needsFollowUp?'<span class="badge overdue">⏰ Follow up — '+Utils.daysBetween(q.date,today)+'d since quoted</span>':'')+'</div></div></div>';});const total=quotes.reduce((s,q)=>s+Number(q.price||0),0);html+='<div style="text-align:right;font-weight:800;font-size:0.9375rem;color:var(--emphasis);padding:10px 4px 4px;">'+quotes.length+' quote'+(quotes.length===1?'':'s')+' · '+Utils.money(total)+'</div>';main.innerHTML=html;},
  _printQuotes(){this.toast('Print quotes - would generate the quotes report');},
  
  // Customer form placeholder
  openCustomerForm(){this.toast('Customer form - would open the add customer form');}
};

// Add the backup render function to Backup
Backup.renderBackupUI = function() {
  const stats = this._computeStats();
  const days = window.RoundBook._daysSinceBackup();
  const lastText = days === Infinity ? "You haven't backed up yet" : days === 0 ? "Backed up today" : "Last backup: " + days + " day" + (days === 1 ? '' : 's') + " ago";
  let html = '<p style="color:var(--ink-muted);font-size:0.8438rem;line-height:1.5;margin:0 2px 4px;">Everything is stored only on this phone, in this browser. Nothing is sent anywhere. Export a backup regularly in case the app data is ever cleared.</p><p style="color:' + (days >= 7 ? 'var(--amber)' : 'var(--ink-muted)') + ';font-size:0.7812rem;font-weight:700;margin:0 2px 16px;">' + lastText + '</p><div style="background:var(--surface);border:1px solid var(--box-border);border-radius:12px;padding:14px;margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;"><span style="font-size:0.8125rem;font-weight:800;color:var(--ink);">Customer &amp; job data</span><span style="font-size:0.9375rem;font-weight:800;color:var(--ink);">' + Utils.formatBytes(stats.totalBytes) + '</span></div><div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:' + stats.pctUsed + '%;background:' + stats.barColor + ';border-radius:3px;"></div></div></div>' + (stats.photoCount > 0 ? '<div style="background:var(--surface);border:1px solid var(--box-border);border-radius:12px;padding:14px;margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;"><span style="font-size:0.8125rem;font-weight:800;color:var(--ink);">Photos</span><span style="font-size:0.9375rem;font-weight:800;color:var(--ink);">' + Utils.formatBytes(stats.photoBytes) + (stats.photoPct !== null ? ' of ' + Utils.formatBytes(stats.photoQuota) : '') + '</span></div>' + (stats.photoPct !== null ? '<div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:' + stats.photoPct + '%;background:' + stats.photoBarColor + ';border-radius:3px;"></div></div>' : '') + '</div>' : '') + '<button class="backup-btn" onclick="window.RoundBookBackup.exportBackup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><div><div class="t1">Export backup ' + (Data.data.settings.encryptedBackups ? '🔒' : '') + '</div><div class="t2">' + Data.data.customers.length + ' customers · ' + (Data.data.settings.encryptedBackups ? 'Password protected' : 'Unencrypted') + '</div></div></button><button class="backup-btn" onclick="document.getElementById(\'importFile\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg><div><div class="t1">Restore from backup</div><div class="t2">' + (Data.data.settings.encryptedBackups ? '🔒 Password protected' : 'Unencrypted') + '</div></div></button><button class="backup-btn" onclick="document.getElementById(\'importSpreadsheetFile\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/><path d="M14 14l3 3 3-3" transform="translate(0,-2)"/></svg><div><div class="t1">Import customers from spreadsheet</div><div class="t2">.csv or .xlsx — added to a "needs review" round</div></div></button><div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);"><label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-size:0.8125rem;font-weight:600;"><input type="checkbox" id="encryptedBackupsToggle" ' + (Data.data.settings.encryptedBackups ? 'checked' : '') + ' onchange="Data.data.settings.encryptedBackups=this.checked;Data.save();"><span>Encrypt backups by default</span></label><p style="color:var(--ink-muted);font-size:0.75rem;margin:4px 2px 0;line-height:1.4;">When enabled, all new backups will be encrypted with a password.</p></div>';
  return html;
};

Backup._computeStats = function() {
  const jsonStr = JSON.stringify(Data.data);
  const totalBytes = new Blob([jsonStr]).size;
  const assumedLimit = 5 * 1024 * 1024;
  const pctUsed = Math.min(100, Math.round((totalBytes / assumedLimit) * 100));
  const barColor = pctUsed >= 80 ? 'var(--red)' : pctUsed >= 50 ? 'var(--amber)' : 'var(--green)';
  let photoBytes = Data.photoBytesTotal || 0;
  let photoCount = Data.photoCountTotal || 0;
  (Data.data.customers||[]).forEach(c => {(c.photos||[]).forEach(p => { if(p.dataUrl){ photoBytes += new Blob([p.dataUrl]).size; photoCount++; } });});
  (Data.data.oneOffJobs||[]).forEach(j => {(j.photos||[]).forEach(p => { if(p.dataUrl){ photoBytes += new Blob([p.dataUrl]).size; photoCount++; } });});
  return {totalBytes, pctUsed, barColor, photoBytes, photoCount, photoPct: null, photoQuota: null, photoBarColor: 'var(--green)'};
};

// Initialize
document.addEventListener('DOMContentLoaded', () => window.RoundBook.init());
if (document.readyState !== 'loading') window.RoundBook.init();

// Expose Backup globally for the UI
window.RoundBookBackup = Backup;

console.log('Round Book v56 loaded successfully!');
console.log('📊 New features: Analytics, Schedule, Voice input, Autocomplete, Encrypted backups, Customizable receipts, Auto-save');
</script>
